# Companion to ci.yml / rust.yml. Ordinary labeled/unlabeled events must not
# start those workflows: a skipped job named linux-gates is treated as success
# and would satisfy the required check. This file has no job of that name.
#
# Adding `ci:full` or `enhancement` dispatches ci.yml (and rust.yml when the PR
# touches Rust paths). Enhancement alone re-runs Linux; ci:full preserves the
# full platform matrix, including when enhancement is added to an already-full PR.
name: ci label retrigger

on:
  pull_request:
    types: [labeled]
  # This trigger loads workflow policy from the default branch. It never runs
  # PR artifacts or scripts with the existing Actions-write token.
  workflow_run:
    workflows: [ci, rust]
    types: [requested, completed]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  # Delivery order is not guaranteed. An old event must not cancel the newer
  # head's dispatcher before either reaches dispatch-context validation.
  group: ${{ github.event_name == 'workflow_run' && format('ci-cancel-controller-{0}', github.run_id) || format('ci-label-retrigger-{0}-{1}-{2}-{3}', github.workflow, github.event.pull_request.number, github.event.pull_request.head.sha, github.event.label.name) }}
  cancel-in-progress: true

jobs:
  retrigger:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft != true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.label.name == 'ci:full' || github.event.label.name == 'enhancement')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch ci.yml and rust.yml for this head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CI_SCOPE: ${{ (github.event.label.name == 'ci:full' || contains(github.event.pull_request.labels.*.name, 'ci:full')) && 'full' || 'linux' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            ''|main|master|HEAD|*..*|*" "*) echo "unsafe HEAD_REF"; exit 1 ;;
          esac
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF" -f "scope=$CI_SCOPE" -f "pr_number=$PR_NUMBER" -f "pr_head_sha=$PR_HEAD_SHA" -f "merge_sha=$MERGE_SHA"
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')"
          # Same Rust-owned path set as RUST_PATHS in rust.yml (book, costs, PnL,
          # signals, feed normalization); tools/test_ci_dispatch_scope.py checks both agree.
          if printf '%s\n' "$files" | grep -Eq '^(rust/|app/quant/book/|app/quant/costs\.py$|app/quant/pnl\.py$|app/quant/signals\.py$|app/ingest/normalize\.py$|app/tests/quant/book/|app/tests/quant/test_pnl\.py$|app/tests/quant/test_costs_rust_parity\.py$|app/tests/quant/test_signals\.py$|app/tests/quant/test_signals_rust_parity\.py$|app/tests/quant/test_w21_cost_model\.py$|app/tests/ingest/test_normalize\.py$|app/tests/ingest/test_normalize_rust_parity\.py$|\.github/|tools/required_ci_gate\.py$|tools/test_queue_gates\.py$)'; then
            gh workflow run rust.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF" -f "scope=$CI_SCOPE" -f "pr_number=$PR_NUMBER" -f "pr_head_sha=$PR_HEAD_SHA" -f "merge_sha=$MERGE_SHA"
          fi

  cancel-ancestors:
    # Trigger names are an initial filter, not provenance proof. The script
    # verifies numeric workflow/run/PR/repository identity through the API.
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci/ci_cancel_controller.py
          sparse-checkout-cone-mode: false
      - name: Cancel only verified obsolete PR CI runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f scripts/ci/ci_cancel_controller.py ]; then
            echo "::notice::Cancellation policy is not on the default branch yet; shared PR queues remain intact."
            exit 0
          fi
          python3 -X utf8 -B scripts/ci/ci_cancel_controller.py
