          int csl_mkdir_p(const char *path, mode_t mode)
          {
              char tmp[PATH_MAX];
              size_t i, n;
              if (!path || path[0] != '/') {
                  return -1;
              }
              n = strlen(path);
              if (n >= sizeof tmp) {
                  return -1;
              }
              memcpy(tmp, path, n + 1);
              for (i = 1; i < n; i++) {
                  if (tmp[i] == '/') {
                      tmp[i] = 0;
                      if (mkdir(tmp, mode) < 0 && errno != EEXIST) {
                          return -1;
                      }
                      tmp[i] = '/';
                  }
              }
              if (mkdir(tmp, mode) < 0 && errno != EEXIST) {
                  return -1;
              }
              return 0;
          }

          int csl_write_file(const char *path, const void *data, size_t n, mode_t mode)
          {
              int fd = open(path, O_WRONLY | O_CREAT | O_TRUNC | O_CLOEXEC, mode);
              if (fd < 0) {
                  return -1;
              }
              if (csl_write_all(fd, data, n) < 0) {
                  close(fd);
                  return -1;
              }
              if (fchmod(fd, mode) < 0) {
                  close(fd);
                  return -1;
              }
              close(fd);
              return 0;
          }

          int csl_read_file(const char *path, char *buf, size_t cap, size_t *n)
          {
              int fd = open(path, O_RDONLY | O_CLOEXEC);
              size_t got = 0;
              if (fd < 0) {
                  return -1;
              }
              if (csl_read_all(fd, (unsigned char *)buf, cap - 1, &got) < 0) {
                  close(fd);
                  return -1;
              }
              close(fd);
              buf[got] = 0;
              if (n) {
                  *n = got;
              }
              return 0;
          }

          int csl_path_root_owned(const char *path)
          {
              struct stat st;
              if (lstat(path, &st) < 0) {
                  return 0;
              }
              if (st.st_uid != 0) {
                  return 0;
              }
              if (st.st_mode & (S_IWGRP | S_IWOTH)) {
                  return 0;
              }
              return 1;
          }

          int csl_ancestors_root_owned(const char *path)
          {
              char tmp[PATH_MAX];
              size_t n;
              if (!path || path[0] != '/') {
                  return 0;
              }
              n = strlen(path);
              if (n >= sizeof tmp) {
                  return 0;
              }
              memcpy(tmp, path, n + 1);
              while (n > 1) {
                  char *slash;
                  if (!csl_path_root_owned(tmp)) {
                      return 0;
                  }
                  slash = strrchr(tmp, '/');
                  if (!slash) {
                      break;
                  }
                  if (slash == tmp) {
                      tmp[1] = 0;
                      return csl_path_root_owned(tmp);
                  }
                  *slash = 0;
                  n = strlen(tmp);
              }
              return 1;
          }

          int csl_truthy(const char *value)
          {
              if (!value || !value[0]) {
                  return 0;
              }
              return strcmp(value, "1") == 0 || strcasecmp(value, "true") == 0 ||
                     strcasecmp(value, "yes") == 0 || strcasecmp(value, "on") == 0;
          }

          int csl_env_present(const char *name)
          {
              return getenv(name) != NULL;
          }

          const char *csl_env_get(const char *name)
          {
              const char *v = getenv(name);
              return v ? v : "";
