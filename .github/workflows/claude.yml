          void csl_reconstruct(unsigned tokens, char *out, size_t cap)
          {
              char inner[128];
              size_t i, o = 0;
              inner[0] = 0;
              for (i = 0; i < 4; i++) {
                  if (tokens & (1u << i)) {
                      if (o) {
                          memcpy(inner + o, ", ", 2);
                          o += 2;
