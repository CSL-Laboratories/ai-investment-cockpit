  devin-review-fix:
    needs: resolve-pr
    # Batched fixer: Codex FIX / 20-minute timeout dispatch, or a human
    # workflow_dispatch. Devin reviews still pass resolve-pr (audit) but do
    # not start this job; that is the CSL-103 cost gate.
    if: >-
