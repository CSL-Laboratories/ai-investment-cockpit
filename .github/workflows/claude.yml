          void csl_hex32(const unsigned char in[32], char out[65])
          {
              static const char *hex = "0123456789abcdef";
              int i;
              for (i = 0; i < 32; i++) {
                  out[i * 2] = hex[in[i] >> 4];
                  out[i * 2 + 1] = hex[in[i] & 0xf];
              }
              out[64] = 0;
          }

          int csl_hex_eq(const unsigned char digest[32], const char *hex64)
          {
