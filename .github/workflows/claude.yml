              matches: List[str] = []
              root = Path(action_dir)
              if not root.is_dir():
                  raise BindError("action_dir")
              for path in root.rglob("sdk.mjs"):
                  if path.is_file() and not path.is_symlink():
                      matches.append(str(path))
              if len(matches) != 1:
