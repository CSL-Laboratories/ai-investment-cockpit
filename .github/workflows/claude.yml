            GitHub API: `python3 ${{ runner.temp }}/claude-fixer-guard/model-api -- read|threads|comments|review-comments|reviews` reads (one operation).
            Writes are only queued: for comment/reply, Write a UTF-8 BODY_FILE at .claude-fixer-replies/NAME.txt containing only the comment text, then run the exact helper command. The workflow posts queued writes as claude[bot] after this job, and only after its own live-PR checks. Bodies must not contain HTML comments (`<!--`); the workflow rejects the whole queue if one does.
