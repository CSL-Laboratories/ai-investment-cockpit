                      return False
              return True


          def sudo_conf_plugin_ok(text: str) -> bool:
              """D10 0b step 5: fail closed if sudo.conf loads a Plugin that overrides policy."""
              for raw in text.splitlines():
                  line = raw.split("#", 1)[0].strip()
                  if line.lower().startswith("plugin"):
