          classify_inline_comments: "false"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Read-only job token: no OIDC App-token exchange in this job.
          github_token: ${{ github.token }}
          bot_id: "209825114"
          bot_name: "claude[bot]"
          settings: |
            {
              "permissions": {
                "deny": [
                  "Read(.env)",
                  "Read(.env.*)",
                  "Edit(.github/workflows/**)",
                  "Write(.github/workflows/**)",
                  "Edit(.git/**)",
                  "Write(.git/**)",
                  "Edit(/${{ runner.temp }}/claude-fixer-guard/**)",
                  "Write(/${{ runner.temp }}/claude-fixer-guard/**)",
                  "Edit(.claude/**)",
                  "Write(.claude/**)",
                  "Edit(~/.claude/**)",
                  "Write(~/.claude/**)",
                  "Read(.git/config)",
                  "Read(/${{ runner.temp }}/claude-fixer-guard/read-token)"
                ]
