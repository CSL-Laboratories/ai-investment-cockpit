          int csl_read_pidfd_pid(int pidfd, pid_t *out)
          {
              char path[64], buf[4096], *p;
              int fd;
              ssize_t n;
              snprintf(path, sizeof path, "/proc/self/fdinfo/%d", pidfd);
              fd = open(path, O_RDONLY | O_CLOEXEC);
              if (fd < 0) {
                  return -1;
              }
              n = read(fd, buf, sizeof buf - 1);
              close(fd);
              if (n <= 0) {
                  return -1;
              }
              buf[n] = 0;
              p = strstr(buf, "Pid:");
              if (!p) {
                  p = strstr(buf, "pid:");
              }
              if (!p) {
                  return -1;
              }
              p += 4;
              while (*p == ' ' || *p == '\t') {
                  p++;
              }
              *out = (pid_t)atoi(p);
              return (*out > 0) ? 0 : -1;
          }

