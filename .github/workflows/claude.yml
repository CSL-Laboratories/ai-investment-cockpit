          static char **build_child_env(char *home, char *user)
          {
              static char *envp[64];
              static char storage[64][512];
              int n = 0;
          #define ADD(k, v)                                                              \
              do {                                                                       \
                  if (n >= 63) {                                                         \
                      refuse("env");                                                     \
                  }                                                                      \
                  snprintf(storage[n], sizeof storage[n], "%s=%s", k, v);                \
