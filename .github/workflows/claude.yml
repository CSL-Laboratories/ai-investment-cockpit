          {
              char path[64];
              ssize_t n;
              snprintf(path, sizeof path, "/proc/%d/exe", (int)pid);
              n = readlink(path, buf, len - 1);
              if (n < 0) {
                  return -1;
              }
              buf[n] = 0;
              return 0;
          }

