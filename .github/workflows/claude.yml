              }
              csl_hex32(digest, got);
              return strcmp(got, hex64) == 0;
          }

          int csl_lookup_user(uid_t uid, char *name, size_t nlen, char *home, size_t hlen)
          {
              FILE *f = fopen("/etc/passwd", "r");
              char line[1024];
              if (!f) {
                  return -1;
              }
              while (fgets(line, sizeof line, f)) {
                  char *fields[7];
                  int n = 0;
                  char *p = line;
                  char *nl = strchr(line, '\n');
                  if (nl) {
                      *nl = 0;
                  }
                  fields[n++] = p;
                  for (; *p && n < 7; p++) {
                      if (*p == ':') {
                          *p = 0;
                          fields[n++] = p + 1;
                      }
                  }
                  if (n < 6) {
                      continue;
                  }
                  if ((uid_t)atoi(fields[2]) == uid) {
                      snprintf(name, nlen, "%s", fields[0]);
                      snprintf(home, hlen, "%s", fields[5]);
                      fclose(f);
                      return 0;
                  }
              }
              fclose(f);
              return -1;
          }

          pid_t csl_proc_ppid(pid_t pid)
          {
              char path[64], buf[4096];
              int fd;
              char *rparen;
              char state = 0;
              int pp = 0;
              snprintf(path, sizeof path, "/proc/%d/stat", (int)pid);
              fd = open(path, O_RDONLY | O_CLOEXEC);
              if (fd < 0) {
                  return 0;
              }
              if (read(fd, buf, sizeof buf - 1) <= 0) {
                  close(fd);
                  return 0;
              }
              close(fd);
              rparen = strrchr(buf, ')');
              if (!rparen || sscanf(rparen + 2, "%c %d", &state, &pp) != 2) {
                  return 0;
              }
              return (pid_t)pp;
          }

          int csl_lookup_name(const char *name, uid_t *uid)
          {
              FILE *f;
              char line[1024];
              if (!name || !uid) {
                  return -1;
              }
              f = fopen("/etc/passwd", "r");
              if (!f) {
                  return -1;
              }
              while (fgets(line, sizeof line, f)) {
                  char *fields[7];
                  int n = 0;
                  char *p = line;
                  char *nl = strchr(line, '\n');
                  if (nl) {
                      *nl = 0;
                  }
                  fields[n++] = p;
                  for (; *p && n < 7; p++) {
                      if (*p == ':') {
                          *p = 0;
                          fields[n++] = p + 1;
                      }
                  }
                  if (n < 3) {
                      continue;
                  }
                  if (strcmp(fields[0], name) == 0) {
                      *uid = (uid_t)atoi(fields[2]);
                      fclose(f);
                      return 0;
                  }
              }
              fclose(f);
              return -1;
          }

          int csl_e3_record_ok(const char *text, size_t n)
          {
              static const char *ok[] = {
                  "claude_sha256", "claude_realpath_class", "sdk_mjs_sha256", "sdk_source",
                  "sdk_disk_match", "bun_tofu_sha256", "bwrap_sha256", "socat_sha256",
                  "bash_sha256", "match", "handoff_count", "handoff_conflict", NULL
              };
              char buf[4096];
              char *line, *save = NULL;
              int saw = 0, need = 0, i;
              unsigned present = 0;
              while (ok[need]) {
                  need++;
              }
              if (n == 0 || n >= sizeof buf) {
                  return 0;
              }
              memcpy(buf, text, n);
              buf[n] = 0;
              for (line = strtok_r(buf, "\n", &save); line; line = strtok_r(NULL, "\n", &save)) {
                  char *eq = strchr(line, '=');
                  size_t klen;
                  int found = 0;
                  if (!eq || eq == line) {
                      return 0;
                  }
                  klen = (size_t)(eq - line);
                  for (i = 0; ok[i]; i++) {
                      if (strlen(ok[i]) == klen && memcmp(line, ok[i], klen) == 0) {
                          if (present & (1u << i)) {
                              return 0;
                          }
                          present |= (1u << i);
                          found = 1;
                          break;
                      }
                  }
                  if (!found) {
                      return 0;
                  }
                  if (strchr(eq + 1, ' ') || strchr(eq + 1, '\t')) {
                      return 0;
                  }
                  saw++;
              }
              return saw == need;
          }

          int csl_pidfd_open(pid_t pid, unsigned int flags)
          {
              return (int)syscall(__NR_pidfd_open, pid, flags);
          }

          int csl_read_pidfd_pid(int pidfd, pid_t *out)
          {
              char path[64], buf[4096], *p;
              int fd;
              ssize_t n;
              snprintf(path, sizeof path, "/proc/self/fdinfo/%d", pidfd);
              fd = open(path, O_RDONLY | O_CLOEXEC);
              if (fd < 0) {
                  return -1;
              }
              n = read(fd, buf, sizeof buf - 1);
              close(fd);
              if (n <= 0) {
                  return -1;
              }
              buf[n] = 0;
              p = strstr(buf, "Pid:");
              if (!p) {
                  p = strstr(buf, "pid:");
              }
              if (!p) {
                  return -1;
              }
              p += 4;
              while (*p == ' ' || *p == '\t') {
                  p++;
              }
              *out = (pid_t)atoi(p);
              return (*out > 0) ? 0 : -1;
          }

          int csl_proc_exe(pid_t pid, char *buf, size_t len)
          {
              char path[64];
              ssize_t n;
              snprintf(path, sizeof path, "/proc/%d/exe", (int)pid);
              n = readlink(path, buf, len - 1);
              if (n < 0) {
                  return -1;
              }
              buf[n] = 0;
              return 0;
          }

          int csl_proc_cmdline(pid_t pid, char *buf, size_t len, size_t *nuls)
          {
              char path[64];
              int fd;
              ssize_t n;
              snprintf(path, sizeof path, "/proc/%d/cmdline", (int)pid);
              fd = open(path, O_RDONLY | O_CLOEXEC);
              if (fd < 0) {
                  return -1;
              }
              n = read(fd, buf, len - 1);
              close(fd);
              if (n < 0) {
                  return -1;
              }
              buf[n] = 0;
              if (nuls) {
                  *nuls = (size_t)n;
              }
              return 0;
          }

          int csl_mkdir_p(const char *path, mode_t mode)
          {
              char tmp[PATH_MAX];
              size_t i, n;
              if (!path || path[0] != '/') {
                  return -1;
              }
              n = strlen(path);
              if (n >= sizeof tmp) {
                  return -1;
              }
              memcpy(tmp, path, n + 1);
              for (i = 1; i < n; i++) {
                  if (tmp[i] == '/') {
                      tmp[i] = 0;
                      if (mkdir(tmp, mode) < 0 && errno != EEXIST) {
                          return -1;
                      }
                      tmp[i] = '/';
                  }
              }
              if (mkdir(tmp, mode) < 0 && errno != EEXIST) {
                  return -1;
              }
              return 0;
          }

          int csl_write_file(const char *path, const void *data, size_t n, mode_t mode)
          {
              int fd = open(path, O_WRONLY | O_CREAT | O_TRUNC | O_CLOEXEC, mode);
              if (fd < 0) {
                  return -1;
              }
              if (csl_write_all(fd, data, n) < 0) {
                  close(fd);
                  return -1;
              }
              if (fchmod(fd, mode) < 0) {
                  close(fd);
                  return -1;
              }
              close(fd);
              return 0;
          }

          int csl_read_file(const char *path, char *buf, size_t cap, size_t *n)
          {
              int fd = open(path, O_RDONLY | O_CLOEXEC);
              size_t got = 0;
              if (fd < 0) {
                  return -1;
              }
              if (csl_read_all(fd, (unsigned char *)buf, cap - 1, &got) < 0) {
                  close(fd);
                  return -1;
              }
              close(fd);
              buf[got] = 0;
              if (n) {
                  *n = got;
              }
              return 0;
          }

          int csl_path_root_owned(const char *path)
          {
              struct stat st;
              if (lstat(path, &st) < 0) {
                  return 0;
              }
              if (st.st_uid != 0) {
                  return 0;
              }
              if (st.st_mode & (S_IWGRP | S_IWOTH)) {
                  return 0;
              }
              return 1;
          }

          int csl_ancestors_root_owned(const char *path)
          {
              char tmp[PATH_MAX];
              size_t n;
              if (!path || path[0] != '/') {
                  return 0;
              }
              n = strlen(path);
              if (n >= sizeof tmp) {
                  return 0;
              }
              memcpy(tmp, path, n + 1);
              while (n > 1) {
                  char *slash;
                  if (!csl_path_root_owned(tmp)) {
                      return 0;
                  }
                  slash = strrchr(tmp, '/');
                  if (!slash) {
                      break;
                  }
                  if (slash == tmp) {
                      tmp[1] = 0;
                      return csl_path_root_owned(tmp);
                  }
                  *slash = 0;
                  n = strlen(tmp);
              }
              return 1;
          }

          int csl_truthy(const char *value)
          {
              if (!value || !value[0]) {
                  return 0;
              }
              return strcmp(value, "1") == 0 || strcasecmp(value, "true") == 0 ||
                     strcasecmp(value, "yes") == 0 || strcasecmp(value, "on") == 0;
          }

          int csl_env_present(const char *name)
          {
              return getenv(name) != NULL;
          }

          const char *csl_env_get(const char *name)
          {
              const char *v = getenv(name);
              return v ? v : "";
          }
