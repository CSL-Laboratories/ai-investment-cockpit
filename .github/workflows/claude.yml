            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git add:*),Bash(git commit:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git rev-parse:*),Bash(python3 ${{ runner.temp }}/claude-fixer-guard/model-api --:*),Bash(ruff check app)"
