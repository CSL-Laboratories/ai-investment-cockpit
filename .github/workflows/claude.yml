              rows: List[Dict[str, str]] = []
              for line in text.splitlines():
                  if not line.strip():
                      continue
                  left, _sep, right = line.partition(" - ")
                  fields = left.split()
                  if len(fields) < 6:
                      raise BindError("mountinfo")
                  rows.append(
                      {
                          "mount_id": fields[0],
                          "parent_id": fields[1],
                          "target": fields[4],
                          "options": fields[5],
                      }
                  )
