          void csl_die(int code, const char *reason)
          {
              /* Non-secret reason only. Never log argv or tokens. */
              const char *p = reason ? reason : "error";
              if (write(2, p, strlen(p)) < 0) {
                  /* ignore */
              }
              if (write(2, "\n", 1) < 0) {
                  /* ignore */
              }
              _exit(code);
