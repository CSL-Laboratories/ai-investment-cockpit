name: Claude PR Fixer

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude-mention:
    # @claude from members/owners, open PRs/issues, not from bots (loop guard)
    if: >-
      (
        (github.event_name == 'issue_comment' &&
         github.event.issue.state == 'open' &&
         contains(github.event.comment.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association) &&
         github.event.comment.user.type != 'Bot')
        ||
        (github.event_name == 'pull_request_review_comment' &&
         github.event.pull_request.state == 'open' &&
         github.event.pull_request.head.repo.full_name == github.repository &&
         contains(github.event.comment.body, '@claude') &&
         contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association) &&
         github.event.comment.user.type != 'Bot')
      )
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 30
            --append-system-prompt "Follow AGENTS.md, CLAUDE.md and CODEOWNERS conventions. NEVER merge PRs, force-push, or rebase. Only add new commits to the existing branch."

  devin-review-fix:
    # Devin review with findings on an open, same-repo PR
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.user.login == 'devin-ai-integration[bot]' &&
      (github.event.review.state == 'changes_requested' || github.event.review.state == 'commented') &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: devin-ai-integration
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BRANCH: ${{ github.event.pull_request.head.ref }}
            REVIEW ID: ${{ github.event.review.id }}

            Devin (devin-ai-integration[bot]) just reviewed this PR. You are the independent fixer.
            1. List all unresolved review threads from Devin on this PR (use gh / GitHub API).
            2. For each finding you agree with: fix it on the PR branch, commit with a clear message, and push.
            3. Reply to each thread with the commit SHA that addresses it.
            4. If you disagree with a finding, do NOT resolve the thread; reply explaining why.
            5. If the review has no actionable findings, do nothing.
            Rules: NEVER merge the PR, NEVER force-push, NEVER rebase or rewrite history. Only push new commits
            to ${{ github.event.pull_request.head.ref }}. Follow AGENTS.md, CLAUDE.md and CODEOWNERS conventions.
          claude_args: >-
            --max-turns 30
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git add:*),Bash(git commit:*),Bash(git push origin HEAD:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh api:*)"
