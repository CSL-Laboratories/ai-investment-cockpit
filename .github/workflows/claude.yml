            or change git config. When it cannot push, it posts a workflow terminal audit instead of your queued replies.
            - Keep within 30 turns. On any failure, queue the failure reply if possible and stop; the workflow
              records a terminal audit even if model errors, denied tools or turn exhaustion prevent your reply.
            Rules: NEVER merge, NEVER push or force-push, NEVER rebase or rewrite history. Only add new local commits on top of
            BRANCH. Follow AGENTS.md, CLAUDE.md and CODEOWNERS; they are not preloaded, so Read them when you need them. Never print secrets or env.
          claude_args: >-
            --max-turns 30
            --setting-sources user
            --strict-mcp-config
            --mcp-config /opt/csl-claude/mcp.empty.json
            --allowedTools "Edit(/${{ github.workspace }}/**),Write(/${{ github.workspace }}/**),Read,Glob,Grep,Bash(python3 ${{ runner.temp }}/claude-fixer-guard/model-api --:*)"
