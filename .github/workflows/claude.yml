              if (!name || !uid) {
                  return -1;
              }
              f = fopen("/etc/passwd", "r");
              if (!f) {
                  return -1;
              }
              while (fgets(line, sizeof line, f)) {
                  char *fields[7];
                  int n = 0;
                  char *p = line;
                  char *nl = strchr(line, '\n');
                  if (nl) {
                      *nl = 0;
                  }
                  fields[n++] = p;
                  for (; *p && n < 7; p++) {
                      if (*p == ':') {
                          *p = 0;
                          fields[n++] = p + 1;
                      }
                  }
                  if (n < 3) {
                      continue;
                  }
                  if (strcmp(fields[0], name) == 0) {
                      *uid = (uid_t)atoi(fields[2]);
                      fclose(f);
                      return 0;
                  }
              }
              fclose(f);
              return -1;
          }

          int csl_e3_record_ok(const char *text, size_t n)
          {
              static const char *ok[] = {
                  "claude_sha256", "claude_realpath_class", "sdk_mjs_sha256", "sdk_source",
                  "sdk_disk_match", "bun_tofu_sha256", "bwrap_sha256", "socat_sha256",
                  "bash_sha256", "match", "handoff_count", "handoff_conflict", NULL
              };
              char buf[4096];
              char *line, *save = NULL;
              int saw = 0, need = 0, i;
              unsigned present = 0;
              while (ok[need]) {
                  need++;
              }
              if (n == 0 || n >= sizeof buf) {
                  return 0;
              }
              memcpy(buf, text, n);
              buf[n] = 0;
              for (line = strtok_r(buf, "\n", &save); line; line = strtok_r(NULL, "\n", &save)) {
                  char *eq = strchr(line, '=');
                  size_t klen;
                  int found = 0;
                  if (!eq || eq == line) {
                      return 0;
                  }
                  klen = (size_t)(eq - line);
                  for (i = 0; ok[i]; i++) {
                      if (strlen(ok[i]) == klen && memcmp(line, ok[i], klen) == 0) {
                          if (present & (1u << i)) {
                              return 0;
                          }
                          present |= (1u << i);
                          found = 1;
                          break;
                      }
                  }
                  if (!found) {
                      return 0;
                  }
                  if (strchr(eq + 1, ' ') || strchr(eq + 1, '\t')) {
                      return 0;
                  }
                  saw++;
              }
              return saw == need;
          }

