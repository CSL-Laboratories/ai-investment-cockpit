          int csl_write_all(int fd, const void *buf, size_t n)
          {
              const unsigned char *p = buf;
              size_t off = 0;
              while (off < n) {
                  ssize_t w = write(fd, p + off, n - off);
                  if (w < 0) {
                      if (errno == EINTR) {
                          continue;
                      }
                      return -1;
                  }
                  if (w == 0) {
                      return -1;
                  }
                  off += (size_t)w;
              }
              return 0;
          }

          int csl_read_all(int fd, unsigned char *buf, size_t cap, size_t *out)
          {
              size_t off = 0;
              while (off < cap) {
                  ssize_t r = read(fd, buf + off, cap - off);
                  if (r < 0) {
                      if (errno == EINTR) {
                          continue;
                      }
                      return -1;
                  }
                  if (r == 0) {
                      break;
                  }
                  off += (size_t)r;
              }
              if (out) {
                  *out = off;
              }
              return 0;
          }

