      group: claude-${{ needs.resolve-pr.outputs.pr_number }}
      cancel-in-progress: false
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Fixer loop cap (>=3 claude[bot] commits since last human commit)
        id: cap
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve-pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          # Count claude[bot] commits after the newest human commit. Other bots
          # (e.g. merge/dependabot) neither count nor reset the streak.
          commits="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits?per_page=100" \
            --jq '.[] | [(.author.login // "-"), (.commit.author.name // "-")] | @tsv')"
          count=0
          while IFS=$'\t' read -r login name; do
            [ -z "$login$name" ] && continue
            if [ "$login" = "claude[bot]" ] || [ "$name" = "claude[bot]" ] || [ "$name" = "claude" ]; then
              count=$((count + 1))
            elif [[ "$login" == *"[bot]" || "$name" == *"[bot]" ]]; then
              continue
            else
              break
            fi
          done < <(printf '%s\n' "$commits" | tac)
          echo "claude[bot] commits since last human commit: $count"
          if [ "$count" -ge 3 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            marker="<!-- claude-fixer-loop-cap:$HEAD_SHA -->"
            # Buffer the full listing first: grep -q on a live pipe can SIGPIPE gh under pipefail.
            existing="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" --jq '.[].body')"
