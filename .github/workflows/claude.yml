          int csl_sha256_fd(int fd, unsigned char out[32])
          {
              csl_sha256_ctx ctx;
              unsigned char buf[8192];
              csl_sha256_init(&ctx);
              if (lseek(fd, 0, SEEK_SET) < 0 && errno != ESPIPE) {
                  return -1;
              }
              for (;;) {
                  ssize_t r = read(fd, buf, sizeof buf);
                  if (r < 0) {
                      if (errno == EINTR) {
                          continue;
                      }
                      return -1;
                  }
                  if (r == 0) {
                      break;
                  }
                  csl_sha256_update(&ctx, buf, (size_t)r);
              }
              csl_sha256_final(&ctx, out);
              if (lseek(fd, 0, SEEK_SET) < 0 && errno != ESPIPE) {
                  return -1;
              }
              return 0;
          }

