              start = 0;
              for (i = 0; i <= cap; i++) {
                  int at_end = (i == cap);
                  int is_nl = (!at_end && buf[i] == '\n');
                  int is_nul_run = (!at_end && buf[i] == 0 && i >= n);
                  if (!(is_nl || at_end || is_nul_run)) {
                      continue;
                  }
                  size_t ln = i - start;
                  /* Stop the line at the first embedded NUL (padding or garbage). */
                  size_t k;
                  for (k = 0; k < ln; k++) {
                      if (buf[start + k] == 0) {
                          ln = k;
                          break;
                      }
                  }
                  if (ln > 0) {
                      if (ln <= CSL_MAX_LINE && memchr(buf + start, '\r', ln) == NULL) {
                          char line[CSL_MAX_LINE + 1];
                          unsigned toks = 0;
                          memcpy(line, buf + start, ln);
                          line[ln] = 0;
                          if (parse_tokens(line, &toks)) {
                              matches++;
                              if (!have) {
                                  agreed = toks;
                                  have = 1;
                              } else if (agreed != toks) {
                                  conflict = 1;
                              }
                          }
                      }
                  }
                  if (is_nul_run) {
                      break;
                  }
                  start = i + 1;
                  if (at_end) {
                      break;
                  }
              }
              free(buf);
              if (conflict) {
                  r.status = CSL_STATUS_CONFLICT;
                  return r;
              }
              if (!have || matches == 0) {
                  r.status = CSL_STATUS_NOT_OBSERVED;
                  return r;
              }
              r.status = CSL_STATUS_OBSERVED;
              r.tokens = agreed;
              r.positive = agreed != 0;
              return r;
          }
          CSL_C_FILTER_C
          cat > /opt/csl-claude/src/sandbox_argv.h <<'CSL_C_ARGV_H'
          #ifndef CSL_SANDBOX_ARGV_H
          #define CSL_SANDBOX_ARGV_H
          #include "sandbox_common.h"

          /* F3a argv allowlist. Returns 0 if ok, -1 on reject (reason code only). */
          int csl_argv_allow(int argc, char **argv);

          /* Drop incoming --mcp-config / --strict-mcp-config and append the
           * launcher-owned empty MCP pair. out[cap] is the array bound including NULL. */
          int csl_argv_rewrite(int argc, char **argv, char **out, int cap, int *outn);

          #endif
          CSL_C_ARGV_H
          cat > /opt/csl-claude/src/sandbox_argv.c <<'CSL_C_ARGV_C'
          /* D10 E3-2 argv allowlist. Never log argv. Rejection is bad_argv only.
           * Exact workflow set plus injected launcher-owned MCP (N1/N6). */
          #include "sandbox_argv.h"

          static int starts_with(const char *s, const char *p)
          {
              return strncmp(s, p, strlen(p)) == 0;
          }

          static void free_tools(char **tools, int n)
          {
              while (n > 0) {
                  free(tools[--n]);
              }
          }

          static int split_tools(const char *csv, char **out, int cap)
          {
              int n = 0;
              const char *p = csv;
              if (!csv) {
                  return -1;
              }
              while (*p && n < cap) {
                  const char *comma = strchr(p, ',');
                  size_t len = comma ? (size_t)(comma - p) : strlen(p);
                  char *item = malloc(len + 1);
                  if (!item) {
                      free_tools(out, n);
                      return -1;
                  }
                  memcpy(item, p, len);
                  item[len] = 0;
                  out[n++] = item;
                  p = comma ? comma + 1 : p + len;
              }
              if (*p) {
                  free_tools(out, n);
                  return -1;
              }
              return n;
          }

          static int tools_equal(char **got, int ngot, const char **expect)
          {
              int i, j, nexp = 0;
              int *seen;
              while (expect[nexp]) {
                  nexp++;
              }
              if (ngot != nexp) {
                  return 0;
              }
              seen = calloc((size_t)nexp, sizeof *seen);
              if (!seen) {
                  return 0;
              }
              for (i = 0; i < ngot; i++) {
                  int found = 0;
                  for (j = 0; j < nexp; j++) {
                      if (!seen[j] && strcmp(got[i], expect[j]) == 0) {
                          seen[j] = 1;
                          found = 1;
                          break;
                      }
                  }
                  if (!found) {
                      free(seen);
                      return 0;
                  }
              }
              free(seen);
              return 1;
          }

          int csl_argv_allow(int argc, char **argv)
          {
              int i;
              int saw_turns = 0, saw_sources = 0, saw_allowed = 0;
              int saw_disallowed = 0, saw_append = 0, saw_perm = 0;
              char workspace[768];
              char write_ws[768];
              char helper[768];
              char *tools[64];
              int ntools = 0;
              const char *ws = "/home/runner/work/ai-investment-cockpit/ai-investment-cockpit";
              char wsbuf[512];
              size_t n = 0;

              if (csl_read_file(CSL_WORKSPACE_PATH, wsbuf, sizeof wsbuf, &n) == 0 && n > 0) {
                  while (n && (wsbuf[n - 1] == '\n' || wsbuf[n - 1] == ' ')) {
                      wsbuf[--n] = 0;
                  }
                  if (n) {
                      ws = wsbuf;
                  }
              }
              snprintf(workspace, sizeof workspace, "Edit(/%s/**)", ws);
              snprintf(write_ws, sizeof write_ws, "Write(/%s/**)", ws);
              snprintf(helper, sizeof helper,
                       "Bash(python3 %s/claude-fixer-guard/model-api --:*)", CSL_RUNNER_TEMP);

              for (i = 1; i < argc; i++) {
                  const char *a = argv[i];
                  if (strcmp(a, "--dangerously-skip-permissions") == 0) {
                      free_tools(tools, ntools);
                      return -1;
                  }
                  if (strcmp(a, "--add-dir") == 0 || starts_with(a, "--add-dir=")) {
                      free_tools(tools, ntools);
                      return -1;
                  }
                  if (strcmp(a, "--plugin") == 0 || starts_with(a, "--plugin") ||
                      strcmp(a, "--plugin-dir") == 0 || strstr(a, "marketplace")) {
                      free_tools(tools, ntools);
                      return -1;
                  }
                  if (strcmp(a, "--settings") == 0 || starts_with(a, "--settings=")) {
                      free_tools(tools, ntools);
                      return -1;
                  }
                  /* Incoming MCP is discarded; launcher injects its own empty file. */
                  if (strcmp(a, "--mcp-config") == 0) {
                      if (i + 1 >= argc) {
                          free_tools(tools, ntools);
                          return -1;
                      }
                      i++;
                      continue;
                  }
                  if (starts_with(a, "--mcp-config=")) {
                      continue;
                  }
                  if (strcmp(a, "--strict-mcp-config") == 0) {
                      continue;
                  }
                  if (strcmp(a, "--permission-mode") == 0) {
                      if (saw_perm || i + 1 >= argc || strcmp(argv[i + 1], "acceptEdits") != 0) {
                          free_tools(tools, ntools);
                          return -1;
                      }
                      i++;
                      saw_perm = 1;
                      continue;
                  }
                  if (starts_with(a, "--permission-mode=")) {
                      if (saw_perm || strcmp(a + 18, "acceptEdits") != 0) {
                          free_tools(tools, ntools);
                          return -1;
                      }
                      saw_perm = 1;
                      continue;
                  }
                  if (strcmp(a, "--max-turns") == 0) {
                      if (saw_turns || i + 1 >= argc || strcmp(argv[i + 1], "30") != 0) {
                          free_tools(tools, ntools);
                          return -1;
                      }
                      i++;
                      saw_turns = 1;
                      continue;
                  }
                  if (strcmp(a, "--setting-sources") == 0) {
                      if (saw_sources || i + 1 >= argc || strcmp(argv[i + 1], "user") != 0) {
                          free_tools(tools, ntools);
                          return -1;
                      }
                      i++;
                      saw_sources = 1;
                      continue;
                  }
                  if (strcmp(a, "--allowedTools") == 0 || strcmp(a, "--allowed-tools") == 0) {
                      int extra;
                      if (saw_allowed || i + 1 >= argc) {
                          free_tools(tools, ntools);
                          return -1;
                      }
                      extra = split_tools(argv[i + 1], tools + ntools, 64 - ntools);
                      if (extra < 0) {
                          return -1;
                      }
                      ntools += extra;
                      saw_allowed = 1;
                      i++;
                      continue;
                  }
                  if (strcmp(a, "--disallowedTools") == 0 || strcmp(a, "--disallowed-tools") == 0) {
                      if (saw_disallowed || i + 1 >= argc) {
                          free_tools(tools, ntools);
                          return -1;
                      }
                      i++;
                      saw_disallowed = 1;
                      continue;
                  }
                  if (strcmp(a, "--append-system-prompt") == 0) {
                      if (saw_append || i + 1 >= argc) {
                          free_tools(tools, ntools);
                          return -1;
                      }
                      i++;
                      saw_append = 1;
                      continue;
                  }
                  if (strcmp(a, "--output-format") == 0) {
                      if (i + 1 >= argc || strcmp(argv[i + 1], "stream-json") != 0) {
                          free_tools(tools, ntools);
                          return -1;
                      }
                      i++;
                      continue;
                  }
                  if (strcmp(a, "--input-format") == 0) {
                      if (i + 1 >= argc || strcmp(argv[i + 1], "stream-json") != 0) {
                          free_tools(tools, ntools);
                          return -1;
                      }
                      i++;
                      continue;
                  }
                  if (strcmp(a, "--verbose") == 0 || strcmp(a, "--print") == 0 ||
                      strcmp(a, "-p") == 0 || strcmp(a, "--replay-user-messages") == 0) {
                      continue;
                  }
                  free_tools(tools, ntools);
                  return -1;
              }
              if (!saw_turns || !saw_sources || !saw_allowed || ntools == 0) {
                  free_tools(tools, ntools);
                  return -1;
              }
              {
                  const char *expect[8];
                  int e = 0;
                  expect[e++] = workspace;
                  expect[e++] = write_ws; /* #256 workspace Write; D10:331 N8 has none */
                  expect[e++] = "Read";
                  expect[e++] = "Glob";
                  expect[e++] = "Grep";
                  expect[e++] = helper;
                  expect[e] = NULL;
                  if (!tools_equal(tools, ntools, expect)) {
                      free_tools(tools, ntools);
                      return -1;
                  }
              }
              free_tools(tools, ntools);
              return 0;
          }

          int csl_argv_rewrite(int argc, char **argv, char **out, int cap, int *outn)
          {
              int i, n = 0;
              if (cap < 4 || !argv || !out) {
                  return -1;
              }
              out[n++] = argv[0];
              for (i = 1; i < argc; i++) {
                  if (strcmp(argv[i], "--mcp-config") == 0) {
                      if (i + 1 >= argc) {
                          return -1;
                      }
                      i++;
                      continue;
                  }
                  if (starts_with(argv[i], "--mcp-config=")) {
                      continue;
                  }
                  if (strcmp(argv[i], "--strict-mcp-config") == 0) {
                      continue;
                  }
                  if (n + 4 > cap) {
                      return -1;
                  }
                  out[n++] = argv[i];
              }
              if (n + 4 > cap) {
                  return -1;
              }
              out[n++] = "--strict-mcp-config";
              out[n++] = "--mcp-config";
              out[n++] = (char *)CSL_MCP_EMPTY_PATH;
              out[n] = NULL;
              if (outn) {
                  *outn = n;
              }
              return 0;
          }
          CSL_C_ARGV_C

      - name: E3-0-early write C sources B
        shell: /usr/bin/sudo -n /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          BASH_ENV: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          HEAD_SHA: ${{ needs.fixer-prepare.outputs.head_sha }}
          HEAD_REF: ${{ needs.fixer-prepare.outputs.head_ref }}
          WRITER_MODE: fixer
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RECEIPT_CONTEXT: ${{ needs.fixer-prepare.outputs.receipt_context }}
        run: |
          set -euo pipefail
          mkdir -p /opt/csl-claude/src /opt/csl-claude/lib /opt/csl-relay/bin
          cat > /opt/csl-claude/src/sandbox_launch.c <<'CSL_C_LAUNCH'
          /* D10 E3-2 static launcher. Runner-uid. Not in sudoers. */
          #include "sandbox_argv.h"

          #include <dirent.h>
          #include <limits.h>
          #include <signal.h>
          #include <sys/prctl.h>
          #include <sys/socket.h>
          #include <sys/un.h>
          #include <sys/wait.h>

          extern char **environ;

          static void refuse(const char *why)
          {
              (void)why;
              if (write(2, "launcher refused\n", 17) < 0) {
                  /* ignore */
              }
              _exit(1);
          }

          static int u15_refuse(void)
          {
              if (csl_env_present("SRT_DEBUG") || csl_env_present("DEBUG_CLAUDE_AGENT_SDK") ||
                  csl_env_present("ACTIONS_STEP_DEBUG")) {
                  return 1;
              }
              if (csl_truthy(getenv("RUNNER_DEBUG"))) {
                  return 1;
              }
              return 0;
          }

          static char **build_child_env(char *home, char *user)
          {
              static char *envp[64];
              static char storage[64][512];
              int n = 0;
          #define ADD(k, v)                                                              \
              do {                                                                       \
                  if (n >= 63) {                                                         \
                      refuse("env");                                                     \
                  }                                                                      \
                  snprintf(storage[n], sizeof storage[n], "%s=%s", k, v);                \
                  envp[n] = storage[n];                                                  \
                  n++;                                                                   \
              } while (0)
              ADD("SRT_DEBUG", "1");
              ADD("DISABLE_UPDATES", "1");
              ADD("PATH", "/usr/bin:/bin");
              ADD("LANG", "C.UTF-8");
              ADD("LC_ALL", "C.UTF-8");
              ADD("TERM", "dumb");
              ADD("HOME", home);
              ADD("USER", user);
              ADD("LOGNAME", user);
              if (getenv("TZ")) {
                  ADD("TZ", getenv("TZ"));
              }
              if (getenv("CLAUDE_CODE_OAUTH_TOKEN")) {
                  ADD("CLAUDE_CODE_OAUTH_TOKEN", getenv("CLAUDE_CODE_OAUTH_TOKEN"));
              }
              if (!getenv("CLAUDE_CODE_SUBPROCESS_ENV_SCRUB") ||
                  strcmp(getenv("CLAUDE_CODE_SUBPROCESS_ENV_SCRUB"), "1") != 0) {
                  refuse("scrub");
              }
              ADD("CLAUDE_CODE_SUBPROCESS_ENV_SCRUB", "1");
              if (getenv("CLAUDE_CODE_ENTRYPOINT")) {
                  ADD("CLAUDE_CODE_ENTRYPOINT", getenv("CLAUDE_CODE_ENTRYPOINT"));
              }
              if (getenv("GITHUB_TOKEN")) {
                  ADD("GITHUB_TOKEN", getenv("GITHUB_TOKEN"));
              }
              if (getenv("GH_TOKEN")) {
                  ADD("GH_TOKEN", getenv("GH_TOKEN"));
              }
              ADD("RUNNER_TEMP", CSL_RUNNER_TEMP);
              if (getenv("RUNNER_OS")) {
                  ADD("RUNNER_OS", getenv("RUNNER_OS"));
              }
              if (getenv("CI")) {
                  ADD("CI", getenv("CI"));
              }
              if (getenv("GITHUB_ACTIONS")) {
                  ADD("GITHUB_ACTIONS", getenv("GITHUB_ACTIONS"));
              }
              {
                  char **e;
                  for (e = environ; *e; e++) {
                      if (strncmp(*e, "GITHUB_", 7) == 0) {
                          const char *name = *e;
                          if (strncmp(name, "GITHUB_ENV=", 11) == 0 ||
                              strncmp(name, "GITHUB_PATH=", 12) == 0 ||
                              strncmp(name, "GITHUB_OUTPUT=", 14) == 0 ||
                              strncmp(name, "GITHUB_STATE=", 13) == 0 ||
                              strncmp(name, "GITHUB_STEP_SUMMARY=", 20) == 0) {
                              continue;
                          }
                          if (n >= 63) {
                              refuse("env");
                          }
                          snprintf(storage[n], sizeof storage[n], "%s", *e);
                          envp[n] = storage[n];
                          n++;
                      }
                  }
              }
              envp[n] = NULL;
              return envp;
          #undef ADD
          }

          static int mcp_exists(const char *rel)
          {
              char path[PATH_MAX];
              struct stat st;
              if (getcwd(path, sizeof path) == NULL) {
                  return 1;
              }
              if (strlen(path) + strlen(rel) + 2 >= sizeof path) {
                  return 1;
              }
              strcat(path, rel);
              return lstat(path, &st) == 0;
          }

          static int claude_dir_ok(const char *home)
          {
              char dir[PATH_MAX], json[PATH_MAX];
              DIR *d;
              struct dirent *ent;
              int saw_settings = 0;
              snprintf(dir, sizeof dir, "%s/.claude", home);
              snprintf(json, sizeof json, "%s/.claude.json", home);
              {
                  struct stat st;
                  if (lstat(json, &st) == 0) {
                      return 0;
                  }
              }
              d = opendir(dir);
              if (!d) {
                  return 0;
              }
              while ((ent = readdir(d))) {
                  if (strcmp(ent->d_name, ".") == 0 || strcmp(ent->d_name, "..") == 0) {
                      continue;
                  }
                  if (strcmp(ent->d_name, "settings.json") == 0) {
                      saw_settings = 1;
                      continue;
                  }
                  /* Fail closed on CLAUDE.md, agents, commands, skills, plugins, hooks. */
                  closedir(d);
                  return 0;
              }
              closedir(d);
              return saw_settings;
          }

          static int mcp_empty_ok(void)
          {
              char buf[64];
              size_t n = 0;
              size_t want = strlen(CSL_MCP_EMPTY_BYTES);
              if (csl_read_file(CSL_MCP_EMPTY_PATH, buf, sizeof buf, &n) != 0) {
                  return 0;
              }
              if (n != want || memcmp(buf, CSL_MCP_EMPTY_BYTES, want) != 0) {
                  return 0;
              }
          #ifndef CSL_PREFIX
              if (!csl_ancestors_root_owned(CSL_MCP_EMPTY_PATH)) {
                  return 0;
              }
          #endif
              return 1;
          }

          static int connect_handoff(void)
          {
              int fd;
              struct sockaddr_un addr;
              fd = socket(AF_UNIX, SOCK_STREAM | SOCK_CLOEXEC, 0);
              if (fd < 0) {
                  return -1;
              }
              memset(&addr, 0, sizeof addr);
              addr.sun_family = AF_UNIX;
              snprintf(addr.sun_path, sizeof addr.sun_path, "%s", CSL_HANDOFF_SOCK);
              if (connect(fd, (struct sockaddr *)&addr, sizeof addr) < 0) {
                  close(fd);
                  return -1;
              }
              return fd;
          }

          static void close_cmsg_fds(struct msghdr *msg, int keep)
          {
              struct cmsghdr *cmsg;
              for (cmsg = CMSG_FIRSTHDR(msg); cmsg; cmsg = CMSG_NXTHDR(msg, cmsg)) {
                  if (cmsg->cmsg_level == SOL_SOCKET && cmsg->cmsg_type == SCM_RIGHTS) {
                      int nfds = (int)((cmsg->cmsg_len - CMSG_LEN(0)) / sizeof(int));
                      int *fds = (int *)CMSG_DATA(cmsg);
                      int i;
                      for (i = 0; i < nfds; i++) {
                          if (fds[i] != keep && fds[i] >= 0) {
                              close(fds[i]);
                          }
                      }
                  }
              }
          }

          int main(int argc, char **argv)
          {
              char home[256], user[64];
              char **child_env;
              char *cargv[64];
              int pair[2], handoff, sink = -1;
              unsigned char digest[32];
              int claude_fd;
              pid_t child;
              int status = 1;
              struct iovec iov;
              struct msghdr msg;
              char cmsgbuf[CMSG_SPACE(sizeof(int)) + CMSG_SPACE(sizeof(struct ucred))];
              struct cmsghdr *cmsg;
              char dummy = 'H';
              struct ucred cred;
              int rewritten = 0;

              if (argc > 62) {
                  refuse("argc");
              }
              if (getenv("LD_PRELOAD") || getenv("LD_AUDIT")) {
                  refuse("ld");
              }
              if (u15_refuse()) {
                  refuse("u15");
              }
              if (csl_argv_allow(argc, argv) != 0) {
                  refuse("bad_argv");
              }
              if (csl_argv_rewrite(argc, argv, cargv, 64, &rewritten) != 0 || rewritten > 62) {
                  refuse("bad_argv");
              }
              if (csl_lookup_user(getuid(), user, sizeof user, home, sizeof home) != 0) {
                  refuse("passwd");
              }
              if (prctl(PR_SET_DUMPABLE, 0) < 0) {
                  refuse("dumpable");
              }
              child_env = build_child_env(home, user);

              /* N1: cwd .mcp.json / .claude/settings.json are ignored because the
               * child is exec'd with --setting-sources user and injected
               * --strict-mcp-config --mcp-config CSL_MCP_EMPTY_PATH. Still refuse
               * settings.local.json (not covered by those flags). */
              if (mcp_exists("/.claude/settings.local.json")) {
                  refuse("mcp");
              }
              if (!mcp_empty_ok()) {
                  refuse("mcp");
              }
              if (!claude_dir_ok(home)) {
                  refuse("claude_dir");
              }

              handoff = connect_handoff();
              if (handoff < 0) {
                  refuse("handoff");
              }
              if (socketpair(AF_UNIX, SOCK_STREAM | SOCK_CLOEXEC, 0, pair) < 0) {
                  refuse("pair");
              }
              memset(&msg, 0, sizeof msg);
              iov.iov_base = &dummy;
              iov.iov_len = 1;
              msg.msg_iov = &iov;
              msg.msg_iovlen = 1;
              msg.msg_control = cmsgbuf;
              msg.msg_controllen = sizeof cmsgbuf;
              cmsg = CMSG_FIRSTHDR(&msg);
              cmsg->cmsg_level = SOL_SOCKET;
              cmsg->cmsg_type = SCM_RIGHTS;
              cmsg->cmsg_len = CMSG_LEN(sizeof(int));
              memcpy(CMSG_DATA(cmsg), &pair[1], sizeof(int));
              cred.pid = getpid();
              cred.uid = getuid();
              cred.gid = getgid();
              cmsg = CMSG_NXTHDR(&msg, cmsg);
              if (cmsg) {
                  cmsg->cmsg_level = SOL_SOCKET;
                  cmsg->cmsg_type = SCM_CREDENTIALS;
                  cmsg->cmsg_len = CMSG_LEN(sizeof cred);
                  memcpy(CMSG_DATA(cmsg), &cred, sizeof cred);
              }
              if (sendmsg(handoff, &msg, 0) < 0) {
                  refuse("sendmsg");
              }
              close(pair[1]);
              close(handoff);

              memset(&msg, 0, sizeof msg);
              iov.iov_base = &dummy;
              iov.iov_len = 1;
              msg.msg_iov = &iov;
              msg.msg_iovlen = 1;
              msg.msg_control = cmsgbuf;
              msg.msg_controllen = sizeof cmsgbuf;
              if (recvmsg(pair[0], &msg, 0) < 0) {
                  refuse("recvmsg");
              }
              if (msg.msg_flags & MSG_CTRUNC) {
                  close_cmsg_fds(&msg, -1);
                  refuse("ctrunc");
              }
              {
                  int nfds_total = 0;
                  for (cmsg = CMSG_FIRSTHDR(&msg); cmsg; cmsg = CMSG_NXTHDR(&msg, cmsg)) {
                      if (cmsg->cmsg_level == SOL_SOCKET && cmsg->cmsg_type == SCM_RIGHTS) {
                          int nfds = (int)((cmsg->cmsg_len - CMSG_LEN(0)) / sizeof(int));
                          int *fds = (int *)CMSG_DATA(cmsg);
                          if (nfds != 1 || nfds_total != 0) {
                              close_cmsg_fds(&msg, -1);
                              refuse("fds");
                          }
                          sink = fds[0];
                          nfds_total = 1;
                      }
                  }
              }
              if (sink < 0) {
                  refuse("sink");
              }

              claude_fd = open(CSL_CLAUDE_PATH, O_RDONLY | O_CLOEXEC);
              if (claude_fd < 0) {
                  refuse("claude_open");
              }
              if (!csl_ancestors_root_owned(CSL_CLAUDE_PATH)) {
                  refuse("claude_own");
              }
              if (csl_sha256_fd(claude_fd, digest) != 0 || !csl_hex_eq(digest, CSL_CLAUDE_SHA256)) {
                  refuse("claude_hash");
              }

              child = fork();
              if (child < 0) {
                  refuse("fork");
              }
              if (child == 0) {
                  if (prctl(PR_SET_PDEATHSIG, SIGKILL) < 0) {
                      _exit(1);
                  }
                  if (getppid() == 1) {
                      _exit(1);
                  }
                  if (dup2(sink, 2) < 0) {
                      _exit(1);
                  }
                  if (sink != 2) {
                      close(sink);
                  }
                  close(pair[0]);
                  cargv[0] = (char *)CSL_CLAUDE_PATH;
                  if (lseek(claude_fd, 0, SEEK_SET) < 0) {
                      _exit(1);
                  }
                  fexecve(claude_fd, cargv, child_env);
                  _exit(127);
              }
              close(sink);
              close(claude_fd);
              if (waitpid(child, &status, 0) < 0) {
                  status = 1;
              }
              /* N14: END only if the direct child exited (not killed). */
              if (WIFEXITED(status)) {
                  dummy = 'E';
                  (void)csl_write_all(pair[0], "END\n", 4);
              }
              close(pair[0]);
              if (WIFEXITED(status)) {
                  return WEXITSTATUS(status);
              }
              return 1;
          }
          CSL_C_LAUNCH
          cat > /opt/csl-claude/src/sandbox_capture.c <<'CSL_C_CAPTURE'
          /* D10 capture daemon: root, empty argv, not in sudoers. Owns FIFO + sockets. */
          #include "sandbox_common.h"

          #include <ctype.h>
          #include <dirent.h>
          #include <limits.h>
          #include <poll.h>
          #include <signal.h>
          #include <sys/prctl.h>
          #include <sys/socket.h>
          #include <sys/un.h>
          #include <sys/wait.h>

          static volatile sig_atomic_t got_end;
          static volatile sig_atomic_t pair_closed;
          static volatile sig_atomic_t stop;
          static int fifo_r = -1, fifo_w_held = -1, listen_fd = -1, control_fd = -1;
          static int cap_fd = -1, pair_fd = -1, worker_pidfd = -1;
          static int f1_armed;
          static unsigned char capture_buf[CSL_CAP_BYTES];
          static size_t captured;
          static unsigned extra_handoffs;
          static pid_t worker_pid;
          static pid_t f1_bun_pid;

          static void handle_sig(int sig)
          {
              (void)sig;
              stop = 1;
          }

          static int bind_unix(const char *path, mode_t mode, int backlog)
          {
              int fd;
              struct sockaddr_un addr;
              unlink(path);
              fd = socket(AF_UNIX, SOCK_STREAM | SOCK_CLOEXEC, 0);
              if (fd < 0) {
                  return -1;
              }
              memset(&addr, 0, sizeof addr);
              addr.sun_family = AF_UNIX;
              snprintf(addr.sun_path, sizeof addr.sun_path, "%s", path);
              if (bind(fd, (struct sockaddr *)&addr, sizeof addr) < 0) {
                  close(fd);
                  return -1;
              }
              if (chmod(path, mode) < 0) {
                  close(fd);
                  return -1;
              }
              if (listen(fd, backlog) < 0) {
                  close(fd);
                  return -1;
              }
              return fd;
          }

          static int fifo_writers(void)
          {
              /* After F4c the daemon has closed fifo_w_held. POLLHUP means no writer
               * remains (CLI fd 2 gone). No POLLHUP means someone still holds a writer. */
              struct pollfd pfd;
              pfd.fd = fifo_r;
              pfd.events = POLLIN | POLLHUP;
              if (poll(&pfd, 1, 0) < 0) {
                  return 1;
              }
              if (pfd.revents & POLLHUP) {
                  return 0;
              }
              return 1;
          }

          static int cmdline_tokens(pid_t pid, char tokens[][512], int cap)
          {
              char buf[4096];
              size_t n = 0, off = 0;
              int i = 0;
              if (csl_proc_cmdline(pid, buf, sizeof buf, &n) < 0) {
                  return -1;
              }
              while (off < n && i < cap) {
                  size_t len = strlen(buf + off);
                  if (len >= 512) {
                      return -1;
                  }
                  memcpy(tokens[i], buf + off, len + 1);
                  i++;
                  off += len + 1;
              }
              return i;
          }

          static pid_t proc_ppid(pid_t pid)
          {
              return csl_proc_ppid(pid);
          }

          static int count_children(pid_t parent)
          {
              DIR *d = opendir("/proc");
              struct dirent *ent;
              int n = 0;
              if (!d) {
                  return -1;
              }
              while ((ent = readdir(d))) {
                  pid_t pid;
                  if (!isdigit((unsigned char)ent->d_name[0])) {
                      continue;
                  }
                  pid = (pid_t)atoi(ent->d_name);
                  if (pid > 0 && proc_ppid(pid) == parent) {
                      n++;
                  }
              }
              closedir(d);
              return n;
          }

          static int is_uuid_sh(const char *s, const char *temp)
          {
              size_t tl, i;
              const char *name;
              if (!s || !temp || !temp[0]) {
                  return 0;
              }
              tl = strlen(temp);
              if (strncmp(s, temp, tl) != 0 || s[tl] != '/') {
                  return 0;
              }
              name = s + tl + 1;
              if (strlen(name) != 39 || strcmp(name + 36, ".sh") != 0) {
                  return 0;
              }
              for (i = 0; i < 36; i++) {
                  char c = name[i];
                  if (i == 8 || i == 13 || i == 18 || i == 23) {
                      if (c != '-') {
                          return 0;
                      }
                  } else if (!((c >= '0' && c <= '9') || (c >= 'a' && c <= 'f'))) {
                      return 0;
                  }
              }
              return 1;
          }

          static int bun_cmdline_ok(char tokens[][512], int ntok)
          {
              char cfg[768], runp[768];
              if (ntok < 5) {
                  return 0;
              }
              if (strcmp(tokens[0], CSL_BUN_PATH) != 0 && strcmp(tokens[0], "bun") != 0 &&
                  !strstr(tokens[0], "/bun")) {
                  return 0;
              }
              if (strcmp(tokens[1], "--no-env-file") != 0 || strcmp(tokens[3], "run") != 0) {
                  return 0;
              }
              snprintf(cfg, sizeof cfg, "--config=%s/bunfig.toml", CSL_ACTION_DIR);
              snprintf(runp, sizeof runp, "%s/src/entrypoints/run.ts", CSL_ACTION_DIR);
              return strcmp(tokens[2], cfg) == 0 && strcmp(tokens[4], runp) == 0;
          }

          static int bash_b_ok(pid_t b, pid_t x)
          {
              char exe[PATH_MAX];
              char tokens[12][512];
              int ntok;
              const char *temp = CSL_RUNNER_TEMP;
              pid_t bpp;
              if (csl_proc_exe(b, exe, sizeof exe) < 0) {
                  return 0;
              }
              if (strcmp(exe, "/usr/bin/bash") != 0 && strcmp(exe, "/bin/bash") != 0) {
                  return 0;
              }
              ntok = cmdline_tokens(b, tokens, 12);
              if (ntok < 7) {
                  return 0;
              }
              if (strcmp(tokens[0], "/bin/bash") != 0 && strcmp(tokens[0], "/usr/bin/bash") != 0) {
                  return 0;
              }
              if (strcmp(tokens[1], "--noprofile") != 0 || strcmp(tokens[2], "--norc") != 0 ||
                  strcmp(tokens[3], "-e") != 0 || strcmp(tokens[4], "-o") != 0 ||
                  strcmp(tokens[5], "pipefail") != 0) {
                  return 0;
              }
              if (!is_uuid_sh(tokens[6], temp ? temp : "")) {
                  return 0;
              }
              bpp = proc_ppid(b);
              if (worker_pidfd >= 0) {
                  pid_t held = 0;
                  if (csl_read_pidfd_pid(worker_pidfd, &held) < 0 || held != bpp || bpp != worker_pid) {
                      return 0;
                  }
              } else if (bpp != worker_pid) {
                  return 0;
              }
              if (count_children(b) != 1) {
                  return 0;
              }
              (void)x;
              return 1;
          }

          static int hash_pid_exe(pid_t pid, unsigned char dig[32])
          {
              char path[64];
              int fd, rc;
              snprintf(path, sizeof path, "/proc/%d/exe", (int)pid);
              fd = open(path, O_RDONLY | O_CLOEXEC);
              if (fd < 0) {
                  return -1;
              }
              rc = csl_sha256_fd(fd, dig);
              close(fd);
              return rc;
          }

          static int bun_tofu_match(pid_t pid)
          {
              unsigned char dig[32];
              char hex[65], want[80];
              size_t n = 0;
              if (hash_pid_exe(pid, dig) != 0) {
                  return 0;
              }
              csl_hex32(dig, hex);
              if (csl_read_file(CSL_BUN_TOFU_PATH, want, sizeof want, &n) != 0 || n < 64) {
                  return 0;
              }
              want[64] = 0;
              return strncmp(hex, want, 64) == 0;
          }

          static int bun_name_recorded(const char *name)
          {
              char buf[4096];
              size_t n = 0, off = 0;
              if (csl_read_file(CSL_STATE_DIR "/bun.names", buf, sizeof buf, &n) != 0) {
                  return 0;
              }
              while (off < n) {
                  char *nl = strchr(buf + off, '\n');
                  size_t len = nl ? (size_t)(nl - (buf + off)) : strlen(buf + off);
                  if (len == strlen(name) && memcmp(buf + off, name, len) == 0) {
                      return 1;
                  }
                  if (!nl) {
                      break;
                  }
                  off += len + 1;
              }
              return 0;
          }

          static int x_environ_ok(pid_t pid)
          {
              char path[64], buf[65536];
              int fd;
              ssize_t n;
              size_t off = 0;
              snprintf(path, sizeof path, "/proc/%d/environ", (int)pid);
              fd = open(path, O_RDONLY | O_CLOEXEC);
              if (fd < 0) {
                  return 0;
              }
              n = read(fd, buf, sizeof buf - 1);
              close(fd);
              if (n <= 0) {
                  return 0;
              }
              buf[n] = 0;
              while (off < (size_t)n) {
                  const char *e = buf + off;
                  size_t elen = strlen(e);
                  if (strncmp(e, "LD_PRELOAD=", 11) == 0 && e[11]) {
                      return 0;
                  }
                  if (strncmp(e, "LD_AUDIT=", 9) == 0 && e[9]) {
                      return 0;
                  }
                  if (strncmp(e, "LD_LIBRARY_PATH=", 16) == 0 && e[16]) {
                      return 0;
                  }
                  if (strncmp(e, "SRT_DEBUG=", 10) == 0 ||
                      strncmp(e, "DEBUG_CLAUDE_AGENT_SDK=", 23) == 0 ||
                      strncmp(e, "ACTIONS_STEP_DEBUG=", 19) == 0) {
                      return 0;
                  }
                  if (strncmp(e, "BUN_", 4) == 0) {
                      char key[128];
                      const char *eq = strchr(e, '=');
                      size_t klen;
                      if (!eq) {
                          return 0;
                      }
                      klen = (size_t)(eq - e);
                      if (klen >= sizeof key) {
                          return 0;
                      }
                      memcpy(key, e, klen);
                      key[klen] = 0;
                      if (!bun_name_recorded(key)) {
                          return 0;
                      }
                  }
                  off += elen + 1;
              }
              return 1;
          }

          /* F1: observe bun X under parent B, then chmod handoff 0666. */
          static void try_arm_f1(void)
          {
              DIR *d;
              struct dirent *ent;
              char cwdwant[512];
              size_t cn = 0;
              if (f1_armed) {
                  return;
              }
              if (csl_read_file(CSL_WORKSPACE_PATH, cwdwant, sizeof cwdwant, &cn) != 0) {
                  return;
              }
              while (cn && (cwdwant[cn - 1] == '\n' || cwdwant[cn - 1] == ' ')) {
                  cwdwant[--cn] = 0;
              }
              d = opendir("/proc");
              if (!d) {
                  return;
              }
              while ((ent = readdir(d))) {
                  pid_t x, b;
                  char exe[PATH_MAX], cwd[PATH_MAX], link[64];
                  char tokens[12][512];
                  int ntok;
                  if (!isdigit((unsigned char)ent->d_name[0])) {
                      continue;
                  }
                  x = (pid_t)atoi(ent->d_name);
                  if (x <= 0) {
                      continue;
                  }
                  if (csl_proc_exe(x, exe, sizeof exe) < 0) {
                      continue;
                  }
                  if (strcmp(exe, CSL_BUN_PATH) != 0) {
                      continue;
                  }
                  ntok = cmdline_tokens(x, tokens, 12);
                  if (ntok < 0 || !bun_cmdline_ok(tokens, ntok)) {
                      continue;
                  }
                  snprintf(link, sizeof link, "/proc/%d/cwd", (int)x);
                  {
                      ssize_t n = readlink(link, cwd, sizeof cwd - 1);
                      if (n < 0) {
                          continue;
                      }
                      cwd[n] = 0;
                  }
                  if (cn && strcmp(cwd, cwdwant) != 0) {
                      continue;
                  }
                  b = proc_ppid(x);
                  if (!b || !bash_b_ok(b, x)) {
                      continue;
                  }
                  if (!bun_tofu_match(x)) {
                      continue;
                  }
                  if (!x_environ_ok(x)) {
                      continue;
                  }
                  if (chmod(CSL_HANDOFF_SOCK, 0666) == 0) {
                      f1_armed = 1;
                      f1_bun_pid = x;
                      (void)csl_write_file(CSL_STATE_DIR "/f1.armed", "1\n", 2, 0600);
                  }
                  break;
              }
              closedir(d);
          }

          static int f2_launcher_parent_is_bun(pid_t launcher)
          {
          #ifdef CSL_PREFIX
              (void)launcher;
              return 1;
          #else
              /* G8: pidfd_open(ppid), re-check launcher alive + PPid, hash exe, pidfd live. */
              pid_t x, x2;
              int xfd;
              pid_t held = 0;
              if (f1_bun_pid <= 0) {
                  return 0;
              }
              x = proc_ppid(launcher);
              if (x <= 0 || x != f1_bun_pid) {
                  return 0;
              }
              xfd = csl_pidfd_open(x, 0);
              if (xfd < 0) {
                  return 0;
              }
              if (kill(launcher, 0) < 0) {
                  close(xfd);
                  return 0;
              }
              x2 = proc_ppid(launcher);
              if (x2 != x) {
                  close(xfd);
                  return 0;
              }
              if (!bun_tofu_match(x)) {
                  close(xfd);
                  return 0;
              }
              if (csl_read_pidfd_pid(xfd, &held) < 0 || held != x) {
                  close(xfd);
                  return 0;
              }
              close(xfd);
              return 1;
          #endif
          }

          static void drain_fifo(int discard)
          {
              unsigned char buf[8192];
              ssize_t r;
              r = read(fifo_r, buf, sizeof buf);
              if (r <= 0) {
                  return;
              }
              if (discard || captured >= CSL_CAP_BYTES) {
                  return;
              }
              if (captured + (size_t)r > CSL_CAP_BYTES) {
                  size_t keep = CSL_CAP_BYTES - captured;
                  memcpy(capture_buf + captured, buf, keep);
                  captured = CSL_CAP_BYTES;
                  if (cap_fd >= 0) {
                      (void)csl_write_all(cap_fd, buf, keep);
                  }
                  return;
              }
              memcpy(capture_buf + captured, buf, (size_t)r);
              captured += (size_t)r;
              if (cap_fd >= 0) {
                  (void)csl_write_all(cap_fd, buf, (size_t)r);
              }
          }

          static void close_rights(struct msghdr *msg, int keep)
          {
              struct cmsghdr *cmsg;
              for (cmsg = CMSG_FIRSTHDR(msg); cmsg; cmsg = CMSG_NXTHDR(msg, cmsg)) {
                  if (cmsg->cmsg_level == SOL_SOCKET && cmsg->cmsg_type == SCM_RIGHTS) {
                      int nfds = (int)((cmsg->cmsg_len - CMSG_LEN(0)) / sizeof(int));
                      int *fds = (int *)CMSG_DATA(cmsg);
                      int i;
                      for (i = 0; i < nfds; i++) {
                          if (fds[i] != keep && fds[i] >= 0) {
                              close(fds[i]);
                          }
                      }
                  }
              }
          }

          static int peer_uid_ok(uid_t uid)
          {
          #ifdef CSL_PREFIX
              return uid == getuid();
          #else
              uid_t runner = 0;
              if (csl_lookup_name("runner", &runner) != 0) {
                  return 0;
              }
              return uid == runner;
          #endif
          }

          static void accept_handoff(void)
          {
              int cfd = accept4(listen_fd, NULL, NULL, SOCK_CLOEXEC | SOCK_NONBLOCK);
              struct msghdr msg;
              struct iovec iov;
              char cmsgbuf[CMSG_SPACE(sizeof(int)) * 4];
              char dummy = 0;
              struct cmsghdr *cmsg;
              int got_pair = -1;
              int saw_cred = 0;
              struct ucred peer;
              socklen_t plen = sizeof peer;
              int pass = 1;

              if (cfd < 0) {
                  return;
              }
              extra_handoffs++;
              /* N11: do not unlink until the peer is verified. */
              if (setsockopt(cfd, SOL_SOCKET, SO_PASSCRED, &pass, sizeof pass) < 0) {
                  close(cfd);
                  return;
              }
              if (getsockopt(cfd, SOL_SOCKET, SO_PEERCRED, &peer, &plen) < 0) {
                  close(cfd);
                  return;
              }
              if (!peer_uid_ok(peer.uid)) {
                  close(cfd);
                  return;
              }
              memset(&msg, 0, sizeof msg);
              iov.iov_base = &dummy;
              iov.iov_len = 1;
              msg.msg_iov = &iov;
              msg.msg_iovlen = 1;
              msg.msg_control = cmsgbuf;
              msg.msg_controllen = sizeof cmsgbuf;
              if (recvmsg(cfd, &msg, 0) < 0) {
                  close(cfd);
                  return;
              }
              if (msg.msg_flags & MSG_CTRUNC) {
                  close_rights(&msg, -1);
                  close(cfd);
                  return;
              }
              for (cmsg = CMSG_FIRSTHDR(&msg); cmsg; cmsg = CMSG_NXTHDR(&msg, cmsg)) {
                  if (cmsg->cmsg_level == SOL_SOCKET && cmsg->cmsg_type == SCM_RIGHTS) {
                      int nfds = (int)((cmsg->cmsg_len - CMSG_LEN(0)) / sizeof(int));
                      int *fds = (int *)CMSG_DATA(cmsg);
                      if (nfds != 1 || got_pair >= 0) {
                          close_rights(&msg, -1);
                          close(cfd);
                          return;
                      }
                      got_pair = fds[0];
                  }
                  if (cmsg->cmsg_level == SOL_SOCKET && cmsg->cmsg_type == SCM_CREDENTIALS) {
                      struct ucred scm;
                      memcpy(&scm, CMSG_DATA(cmsg), sizeof scm);
                      if (scm.pid != peer.pid || scm.uid != peer.uid) {
                          close_rights(&msg, -1);
                          close(cfd);
                          return;
                      }
                      saw_cred = 1;
                  }
              }
              if (got_pair < 0 || !saw_cred) {
                  close_rights(&msg, -1);
                  close(cfd);
                  return;
              }
              /* F5: SO_PEERPIDFD identity. Fail closed if unavailable. */
              {
                  int peerpidfd = -1;
                  socklen_t sl = sizeof peerpidfd;
                  char exe[PATH_MAX];
                  unsigned char dig[32], want[32];
                  pid_t pfd_pid = 0;
                  if (getsockopt(cfd, SOL_SOCKET, SO_PEERPIDFD, &peerpidfd, &sl) < 0) {
                      close(cfd);
                      close(got_pair);
                      return;
                  }
                  if (csl_read_pidfd_pid(peerpidfd, &pfd_pid) < 0 || pfd_pid != peer.pid) {
                      close(peerpidfd);
                      close(cfd);
                      close(got_pair);
                      return;
                  }
                  if (csl_proc_exe(peer.pid, exe, sizeof exe) < 0) {
                      close(peerpidfd);
                      close(cfd);
                      close(got_pair);
                      return;
                  }
                  if (strcmp(exe, CSL_LAUNCH_PATH) != 0) {
                      close(peerpidfd);
                      close(cfd);
                      close(got_pair);
                      return;
                  }
                  if (csl_sha256_file(exe, dig) != 0 ||
                      csl_sha256_file(CSL_LAUNCH_PATH, want) != 0 ||
                      memcmp(dig, want, 32) != 0) {
                      close(peerpidfd);
                      close(cfd);
                      close(got_pair);
                      return;
                  }
                  if (!f1_armed || !f2_launcher_parent_is_bun(peer.pid)) {
                      close(peerpidfd);
                      close(cfd);
                      close(got_pair);
                      return;
                  }
                  close(peerpidfd);
              }
              unlink(CSL_HANDOFF_SOCK);
              /* Send FIFO write fd over the pair only (F4c: close our write copy after). */
              {
                  int wfd = open(CSL_FIFO_PATH, O_WRONLY | O_CLOEXEC);
                  struct msghdr sm;
                  struct iovec siov;
                  char scbuf[CMSG_SPACE(sizeof(int))];
                  struct cmsghdr *sc;
                  char d = 'S';
                  if (wfd < 0) {
                      close(cfd);
                      close(got_pair);
                      return;
                  }
                  memset(&sm, 0, sizeof sm);
                  siov.iov_base = &d;
                  siov.iov_len = 1;
                  sm.msg_iov = &siov;
                  sm.msg_iovlen = 1;
                  sm.msg_control = scbuf;
                  sm.msg_controllen = sizeof scbuf;
                  sc = CMSG_FIRSTHDR(&sm);
                  sc->cmsg_level = SOL_SOCKET;
                  sc->cmsg_type = SCM_RIGHTS;
                  sc->cmsg_len = CMSG_LEN(sizeof(int));
                  memcpy(CMSG_DATA(sc), &wfd, sizeof wfd);
                  if (sendmsg(got_pair, &sm, 0) < 0) {
                      close(wfd);
                      close(cfd);
                      close(got_pair);
                      return;
                  }
                  close(wfd); /* F4c send copy */
                  if (fifo_w_held >= 0) {
                      close(fifo_w_held);
                      fifo_w_held = -1;
                  }
              }
              pair_fd = got_pair;
              extra_handoffs--; /* first successful peer is the launcher */
              close(cfd);
          }

          static void read_pair(void)
          {
              char buf[64];
              ssize_t r;
              if (pair_fd < 0) {
                  return;
              }
              r = read(pair_fd, buf, sizeof buf);
              if (r <= 0) {
                  pair_closed = 1;
                  (void)csl_write_file(CSL_PAIR_PATH, "1\n", 2, 0600);
                  close(pair_fd);
                  pair_fd = -1;
                  return;
              }
              if (r >= 4 && memcmp(buf, "END\n", 4) == 0) {
                  got_end = 1;
                  (void)csl_write_file(CSL_END_PATH, "ok\n", 3, 0600);
              }
          }

          static void handle_control(void)
          {
              int cfd = accept4(control_fd, NULL, NULL, SOCK_CLOEXEC);
              char req[128], resp[256];
              ssize_t n;
              if (cfd < 0) {
                  return;
              }
              n = read(cfd, req, sizeof req - 1);
              if (n <= 0) {
                  close(cfd);
                  return;
              }
              req[n] = 0;
              if (strncmp(req, "STATUS", 6) == 0) {
                  snprintf(resp, sizeof resp, "end=%d pair=%d writers=%d already=%d worker=%d extra=%u\n",
                           got_end ? 1 : 0, pair_closed ? 1 : 0, fifo_writers(),
                           access(CSL_ALREADY_PATH, F_OK) == 0 ? 1 : 0, (int)worker_pid,
                           extra_handoffs);
                  (void)csl_write_all(cfd, resp, strlen(resp));
              } else if (strncmp(req, "RAN", 3) == 0) {
                  (void)csl_write_file(CSL_ALREADY_PATH, "1\n", 2, 0600);
                  (void)csl_write_all(cfd, "ok\n", 3);
              } else if (strncmp(req, "WORKER_MATCH ", 13) == 0) {
                  pid_t q = (pid_t)atoi(req + 13);
                  pid_t held = 0;
                  int ok = 0;
                  if (worker_pidfd >= 0 && csl_read_pidfd_pid(worker_pidfd, &held) == 0) {
                      ok = (held == q && q == worker_pid);
                  }
                  (void)csl_write_all(cfd, ok ? "yes\n" : "no\n", ok ? 4 : 3);
              } else {
                  (void)csl_write_all(cfd, "err\n", 4);
              }
              close(cfd);
          }

          static pid_t load_worker(void)
          {
              char buf[64], exe[PATH_MAX];
              size_t n = 0;
              pid_t pid;
              const char *base;
              if (csl_read_file(CSL_WORKER_PID_PATH, buf, sizeof buf, &n) != 0 || n == 0) {
                  return 0;
              }
              pid = (pid_t)atoi(buf);
              if (pid <= 0) {
                  return 0;
              }
          #ifdef CSL_PREFIX
              (void)exe;
              (void)base;
              return pid;
          #else
              if (csl_proc_exe(pid, exe, sizeof exe) < 0) {
                  return 0;
              }
              base = strrchr(exe, '/');
              base = base ? base + 1 : exe;
              if (strcmp(base, "Runner.Worker") != 0) {
                  return 0;
              }
              return pid;
          #endif
          }

          int main(int argc, char **argv)
          {
              struct pollfd pfds[4];
              (void)argv;
              if (argc != 1) {
                  /* Empty argv only. Refuse extras. */
                  csl_die(1, "argv");
              }
              if (prctl(PR_SET_DUMPABLE, 0) < 0) {
                  csl_die(1, "dumpable");
              }
              signal(SIGPIPE, SIG_IGN);
              signal(SIGTERM, handle_sig);

              if (csl_mkdir_p(CSL_STATE_DIR, 0711) < 0) {
                  csl_die(1, "mkdir");
              }
              chmod(CSL_STATE_DIR, 0711);

              unlink(CSL_FIFO_PATH);
              if (mkfifo(CSL_FIFO_PATH, 0600) < 0) {
                  csl_die(1, "fifo");
              }
              if (chown(CSL_FIFO_PATH, 0, 0) < 0 && errno != EPERM) {
                  csl_die(1, "fifo_chown");
              }
              chmod(CSL_FIFO_PATH, 0600);

              cap_fd = open(CSL_CAPTURE_PATH, O_WRONLY | O_CREAT | O_TRUNC | O_CLOEXEC, 0600);
              if (cap_fd < 0) {
                  csl_die(1, "capture");
              }

              fifo_r = open(CSL_FIFO_PATH, O_RDONLY | O_NONBLOCK | O_CLOEXEC);
              if (fifo_r < 0) {
                  csl_die(1, "fifo_r");
              }
              /* Hold a write fd so readers do not see EOF before the launcher connects.
               * Closed after the first hand-off send (F4c uses a separate write fd). */
              fifo_w_held = open(CSL_FIFO_PATH, O_WRONLY | O_NONBLOCK | O_CLOEXEC);
              if (fifo_w_held < 0) {
                  csl_die(1, "fifo_w");
              }

              worker_pid = load_worker();
              if (worker_pid <= 0) {
                  csl_die(1, "worker");
              }
              worker_pidfd = csl_pidfd_open(worker_pid, 0);
              if (worker_pidfd < 0) {
                  csl_die(1, "worker_pidfd");
              }

              listen_fd = bind_unix(CSL_HANDOFF_SOCK, 0600, 1);
              if (listen_fd < 0) {
                  csl_die(1, "handoff");
              }
              control_fd = bind_unix(CSL_CONTROL_SOCK, 0600, 4);
              if (control_fd < 0) {
                  csl_die(1, "control");
              }

          #ifdef CSL_PREFIX
              /* Test compile only: skip F1 wait so socket tests can connect. */
              chmod(CSL_HANDOFF_SOCK, 0666);
              f1_armed = 1;
          #else
              /* Production: stay 0600 until F1 bun X is observed (try_arm_f1). */
              f1_armed = 0;
          #endif

              for (;;) {
                  int nfd = 0;
                  if (stop) {
                      break;
                  }
                  pfds[nfd].fd = fifo_r;
                  pfds[nfd].events = POLLIN | POLLHUP;
                  nfd++;
                  pfds[nfd].fd = listen_fd;
                  pfds[nfd].events = POLLIN;
                  nfd++;
                  pfds[nfd].fd = control_fd;
                  pfds[nfd].events = POLLIN;
                  nfd++;
                  if (pair_fd >= 0) {
                      pfds[nfd].fd = pair_fd;
                      pfds[nfd].events = POLLIN | POLLHUP;
                      nfd++;
                  }
                  if (!f1_armed) {
                      try_arm_f1();
                  }
                  if (poll(pfds, nfd, f1_armed ? 500 : 50) < 0) {
                      if (errno == EINTR) {
                          continue;
                      }
                      break;
                  }
                  if (pfds[0].revents & (POLLIN | POLLHUP)) {
                      drain_fifo(got_end || captured >= CSL_CAP_BYTES);
                  }
                  if (pfds[1].revents & POLLIN) {
                      accept_handoff();
                  }
                  if (pfds[2].revents & POLLIN) {
                      handle_control();
                  }
                  if (nfd > 3 && (pfds[3].revents & (POLLIN | POLLHUP))) {
                      read_pair();
                  }
              }
              return 0;
          }
          CSL_C_CAPTURE
          cat > /opt/csl-claude/src/sandbox_relay.c <<'CSL_C_RELAY'
          /* D10 §3.8 static relay. Ignore argv. One-shot gated. Only sudoers command. */
          #include "sandbox_filter.h"

          #include <limits.h>
          #include <sys/prctl.h>
          #include <sys/random.h>
          #include <sys/socket.h>
          #include <sys/un.h>
          #include <time.h>

          static const char LINE_NOT_OBSERVED[] = "[csl-relay] sandbox literal NOT observed";
          static const char LINE_CONFLICT[] = "[csl-relay] sandbox literal CONFLICT";
          static const char LINE_FILTER_ERROR[] = "[csl-relay] filter error";
          static const char LINE_NOT_RELAYED[] = "[csl-relay] NOT RELAYED reason=";

          static void token_hex(char out[33])
          {
              unsigned char b[16];
              static const char *hex = "0123456789abcdef";
              int i;
              if (getrandom(b, sizeof b, 0) != (ssize_t)sizeof b) {
                  int fd = open("/dev/urandom", O_RDONLY | O_CLOEXEC);
                  if (fd < 0 || csl_read_all(fd, b, sizeof b, NULL) < 0) {
                      csl_die(1, "random");
                  }
                  if (fd >= 0) {
                      close(fd);
                  }
              }
              for (i = 0; i < 16; i++) {
                  out[i * 2] = hex[b[i] >> 4];
                  out[i * 2 + 1] = hex[b[i] & 0xf];
              }
              out[32] = 0;
          }

          static void wrap_print(const char *body)
          {
              char tok[33];
              token_hex(tok);
              fputs("::stop-commands::", stdout);
              fputs(tok, stdout);
              fputc('\n', stdout);
              fputs(body, stdout);
              if (body[0] && body[strlen(body) - 1] != '\n') {
                  fputc('\n', stdout);
              }
              fputc(':', stdout);
              fputc(':', stdout);
              fputs(tok, stdout);
              fputs("::\n", stdout);
              fflush(stdout);
          }

          static void not_relayed(const char *reason)
          {
              char buf[128];
              snprintf(buf, sizeof buf, "%s%s", LINE_NOT_RELAYED, reason);
              wrap_print(buf);
          }

          static int control_query(const char *req, char *resp, size_t cap)
          {
              int fd;
              struct sockaddr_un addr;
              ssize_t n;
              fd = socket(AF_UNIX, SOCK_STREAM | SOCK_CLOEXEC, 0);
              if (fd < 0) {
                  return -1;
              }
              memset(&addr, 0, sizeof addr);
              addr.sun_family = AF_UNIX;
              snprintf(addr.sun_path, sizeof addr.sun_path, "%s", CSL_CONTROL_SOCK);
              if (connect(fd, (struct sockaddr *)&addr, sizeof addr) < 0) {
                  close(fd);
                  return -1;
              }
              if (csl_write_all(fd, req, strlen(req)) < 0) {
                  close(fd);
                  return -1;
              }
              n = read(fd, resp, cap - 1);
              close(fd);
              if (n < 0) {
                  return -1;
              }
              resp[n] = 0;
              return 0;
          }

          static int worker_match(pid_t pid)
          {
              char req[64], resp[32];
              snprintf(req, sizeof req, "WORKER_MATCH %d\n", (int)pid);
              if (control_query(req, resp, sizeof resp) < 0) {
                  return 0;
              }
              return strncmp(resp, "yes", 3) == 0;
          }

          static const char *f4a_parent(void)
          {
              /* Two accepted shapes. Never "unproven". Worker pidfd via daemon. */
              pid_t ppid = getppid();
              char exe[PATH_MAX], self[PATH_MAX];
              uid_t uid = getuid(), euid = geteuid();
              if (uid != 0 || euid != 0) {
                  return "bad_parent";
              }
              if (csl_proc_exe(0, self, sizeof self) < 0) {
                  /* pid 0 means self via /proc/self/exe */
              }
              if (readlink("/proc/self/exe", self, sizeof self - 1) < 0) {
                  return "bad_parent";
              }
              self[sizeof self - 1] = 0;
              if (csl_proc_exe(ppid, exe, sizeof exe) < 0) {
                  exe[0] = 0;
              }
              if (strstr(exe, "/sudo") || strcmp(exe, "/usr/bin/sudo") == 0 ||
                  strcmp(exe, "/usr/sbin/sudo") == 0 || strcmp(exe, "/bin/sudo") == 0) {
                  /* sudo forks: sudo's ppid must equal Worker pidfd. */
                  char statp[64], buf[4096];
                  int fd, pp = 0;
                  char state = 0;
                  snprintf(statp, sizeof statp, "/proc/%d/stat", (int)ppid);
                  fd = open(statp, O_RDONLY | O_CLOEXEC);
                  if (fd < 0) {
                      return "bad_parent";
                  }
                  if (read(fd, buf, sizeof buf - 1) <= 0) {
                      close(fd);
                      return "bad_parent";
                  }
                  close(fd);
                  {
                      char *rparen = strrchr(buf, ')');
                      if (!rparen || sscanf(rparen + 2, "%c %d", &state, &pp) != 2) {
                          return "bad_parent";
                      }
                  }
                  if (!worker_match((pid_t)pp)) {
                      return "bad_parent";
                  }
                  return NULL; /* sudo_fork */
              }
              if (strcmp(self, CSL_RELAY_PATH) == 0) {
                  if (!worker_match(ppid)) {
                      return "bad_parent";
                  }
                  return NULL; /* sudo_exec */
              }
              return "bad_parent";
          }

          static void pad_wall(struct timespec start)
          {
              struct timespec now;
              long elapsed_ms;
              clock_gettime(CLOCK_MONOTONIC, &now);
              elapsed_ms = (long)(now.tv_sec - start.tv_sec) * 1000 +
                           (now.tv_nsec - start.tv_nsec) / 1000000;
              if (elapsed_ms < 5000) {
                  struct timespec sl;
                  long remain = 5000 - elapsed_ms;
                  sl.tv_sec = remain / 1000;
                  sl.tv_nsec = (remain % 1000) * 1000000L;
                  nanosleep(&sl, NULL);
              }
          }

          int main(int argc, char **argv)
          {
              struct timespec start;
              char status[256];
              unsigned char cap[CSL_CAP_BYTES];
              size_t n = 0;
              int capfd;
              const char *parent;
              csl_filter_result fr;
              char body[8192];
              char reconstructed[256];
              char e3[4096];
              size_t e3n = 0;
              int already = 0, end = 0, pair = 0, writers = 1;
              int waited = 0;

              (void)argc;
              (void)argv; /* ignore argv: do not open, stat, map, or exec {0} */
              clock_gettime(CLOCK_MONOTONIC, &start);
              (void)prctl(PR_SET_DUMPABLE, 0);
              if (freopen("/dev/null", "w", stderr) == NULL) {
                  /* ignore */
              }

              parent = f4a_parent();
          #ifdef CSL_PREFIX
              parent = NULL; /* unit tests compile without a Worker pidfd */
          #endif
              if (parent) {
                  not_relayed(parent);
                  return 0;
              }

              if (control_query("STATUS\n", status, sizeof status) == 0) {
                  sscanf(status, "end=%d pair=%d writers=%d already=%d", &end, &pair, &writers,
                         &already);
              } else {
                  end = access(CSL_END_PATH, F_OK) == 0;
                  pair = access(CSL_PAIR_PATH, F_OK) == 0;
                  already = access(CSL_ALREADY_PATH, F_OK) == 0;
          #ifdef CSL_PREFIX
                  writers = 0; /* file-based unit tests have no daemon */
          #else
                  writers = 1; /* N10: query fail must not fail open */
          #endif
              }
              if (already) {
                  not_relayed("already_ran");
                  return 0;
              }
              if (!end) {
                  not_relayed("no_end");
                  return 0;
              }
              while (!pair && waited < CSL_WRITER_WAIT_MS) {
                  struct timespec sl = {0, 50 * 1000000L};
                  nanosleep(&sl, NULL);
                  waited += 50;
                  if (control_query("STATUS\n", status, sizeof status) == 0) {
                      sscanf(status, "end=%d pair=%d writers=%d already=%d", &end, &pair, &writers,
                             &already);
                  } else {
                      pair = access(CSL_PAIR_PATH, F_OK) == 0;
          #ifdef CSL_PREFIX
                      writers = 0;
          #else
                      writers = 1;
          #endif
                  }
              }
              if (!pair) {
                  not_relayed("pair_open");
                  return 0;
              }
              waited = 0;
              while (writers > 0 && waited < CSL_WRITER_WAIT_MS) {
                  struct timespec sl = {0, 50 * 1000000L};
                  nanosleep(&sl, NULL);
                  waited += 50;
                  if (control_query("STATUS\n", status, sizeof status) == 0) {
                      sscanf(status, "end=%d pair=%d writers=%d already=%d", &end, &pair, &writers,
                             &already);
                  } else {
          #ifdef CSL_PREFIX
                      writers = 0;
          #else
                      writers = 1;
          #endif
                  }
              }
              if (writers > 0) {
                  not_relayed("writer_held");
                  return 0;
              }

              capfd = open(CSL_CAPTURE_PATH, O_RDONLY | O_CLOEXEC);
              if (capfd < 0) {
                  not_relayed("no_end");
                  return 0;
              }
              (void)csl_read_all(capfd, cap, CSL_CAP_BYTES, &n);
              close(capfd);

              fr = csl_filter_capture(cap, n);
              if (fr.status == CSL_STATUS_OBSERVED) {
                  csl_reconstruct(fr.tokens, reconstructed, sizeof reconstructed);
                  if (reconstructed[0] == ':' && reconstructed[1] == ':') {
                      wrap_print(LINE_FILTER_ERROR);
                      pad_wall(start);
                      return 0;
                  }
                  snprintf(body, sizeof body, "%s\n", reconstructed);
              } else if (fr.status == CSL_STATUS_CONFLICT) {
                  snprintf(body, sizeof body, "%s\n", LINE_CONFLICT);
              } else {
                  snprintf(body, sizeof body, "%s\n", LINE_NOT_OBSERVED);
              }
              if (csl_read_file(CSL_E3_RECORD_PATH, e3, sizeof e3, &e3n) == 0 && e3n &&
                  csl_e3_record_ok(e3, e3n)) {
                  strncat(body, e3, sizeof body - strlen(body) - 1);
                  if (body[strlen(body) - 1] != '\n') {
                      strncat(body, "\n", sizeof body - strlen(body) - 1);
                  }
              }
              strncat(body, "channel=S\nfirst_bash=missing\norigin=unattributed\n",
                      sizeof body - strlen(body) - 1);
              wrap_print(body);
              (void)control_query("RAN\n", status, sizeof status);
              (void)csl_write_file(CSL_ALREADY_PATH, "1\n", 2, 0600);
              /* Shred only after gated successful print (L-a). */
              {
                  int fd = open(CSL_CAPTURE_PATH, O_RDWR | O_CLOEXEC);
                  if (fd >= 0) {
                      struct stat st;
                      unsigned char z[4096];
                      memset(z, 0, sizeof z);
                      if (fstat(fd, &st) == 0) {
                          off_t left = st.st_size;
                          while (left > 0) {
                              size_t chunk = left > (off_t)sizeof z ? sizeof z : (size_t)left;
                              if (csl_write_all(fd, z, chunk) < 0) {
                                  break;
                              }
                              left -= (off_t)chunk;
                          }
                      }
                      close(fd);
                  }
                  unlink(CSL_CAPTURE_PATH);
              }
              pad_wall(start);
              return 0;
          }
          CSL_C_RELAY
          cat > /opt/csl-claude/lib/sandbox_c.pin <<'CSL_C_PIN'
          8d5911bf178d7a545c50e730ccd88bd90a88c478de155204bce5e19723da2874  sandbox_common.h
          ed36a4ceaf1602cf7f9d8d93d6988e3365dca0c57cd8df41c85858827a99570d  sandbox_common.c
          098eb6177463294e2585fca35a21a93575ae9b162185d5646bd156d0f9b04996  sandbox_filter.h
          c7d218317d057037e4c3712af5e79ea38b5763f67a6bfe1e6bcb55d31f29eb45  sandbox_filter.c
          24fafd315646846decbea02390ebef80b45c767aabee2c4733dcce04c122e41a  sandbox_argv.h
          8892d520c57d0b08f651920fa718c3d9a1c09800c3f50666544b9325495e7ade  sandbox_argv.c
          15db71059f0e3532d9bc0871b7ea3a727e69893d4a98cd21a26ff1c238cfdb87  sandbox_launch.c
          5a86361e0b582fc484fcdc9dd21061222109e9176bb59cd0573c6975b51d7c40  sandbox_capture.c
          591385d6acfea3925e17c5622785186a7d173c81b18b8126cf5efff7a0cf137a  sandbox_relay.c
          CSL_C_PIN
          cat > /opt/csl-claude/lib/sandbox_e3_cli_pin.sh <<'CSL_E3_CLI_PIN'
          set -euo pipefail
          # E3-1 folded into 0b (D10 step 8), already root: no sudo. Same pin literals as
          # scripts/ci/install_pinned_claude_code.sh / claude-code-2.1.306-linux-x64.pin.
          # Never executes the downloaded file before comparison. Never runs install.sh.

          CLAUDE_VERSION="2.1.306"
          PLATFORM="linux-x64"
          EXPECTED_SHA256="520bc6c1f40af466bd03a278b5ae1af1a2938bc7de5b9e5cb15526da20d71cfe"
          EXPECTED_BYTES="290532720"
          EXPECTED_FPR="31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE"
          RELEASE_BASE="https://downloads.claude.ai/claude-code-releases"
          KEY_URL="https://downloads.claude.ai/keys/claude-code.asc"
          DEST_DIR="/opt/csl-claude/${CLAUDE_VERSION}"
          DEST="${DEST_DIR}/claude"
          CURL=/usr/bin/curl
          GPG=/usr/bin/gpg
          PYTHON=/usr/bin/python3

          for bin in "$CURL" "$GPG" "$PYTHON"; do
            if [ ! -x "$bin" ]; then
              echo "missing executable: ${bin}" >&2
              exit 1
            fi
          done
          command -v sha256sum >/dev/null

          STAGING="${RUNNER_TEMP:?}/csl-claude-staging"
          GNUPGHOME=""
          cleanup() {
            rm -rf "$STAGING"
            if [ -n "$GNUPGHOME" ]; then rm -rf "$GNUPGHOME"; fi
          }
          trap cleanup EXIT

          rm -rf "$STAGING"
          mkdir -m 0700 "$STAGING"

          "$CURL" -fsSL --retry 3 --retry-delay 2 -o "$STAGING/claude" \
            "${RELEASE_BASE}/${CLAUDE_VERSION}/${PLATFORM}/claude"

          bytes="$(stat -c %s "$STAGING/claude")"
          if [ "$bytes" != "$EXPECTED_BYTES" ]; then
            echo "size mismatch: got ${bytes} want ${EXPECTED_BYTES}" >&2
            exit 1
          fi
          echo "${EXPECTED_SHA256}  ${STAGING}/claude" | sha256sum -c -

          "$CURL" -fsSL --retry 3 --retry-delay 2 -o "$STAGING/manifest.json" \
            "${RELEASE_BASE}/${CLAUDE_VERSION}/manifest.json"
          "$CURL" -fsSL --retry 3 --retry-delay 2 -o "$STAGING/manifest.json.sig" \
            "${RELEASE_BASE}/${CLAUDE_VERSION}/manifest.json.sig"
          "$CURL" -fsSL --retry 3 --retry-delay 2 -o "$STAGING/claude-code.asc" "$KEY_URL"

          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          export GNUPGHOME
          "$GPG" --batch --import "$STAGING/claude-code.asc"
          status="$("$GPG" --batch --status-fd 1 --verify "$STAGING/manifest.json.sig" "$STAGING/manifest.json")"
          case "$status" in
            *"[GNUPG:] VALIDSIG ${EXPECTED_FPR} "*) ;;
            *)
              echo "signed-manifest VALIDSIG mismatch" >&2
              exit 1
              ;;
          esac
          case "$status" in
            *"[GNUPG:] GOODSIG "*) ;;
            *)
              echo "signed-manifest missing GOODSIG" >&2
              exit 1
              ;;
          esac
          for bad in EXPKEYSIG REVKEYSIG EXPSIG KEYEXPIRED KEYREVOKED BADSIG ERRSIG; do
            case "$status" in
              *"[GNUPG:] ${bad}"*)
                echo "signed-manifest rejected: ${bad}" >&2
                exit 1
                ;;
            esac
          done

          export CLAUDE_VERSION EXPECTED_SHA256 EXPECTED_BYTES
          STAGING="$STAGING" "$PYTHON" -I -c '
          import json, os, sys
          manifest = json.load(open(os.environ["STAGING"] + "/manifest.json", encoding="utf-8"))
          plat = manifest["platforms"]["linux-x64"]
          errors = []
          if manifest.get("version") != os.environ["CLAUDE_VERSION"]:
              errors.append("version")
          if plat.get("checksum") != os.environ["EXPECTED_SHA256"]:
              errors.append("checksum")
          if int(plat.get("size", -1)) != int(os.environ["EXPECTED_BYTES"]):
              errors.append("size")
          if errors:
              sys.stderr.write("signed manifest does not match committed pin: " + ",".join(errors) + "\n")
              sys.exit(1)
          '

          if [ -L /opt/csl-claude ] || [ -L "$DEST_DIR" ] || [ -L "$DEST" ]; then
            echo "install path is a symlink" >&2
            exit 1
          fi
          if [ -e "$DEST_DIR" ]; then
            if [ ! -d "$DEST_DIR" ]; then
              echo "install path exists and is not a directory" >&2
              exit 1
            fi
            leftover="$(find "$DEST_DIR" -mindepth 1 -maxdepth 1 -print)"
            if [ -n "$leftover" ]; then
              echo "install dir contains extra files" >&2
              exit 1
            fi
          fi
          mkdir -p "$DEST_DIR"
          chown root:root /opt/csl-claude "$DEST_DIR"
          chmod 0755 /opt/csl-claude "$DEST_DIR"
          install -o root -g root -m 0755 "$STAGING/claude" "$DEST"
          test "$(stat -c %U:%G:%a "$DEST")" = "root:root:755"
          test -x "$DEST"
          if [ -w "$DEST" ] || [ -w "$DEST_DIR" ]; then
            echo "install path is writable by the runner" >&2
            exit 1
          fi
          if [ -L "$DEST" ] || [ -L "$DEST_DIR" ] || [ -L /opt/csl-claude ]; then
            echo "install path became a symlink" >&2
            exit 1
          fi
          leftover="$(find "$DEST_DIR" -mindepth 1 -maxdepth 1 ! -name claude -print)"
          if [ -n "$leftover" ]; then
            echo "install dir contains extra files" >&2
            exit 1
          fi
          CSL_E3_CLI_PIN

      - name: E3-0-early root bootstrap
        shell: /usr/bin/sudo -n /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          BASH_ENV: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          HEAD_SHA: ${{ needs.fixer-prepare.outputs.head_sha }}
          HEAD_REF: ${{ needs.fixer-prepare.outputs.head_ref }}
          WRITER_MODE: fixer
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RECEIPT_CONTEXT: ${{ needs.fixer-prepare.outputs.receipt_context }}
        run: |
          set -euo pipefail
          mkdir -p /opt/csl-claude/lib
          cat > /opt/csl-claude/lib/sandbox_e3_bootstrap.sh <<'CSL_E3_BOOTSTRAP'
          #!/bin/bash
          # E3-0-early 0b body (CSL-474 D10). Already root via:
          #   shell: /usr/bin/sudo -n /bin/bash --noprofile --norc -e -o pipefail {0}
          # Constants only — no CSL_* environment path overrides (L-d).
          # E3-1 CLI pin runs here before sudoers. Capture-start is not in sudoers.
          set -euo pipefail

          AP=/home/runner/work/_actions/anthropics/claude-code-action/a5a423f75c251dcbff8a74e99f83b2cb03c72bfa
          SETUP_BUN_DIR=/home/runner/work/_actions/oven-sh/setup-bun/0c5077e51419868618aeaa5fe8019c62421857d6
          STATE=/var/lib/csl-relay
          LIB=/opt/csl-claude/lib
          SRC=/opt/csl-claude/src
          BUN_DST=/opt/csl-bun/bun
          BUN_BIN=/home/runner/.bun/bin
          PYTHON=/usr/bin/python3
          GCC=/usr/bin/gcc
          SUDOERS_TEXT='Defaults env_reset
          Defaults secure_path="/usr/sbin:/usr/bin:/sbin:/bin"
          runner ALL=(root) NOPASSWD: /opt/csl-relay/bin/relay
          '

          umask 022
          mkdir -p /opt/csl-bun /opt/csl-claude/lib /opt/csl-claude/src /opt/csl-relay/bin \
            "$BUN_BIN" "$STATE"
          chmod 0711 "$STATE"
          chown root:root "$STATE"

          # Walk $$ → ppid until exe basename is Runner.Worker (N2). Do not persist
          # /proc/PID/environ (may contain GH_TOKEN). worker.status is 0600.
          WORKER_PID=""
          cur=$$
          for _ in 1 2 3 4 5 6 7 8; do
            pp="$(awk -F')' '{print $2}' "/proc/$cur/stat" | awk '{print $2}')"
            [ -n "$pp" ] && [ "$pp" != "0" ] || break
            exe="$(readlink "/proc/$pp/exe" || true)"
            base="${exe##*/}"
            if [ "$base" = "Runner.Worker" ]; then
              WORKER_PID="$pp"
              break
            fi
            cur="$pp"
          done
          if [ -z "$WORKER_PID" ]; then
            echo "e3-0b: Runner.Worker not found in parent chain" >&2
            exit 1
          fi
          printf '%s\n' "$WORKER_PID" > "$STATE/worker.pid"
          chmod 0600 "$STATE/worker.pid"
          readlink /proc/"$WORKER_PID"/ns/mnt > "$STATE/ns.mnt"
          chmod 0600 "$STATE/ns.mnt"
          cat /proc/"$WORKER_PID"/status > "$STATE/worker.status"
          chmod 0600 "$STATE/worker.status"

          # Launcher-owned empty MCP (N1). Exact bytes, root 0444.
          printf '%s\n' '{"mcpServers":{}}' > /opt/csl-claude/mcp.empty.json
          chown root:root /opt/csl-claude/mcp.empty.json
          chmod 0444 /opt/csl-claude/mcp.empty.json

          # 0b step 1: compile static binaries from workflow-embedded sources. Pin check.
          test -d "$SRC" || { echo "e3-0b: C sources missing" >&2; exit 1; }
          for f in sandbox_common.h sandbox_common.c sandbox_filter.h sandbox_filter.c \
                   sandbox_argv.h sandbox_argv.c sandbox_launch.c sandbox_capture.c \
                   sandbox_relay.c; do
            test -f "$SRC/$f" || { echo "e3-0b: missing $f" >&2; exit 1; }
          done
          # Runtime .pin enforcement (H1): sha256 of embedded sources vs committed pins.
          test -f "$LIB/sandbox_c.pin" || { echo "e3-0b: sandbox_c.pin missing" >&2; exit 1; }
          (cd "$SRC" && sha256sum -c "$LIB/sandbox_c.pin")
          "$GCC" -static -O2 -Wall -Werror -o /opt/csl-claude/launch \
            "$SRC/sandbox_launch.c" "$SRC/sandbox_argv.c" "$SRC/sandbox_common.c" -I"$SRC"
          "$GCC" -static -O2 -Wall -Werror -o /opt/csl-relay/bin/capture-start \
            "$SRC/sandbox_capture.c" "$SRC/sandbox_common.c" -I"$SRC"
          "$GCC" -static -O2 -Wall -Werror -o /opt/csl-relay/bin/relay \
            "$SRC/sandbox_relay.c" "$SRC/sandbox_filter.c" "$SRC/sandbox_common.c" -I"$SRC"
          install -o root -g root -m0755 /opt/csl-relay/bin/relay /opt/csl-relay/bin/filter
          chown root:root /opt/csl-claude/launch /opt/csl-relay/bin/capture-start \
            /opt/csl-relay/bin/relay /opt/csl-relay/bin/filter
          chmod 0755 /opt/csl-claude/launch /opt/csl-relay/bin/capture-start \
            /opt/csl-relay/bin/relay /opt/csl-relay/bin/filter
          # Directory containing launch only (plus lib/src which are not in the launch dir).
          test -x /opt/csl-claude/launch
          test -x /opt/csl-relay/bin/relay

          if ! command -v bun >/dev/null 2>&1; then
            echo "e3-0b: bun missing after setup-bun" >&2
            exit 1
          fi
          BUN_SRC="$(command -v bun)"
          install -D -m0755 -o root -g root "$BUN_SRC" "$BUN_DST"
          sha256sum "$BUN_DST" | awk '{print $1}' > "$STATE/bun.tofu"
          chmod 0644 "$STATE/bun.tofu"
          "$PYTHON" -I "$LIB/sandbox_e3_environ.py" record-bun
          "$PYTHON" -I "$LIB/sandbox_e3_bind.py" empty-bun-bin
          "$PYTHON" -I "$LIB/sandbox_e3_bind.py" hash-setup-bun

          # 0b step 2: fixer helper already written by the workflow YAML into RUNNER_TEMP.
          GUARD="${RUNNER_TEMP:?}/claude-fixer-guard"
          if [ -f "$GUARD/model-api" ]; then
            "$PYTHON" -I "$GUARD/model-api" install
            chown -R root:root "$GUARD"
            chmod 0755 "$GUARD" "$GUARD/model-api"
            if [ -f "$GUARD/context.json" ]; then chmod 0644 "$GUARD/context.json"; fi
            if [ -e "$GUARD/read-token" ]; then chmod 0644 "$GUARD/read-token"; fi
            test "$(stat -c %U "$GUARD/model-api")" = root
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y --no-install-recommends bubblewrap socat gcc libc6-dev
          command -v bwrap
          command -v socat

          # 0b step 3: docker / containerd / podman / lxd stop+mask (F12).
          for unit in docker.socket docker.service containerd.socket containerd.service \
                      podman.socket podman.service lxd.socket snap.lxd.daemon; do
            systemctl stop "$unit" 2>/dev/null || true
            systemctl mask "$unit" 2>/dev/null || true
          done

          # 0b step 4: ptrace_scope=2 (fail closed if Yama missing).
          test -f /proc/sys/kernel/yama/ptrace_scope
          sysctl -w kernel.yama.ptrace_scope=2

          # 0b step 5: nsswitch / sudo.conf (U-16).
          "$PYTHON" -I "$LIB/sandbox_e3_bind.py" check-u16

          # 0b step 6: drop runner from sudo/adm/lxd/docker (G10). Fail closed if still
          # listed in the group file after the drop.
          drop_group() {
            local g="$1"
            if getent group "$g" >/dev/null; then
              if getent group "$g" | grep -qE '[:,]runner(,|$)'; then
                gpasswd -d runner "$g"
              fi
              if getent group "$g" | grep -qE '[:,]runner(,|$)'; then
                echo "e3-0b: runner still in $g" >&2
                exit 1
              fi
            fi
          }
          drop_group sudo
          drop_group adm
          drop_group lxd
          drop_group docker
          id runner | tee "$STATE/id.runner" >/dev/null
          for sock in /var/run/docker.sock /var/snap/lxd/common/lxd/unix.socket \
                      /run/containerd/containerd.sock /run/podman/podman.sock; do
            if [ -S "$sock" ]; then
              mode=$(stat -c %a "$sock")
              case "$mode" in
                *2|*3|*6|*7) echo "e3-0b: group-writable socket $sock" >&2; exit 1 ;;
              esac
            fi
          done

          test -d "$AP" || { echo "e3-0b: pinned action dir missing" >&2; exit 1; }

          # 0b step 8: E3-1 CLI pin then E3-3 bun install, before sudoers.
          test -f "$LIB/sandbox_e3_cli_pin.sh" || { echo "e3-0b: cli_pin missing" >&2; exit 1; }
          /bin/bash --noprofile --norc -e -o pipefail "$LIB/sandbox_e3_cli_pin.sh"
          if [ -f "$AP/package.json" ]; then
            (cd "$AP" && "$BUN_DST" install --frozen-lockfile --production --ignore-scripts)
          fi

          # 0b step 9: git-tree hash, extra-file check, node_modules digest, then bind.
          command -v git >/dev/null 2>&1 || { echo "e3-0b: git missing" >&2; exit 1; }
          REF="$STATE/cca.git"
          git init --bare "$REF"
          git -C "$REF" fetch --depth 1 https://github.com/anthropics/claude-code-action.git \
            a5a423f75c251dcbff8a74e99f83b2cb03c72bfa
          git -C "$REF" ls-tree -r FETCH_HEAD > "$STATE/cca.ls-tree"
          "$PYTHON" -I "$LIB/sandbox_e3_bind.py" hash-git-tree
          BUNREF="$STATE/setup-bun.git"
          git init --bare "$BUNREF"
          git -C "$BUNREF" fetch --depth 1 https://github.com/oven-sh/setup-bun.git \
            0c5077e51419868618aeaa5fe8019c62421857d6
          git -C "$BUNREF" ls-tree -r FETCH_HEAD > "$STATE/setup-bun.ls-tree"
          "$PYTHON" -I "$LIB/sandbox_e3_bind.py" verify-pins
          "$PYTHON" -I "$LIB/sandbox_e3_bind.py" hash-node-modules
          chown -R root:root "$AP"
          chmod -R go-w "$AP"

          # J2 bind order, outermost first. $AP last, then remount ro.
          mount --bind /home/runner/work /home/runner/work
          mount --bind /home/runner/work/_actions /home/runner/work/_actions
          mount --bind /home/runner/work/_actions/anthropics /home/runner/work/_actions/anthropics
          mount --bind /home/runner/work/_actions/anthropics/claude-code-action /home/runner/work/_actions/anthropics/claude-code-action
          mount --bind "$AP" "$AP"
          mount -o remount,bind,ro "$AP"

          awk '$5=="'"$AP"'" || $5=="/home/runner/work" || $5=="/home/runner/work/_actions" || $5=="/home/runner/work/_actions/anthropics" || $5=="/home/runner/work/_actions/anthropics/claude-code-action"' /proc/self/mountinfo > "$STATE/mountinfo"
          # Worker ns/mnt must equal 0b's (fail closed, H4).
          test -s "$STATE/ns.mnt"
          test "$(readlink /proc/"$WORKER_PID"/ns/mnt)" = "$(cat "$STATE/ns.mnt")"
          "$PYTHON" -I "$LIB/sandbox_e3_bind.py" record-inodes

          # 0b step 10: ~/.claude empty, runner-owned 0700.
          rm -rf /home/runner/.claude /home/runner/.claude.json
          mkdir -m 0700 /home/runner/.claude
          chown runner:runner /home/runner/.claude
          rm -f /home/runner/.bunfig.toml /home/runner/.npmrc /home/runner/.docker/config.json
          if [ -d /home/runner/.docker ] && [ -z "$(ls -A /home/runner/.docker 2>/dev/null || true)" ]; then
            rmdir /home/runner/.docker || true
          fi

          # 0b step 11: exact sudoers, rename-atomic, visudo -cf (F10). No NOPASSWD:ALL.
          printf '%s' "$SUDOERS_TEXT" > /etc/sudoers.new
          install -m0440 -o root -g root /etc/sudoers.new /etc/sudoers.new
          visudo -cf /etc/sudoers.new
          # fsync via python (already root).
          "$PYTHON" -I -c 'import os; fd=os.open("/etc/sudoers.new", os.O_RDONLY); os.fsync(fd); os.close(fd)'
          mv -f /etc/sudoers.new /etc/sudoers
          if [ -d /etc/sudoers.d ]; then
            find /etc/sudoers.d -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          fi

          # 0b step 12: sweep runner-uid extras (record; fail closed on unknown), then arm.
          ALLOW_PIDS="$$ $PPID $WORKER_PID"
          ps -eo pid,user,ppid,args --no-headers | awk '$2=="runner"{print}' > "$STATE/sweep.runner" || true
          # Inventory extras as veto-only records (G1(d)).
          ps -eo pid,user,args --no-headers | awk '$2=="root"{print}' > "$STATE/sweep.root" || true
          crontab -u runner -l > "$STATE/cron.runner" 2>/dev/null || true
          printf '%s\n' "${GITHUB_WORKSPACE:-}" > "$STATE/workspace"
          chmod 0644 "$STATE/workspace"

          # Start capture daemon (empty argv, not in sudoers) then bind 0600.
          /opt/csl-relay/bin/capture-start >/var/lib/csl-relay/daemon.log 2>&1 &
          echo $! > "$STATE/daemon.pid"
          sleep 0.2
          test -S "$STATE/handoff.sock"
          # Socket stays 0600 until F1 observation (daemon chmod 0666).
          chmod 0600 "$STATE/handoff.sock"

          # Apparmor sysctl AFTER the sweep (J2(d)).
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          # Invoke environ/record so they are not dead (H4 / N8). C also checks bun X
          # environ in F1 without writing /proc/PID/environ (N9).
          "$PYTHON" -I "$LIB/sandbox_e3_bind.py" observe
          "$PYTHON" -I "$LIB/sandbox_e3_environ.py" check-ld
          "$PYTHON" -I "$LIB/sandbox_e3_record.py" write

          # 0b step 13: negative controls as runner (T3/T7). Step fails if any succeeds.
          fail_closed() {
            local desc="$1"
            shift
            if runuser -u runner -- "$@" >/dev/null 2>&1; then
              echo "e3-0b: negative control succeeded (want fail): $desc" >&2
              exit 1
            fi
          }
          fail_closed "sudo -n /bin/true" sudo -n /bin/true
          fail_closed "sudo -n -u nobody /bin/true" sudo -n -u nobody /bin/true
          fail_closed "sudo -n -u nobody relay" sudo -n -u nobody /opt/csl-relay/bin/relay
          fail_closed "sudo -n -E relay" sudo -n -E /opt/csl-relay/bin/relay
          fail_closed "sudo -n FOO=1 relay" sudo -n FOO=1 /opt/csl-relay/bin/relay
          fail_closed "sudo -n filter" sudo -n /opt/csl-relay/bin/filter
          fail_closed "sudo -n launch" sudo -n /opt/csl-claude/launch
          runuser -u runner -- sudo -l > "$STATE/sudo.l"
          grep -q 'NOPASSWD: ALL' "$STATE/sudo.l" && { echo "e3-0b: NOPASSWD:ALL remains" >&2; exit 1; }
          grep -q SETENV "$STATE/sudo.l" && { echo "e3-0b: SETENV remains" >&2; exit 1; }
          grep -q '/opt/csl-relay/bin/relay' "$STATE/sudo.l" || {
            echo "e3-0b: sudo -l missing relay" >&2
            exit 1
          }

          # 0b step 14: exact sudoers bytes (not a vacuous grep -qv).
          printf '%s' "$SUDOERS_TEXT" > "$STATE/sudoers.want"
          cmp -s /etc/sudoers "$STATE/sudoers.want" || {
            echo "e3-0b: /etc/sudoers does not match compiled-in text" >&2
            exit 1
          }
          grep -q 'NOPASSWD: /opt/csl-relay/bin/relay' /etc/sudoers
          grep -q 'NOPASSWD: ALL' /etc/sudoers && { echo "e3-0b: NOPASSWD:ALL in sudoers" >&2; exit 1; }

          # U-18 parent-shape hook: record ppid chain. Do not pick fork vs exec here.
          tr '\0' ' ' < /proc/$$/cmdline > "$STATE/u18.self.cmdline" || true
          if [ -r "/proc/$PPID/cmdline" ]; then
            tr '\0' ' ' < "/proc/$PPID/cmdline" > "$STATE/u18.ppid.cmdline" || true
            readlink "/proc/$PPID/exe" > "$STATE/u18.ppid.exe" || true
          fi
          printf 'u18_status=[A]\nsee=f-u18.md\naccepted_shapes=sudo_fork,sudo_exec\n' > "$STATE/u18.record"

          # Do not set SRT_DEBUG. Capture daemon is already running.
          CSL_E3_BOOTSTRAP
          /bin/bash --noprofile --norc -e -o pipefail /opt/csl-claude/lib/sandbox_e3_bootstrap.sh

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.fixer-prepare.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Attach verified PR branch at event SHA
        env:
          HEAD_REF: ${{ needs.fixer-prepare.outputs.head_ref }}
          HEAD_SHA: ${{ needs.fixer-prepare.outputs.head_sha }}
        run: |
          set -euo pipefail
          git checkout -B "$HEAD_REF" "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(git rev-parse --abbrev-ref HEAD)" = "$HEAD_REF"
          # The publish job accepts only this committer identity.
          git config user.name "claude[bot]"
          git config user.email "209825114+claude[bot]@users.noreply.github.com"
          # Keep the outbox and reply bodies out of commits.
          mkdir -p .git/info
          printf '%s\n' .claude-fixer-out/ .claude-fixer-replies/ >> .git/info/exclude
      - name: "Fixer attempt ${{ needs.fixer-prepare.outputs.attempt_key }}"
        id: outbox
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          HEAD_REF: ${{ needs.fixer-prepare.outputs.head_ref }}
          HEAD_SHA: ${{ needs.fixer-prepare.outputs.head_sha }}
          WRITER_MODE: fixer
          RECEIPT_CONTEXT: ${{ needs.fixer-prepare.outputs.receipt_context }}
        run: |
          set -euo pipefail
          test -x "$RUNNER_TEMP/claude-fixer-guard/model-api"
          test "$(stat -c %U "$RUNNER_TEMP/claude-fixer-guard/model-api")" = root
      - name: Pin isolated system python
        id: pin-python
        # CSL-467 U2: resolve /usr/bin/python3 before the model can poison
        # GITHUB_ENV/GITHUB_PATH. The denials step uses this output, not PATH.
        run: |
          set -euo pipefail
          python3="$(readlink -f /usr/bin/python3)"
          case "$python3" in
            /usr/bin/python3|/usr/bin/python3.*) ;;
            *) echo "::error::refusing non-system python3" >&2; exit 1 ;;
          esac
          test -x "$python3" && test -f "$python3"
          echo "python3=$python3" >> "$GITHUB_OUTPUT"
      - name: Install the subprocess sandbox for Claude's commands
        run: |
          # Folded into E3-0-early 0b (apt + apparmor after sweep). After sudoers
          # this step cannot sudo; assert the 0b install.
          command -v bwrap
          command -v socat
      - id: claude
        timeout-minutes: 20
        # v1.0.256 (CSL-412): pinned; bumps recheck the allowed_non_write_users and git-auth behaviour.
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa
        env:
          # Scrub credentials from the commands Claude runs (sandboxed by bubblewrap above).
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          DISABLE_UPDATES: "1"
        with:
          # CSL-383: no post-step that publishes the model-writable inline-comment
          # buffer (/tmp/inline-comments-buffer.jsonl) with a write token.
          classify_inline_comments: "false"
          path_to_bun_executable: /opt/csl-bun/bun
          path_to_claude_code_executable: /opt/csl-claude/launch
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Read-only job token: no OIDC App-token exchange in this job.
          github_token: ${{ github.token }}
          # Any value makes the action back git with a credential helper that reads GH_TOKEN,
          # instead of writing this token into the origin URL in .git/config, where Read
          # could open it. No GitHub login starts with "-", so no actor skips the write check.
          allowed_non_write_users: "-no-such-user-"
          bot_id: "209825114"
          bot_name: "claude[bot]"
          allowed_bots: devin-ai-integration
          include_comments_by_actor: devin-ai-integration[bot]
          # CSL-467: Write/Edit run as runner, outside bwrap. Permission path
          # rules: Write(path) never matches (file checks use Edit/Read), so
          # Write(...) deny rules are omitted; Edit is the binding form.
          # A single leading / is relative to ~/.claude (the action writes
          # this JSON there). runner.temp and runner.tool_cache are absolute,
          # so /${{ runner.temp }} is the // filesystem-root form.
          # sandbox.allowUnsandboxedCommands defaults true
          # and an allow rule auto-approves the unsandboxed retry.
          # autoAllowBashIfSandboxed also defaults true and would auto-approve
          # any sandboxed Bash outside the helper-only allowedTools path
          # (https://code.claude.com/docs/en/sandboxing#auto-allow-mode).
          # allowedTools still allows Write(/github.workspace/**); that is an
          # allow, not a deny. Extra Edit/Read denies cover
          # _runner_file_commands and the GITHUB_ENV (set_env_*) /
          # GITHUB_PATH (add_path_*) files. Hosted-runner externals live at
          # /home/runner/runners/<ver>/externals; Linux denyWrite skips
          # wildcards, so that path is Edit-only. ~/.bash_login is denied
          # with the other shell startup files (D10).
          # U-8 (deny matching) is still unverified on hosted runners.
          # network.allowedDomains is what the helper's `gh api`/`graphql`
          # calls need (api.github.com plus github.com for auth/redirects).
          # WebFetch is disallowed, so nothing else feeds the list.
          # strictAllowlist is honored in user settings (~/.claude/settings.json)
          # so unlisted hosts are refused instead of prompted or auto-allowed
          # in bypassPermissions. Live helper + Edit-deny evidence still needs
          # a human-triggered run; this session does not dispatch workflows.
          settings: |
            {
              "sandbox": {
                "enabled": true,
                "allowUnsandboxedCommands": false,
                "autoAllowBashIfSandboxed": false,
                "failIfUnavailable": true,
                "filesystem": {
                  "denyWrite": [
                    "${{ runner.temp }}/_runner_file_commands",
                    "${{ runner.tool_cache }}",
                    "/home/runner/work/_actions",
                    "/opt/csl-claude",
                    "/opt/csl-relay",
                    "/var/lib/csl-relay"
                  ]
                },
                "network": {
                  "allowedDomains": [
                    "api.github.com",
                    "github.com"
                  ],
                  "strictAllowlist": true
                }
              },
              "permissions": {
                "deny": [
                  "Read(.env)",
                  "Read(.env.*)",
                  "Edit(.github/workflows/**)",
                  "Edit(.git/hooks/**)",
                  "Edit(.git/config)",
                  "Edit(.git/config.worktree)",
                  "Edit(.git/info/**)",
                  "Edit(.git/commondir)",
                  "Edit(.git/modules/**)",
                  "Edit(.git/worktrees/**)",
