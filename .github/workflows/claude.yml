            The commit operation keeps .claude-fixer-replies and .claude-fixer-out files out of commits.
            Raw gh api, custom endpoints/methods and ref mutations are unavailable.
            PUBLISHING: you have no push access and must not try. Commit locally only. After this job a trusted workflow job
            validates your new commits and pushes them as one ordinary fast-forward. It refuses everything you queued if the PR
            head moved, the PR is paused, or a commit is invalid: merge commits (conflict job: anything but the one merge),
