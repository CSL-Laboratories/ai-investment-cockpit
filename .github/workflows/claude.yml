          python3 -I "$RUNNER_TEMP/claude-fixer-publish/publish.py"

  fixer-prepare:
    needs: resolve-pr
    # Trusted current-head Devin submitted reviews run directly. Authorized
    # manual dispatch remains available. Recheck findings after taking the lock.
    if: >-
      needs.resolve-pr.outputs.devin == 'true' &&
      needs.resolve-pr.outputs.same_repo == 'true' &&
      (
        github.event_name == 'pull_request_review' ||
        (github.event_name == 'repository_dispatch' && github.event.action == 'devin-review-fix') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'devin-review-fix')
      )
    concurrency:
      group: claude-${{ needs.resolve-pr.outputs.pr_number }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Trusted and model-free (CSL-377): locked preflight, loop cap, receipt-aware
    # eligibility and the attempt reservation. Only prepare and publish write
    # workflow markers. Checkout of github.workflow_sha only; no PR code.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      skip: ${{ steps.prepared.outputs.skip || 'true' }}
      head_sha: ${{ steps.preflight.outputs.head_sha }}
      head_ref: ${{ steps.preflight.outputs.head_ref }}
      comment_ids: ${{ steps.eligibility.outputs.comment_ids }}
      receipt_context: ${{ steps.eligibility.outputs.receipt_context }}
      attempt_key: ${{ steps.eligibility.outputs.attempt_key }}
      run_attempt: ${{ github.run_attempt }}
    steps:
      - name: Checkout trusted workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: .csl-trusted-workflow
          persist-credentials: false
      - name: Verify trusted workflow commit
        run: |
          set -euo pipefail
          ROOT="${{ github.workspace }}/.csl-trusted-workflow"
          TRUSTED="$ROOT/scripts/ci"
          test -d "$TRUSTED"
          test ! -L "$ROOT"
          test ! -L "$TRUSTED"
          test "$(git -C "$ROOT" rev-parse HEAD)" = "${{ github.workflow_sha }}"
      - name: Recheck current head and unresolved Devin findings
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          EXPECTED_HEAD_REF: ${{ needs.resolve-pr.outputs.head_ref }}
          CLAUDE_FIXER_PAUSE: ${{ vars.CLAUDE_FIXER_PAUSE }}
          REVIEW_ID: ${{ github.event.review.id || '' }}
        run: |
          set -euo pipefail
          TRUSTED="${{ github.workspace }}/.csl-trusted-workflow/scripts/ci"
          test -d "$TRUSTED"
          test ! -L "$TRUSTED"
          test ! -L "${{ github.workspace }}/.csl-trusted-workflow"
          test "$(git -C "${{ github.workspace }}/.csl-trusted-workflow" rev-parse HEAD)" = "${{ github.workflow_sha }}"
          python3 -I "$TRUSTED/claude_fixer_preflight.py"
      - name: Fixer loop cap (>=8 claude[bot] commits since last human commit)
        id: cap
        if: steps.preflight.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          HEAD_SHA: ${{ steps.preflight.outputs.head_sha }}
        run: |
          set -euo pipefail
          # Count claude[bot] commits after the newest human commit. Other bots
          # (e.g. merge/dependabot) neither count nor reset the streak. Author
          # and committer both: the model can pass `git commit --author`, but its
          # committer comes from the job's git config, so a commit is human only
          # when neither side is Claude or a bot.
          commits="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/commits?per_page=100" \
            --jq '.[] | [(.author.login // "-"), (.commit.author.name // "-"), (.committer.login // "-"), (.commit.committer.name // "-")] | @tsv')"
          count=0
          while IFS=$'\t' read -r login name clogin cname; do
            [ -z "$login$name$clogin$cname" ] && continue
            if [ "$login" = "claude[bot]" ] || [ "$name" = "claude[bot]" ] || [ "$name" = "claude" ] \
                || [ "$clogin" = "claude[bot]" ] || [ "$cname" = "claude[bot]" ] || [ "$cname" = "claude" ]; then
              count=$((count + 1))
            elif [[ "$login" == *"[bot]" || "$name" == *"[bot]" || "$clogin" == *"[bot]" || "$cname" == *"[bot]" ]]; then
              continue
            else
              break
            fi
          done < <(printf '%s\n' "$commits" | tac)
          # GitHub lists at most 250 PR commits, oldest first, so the newest may
          # be missing. A possibly truncated list counts as at the cap.
          total="$(printf '%s\n' "$commits" | grep -c . || true)"
          if [ "$total" -ge 250 ] && [ "$count" -lt 8 ]; then
            echo "::notice::$total PR commits listed (GitHub's limit is 250); treating the loop cap as reached. A human commit cannot reset this, so a human has to take over this PR."
            count=8
          fi
          echo "claude[bot] commits since last human commit: $count"
          # Receipt-aware eligibility decides whether any pending work remains
          # before this count can pause the fixer or post a loop-cap notice.
          echo "loop_commit_count=$count" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Select pending findings and reserve bounded attempt
        id: eligibility
        if: steps.preflight.outputs.skip != 'true' && steps.cap.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ needs.resolve-pr.outputs.pr_number }}
          FIXER_HEAD_SHA: ${{ steps.preflight.outputs.head_sha }}
          LOOP_COMMIT_COUNT: ${{ steps.cap.outputs.loop_commit_count }}
          MANUAL_RETRY: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          TRUSTED="${{ github.workspace }}/.csl-trusted-workflow/scripts/ci"
          test -d "$TRUSTED"
          test ! -L "$TRUSTED"
          test ! -L "${{ github.workspace }}/.csl-trusted-workflow"
          test "$(git -C "${{ github.workspace }}/.csl-trusted-workflow" rev-parse HEAD)" = "${{ github.workflow_sha }}"
          mkdir -p "$RUNNER_TEMP/claude-fixer-guard"
          install -m 0444 "$TRUSTED/claude_fixer_receipts.py" "$RUNNER_TEMP/claude-fixer-guard/receipts.py"
          python3 "$RUNNER_TEMP/claude-fixer-guard/receipts.py"
      - name: Record prepared writer context
        id: prepared
        if: steps.preflight.outputs.skip != 'true' && steps.cap.outputs.skip != 'true' && steps.eligibility.outputs.skip == 'false'
        run: echo "skip=false" >> "$GITHUB_OUTPUT"

  devin-review-fix:
    needs: [resolve-pr, fixer-prepare]
    # The untrusted model job keeps the devin-review-fix name and its
    # "Fixer attempt" context step before the action step: the exhausted-fixer
    # escalation (scripts/ci/fixer_failure_escalation.py) binds to both.
    if: >-
      needs.fixer-prepare.result == 'success' &&
      needs.fixer-prepare.outputs.skip == 'false' &&
      needs.fixer-prepare.outputs.run_attempt == github.run_attempt
