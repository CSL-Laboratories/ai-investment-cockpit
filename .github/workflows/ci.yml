          head="$(git rev-parse HEAD)"
          [ "$head" = "$GITHUB_SHA" ]
          [ "$head" = "$GITHUB_WORKFLOW_SHA" ]
          [ -n "$DEFAULT_BRANCH" ]
          [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]
          [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]
          helper=scripts/ci/merge_candidate.py
          if [ -L "$helper" ] || [ ! -f "$helper" ]; then
            echo "::error::Trusted candidate validator is absent from policy commit ${head}; the candidate copy is never substituted."
            exit 1
          fi
          stage="${RUNNER_TEMP}/codex-policy"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp "$helper" "$stage/merge_candidate.py"
          # Stage every control file this trusted YAML executes after the
          # candidate checkout (local action, installer, pins, aggregate helper,
          # workflows). Validation refuses candidate copies that differ.
          python -I -X utf8 -B "$stage/merge_candidate.py" stage-policy "$stage"
          [ -f "$stage/manifest.json" ]
          {
            echo "CODEX_POLICY_SHA=$head"
            echo "CODEX_POLICY_BRANCH=$DEFAULT_BRANCH"
            echo "CODEX_POLICY_VALIDATOR=$stage/merge_candidate.py"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate exact full candidate
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_id != '' || inputs.pr_base_sha != '' || inputs.merge_tree_sha != '' || inputs.dispatch_nonce != '')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
          PR_BASE_SHA: ${{ inputs.pr_base_sha }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          MERGE_TREE_SHA: ${{ inputs.merge_tree_sha }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          CANDIDATE_SCOPE: ${{ inputs.scope }}
        shell: bash
        run: |
          set -euo pipefail
