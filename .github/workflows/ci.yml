name: ci

# DEC-09 still owns package acceptance: the local native-Windows + Ubuntu/WSL2 ×
# Python 3.11/3.12 matrix on the operator workstation. Hosted jobs here are merge
# diagnostics, not a substitute for that matrix, and they do not satisfy online,
# broker, witness, paper-day, or pre-live gates. macOS remains best-effort; Hetzner
# is outside the current package.
#
# Hosted split (cost: keep ordinary PR spend on Blacksmith Linux 2 vCPU):
#   linux-gates  — required PR check; Linux 3.11+3.12, ruff + pytest
#   windows      — push to main, workflow_dispatch, or PR label `ci:full`
#   macos        — nightly 07:17 UTC on main (skipped if idle 24h), ci:full, or
#                  workflow_dispatch. GitHub-hosted macos-latest. Not on ordinary
#                  main pushes: ~$0.93/run would dominate a ~$50 budget.
#   qualification — CSL-221 evidence only. Blacksmith Linux, Windows, and macOS
#                  (blacksmith-6vcpu-macos-15) for the provider-free tier.
#                  This does not replace DEC-09 and is not a release decision.
#   benchmarks   — pull_request only, and only when filter runs the code gates.
#                  Same-runner median comparison against the PR base SHA. Warns
#                  above 10% after sample spread; does not fail linux-gates.
#                  One 2 vCPU job, aimed at well under a minute. Blacksmith
#                  Ubuntu x64 2 vCPU is $0.004/min, so a billed minute is a
#                  rounding error next to the $50 budget.
#
# Ordinary labeled/unlabeled events do not start this workflow, so they cannot
# post a skipped or successful linux-gates over a real result. `ci:full` and
# `enhancement` re-trigger via ci-label-retrigger.yml (workflow_dispatch); that
# companion has no job named linux-gates. Draft PRs skip the test matrix; the
# linux-gates aggregator still runs and fails closed until ready_for_review.
# Non-test jobs (filter, linux-gates) use ubuntu-latest; the public repo does
# not pay for those minutes. The Python linux/windows matrix stays on Blacksmith.
#
# This workflow supersedes the Blacksmith Migration Wizard PR that only swapped
# runner labels (open PR #100, branch blacksmith-migration-33156c9).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    # 07:17 UTC: US night / EU morning, off the hour to miss the cron stampede.
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Hosted platform scope (label retriggers may request Linux only)
        type: choice
        options: [full, linux]
        default: full
        required: false
      pr_number:
        description: PR identity for label retriggers (omit for manual branch runs)
        type: string
        default: ""
      pr_head_sha:
        description: Expected PR head for a label retrigger
        type: string
        default: ""
      merge_sha:
        description: Immutable PR merge candidate for a label retrigger
        type: string
        default: ""

# Manual/API dispatch defaults to full; enhancement-only label reruns request
# scope=linux without changing Linux gates or ordinary PR platform selection.
permissions:
  contents: read

# A newer run for the same PR head supersedes the run it interrupted; an old
# label dispatch cannot cancel a newer head before its filter validates context.
# Plain branch runs still supersede by ref. Nightly has its
# own group so it cannot cancel a main-push Linux/Windows run (or vice versa).
# Draft synchronize uses a separate group so its fail-closed aggregator cannot
# cancel a ready_for_review matrix (or vice versa).
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}-${{ inputs.pr_head_sha || github.event.pull_request.head.sha || 'branch' }}-${{ github.event_name == 'schedule' && 'nightly' || (github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft') || 'default' }}
  cancel-in-progress: true

jobs:
  filter:
    name: filter
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-tests: ${{ steps.decide.outputs.run-tests }}
      run-macos: ${{ steps.decide.outputs.run-macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 2
      - name: Validate label dispatch context
        if: github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
          MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          set -euo pipefail
          # Plain manual/API dispatch retains the selected branch and full default.
          if [ -z "$PR_NUMBER$PR_HEAD_SHA$MERGE_SHA" ]; then
            exit 0
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # A branch advance between label event and dispatch must fail closed.
          [ "$GITHUB_SHA" = "$PR_HEAD_SHA" ]
          [ "$(git rev-parse HEAD)" = "$MERGE_SHA" ]
          [ "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA" ]
      - name: Decide whether code gates must run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          emit() {
            echo "run-tests=$1" >> "$GITHUB_OUTPUT"
            echo "run-macos=$2" >> "$GITHUB_OUTPUT"
            echo "run-tests=$1 run-macos=$2"
          }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            emit true true
            echo "workflow_dispatch always runs hosted gates."
            exit 0
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            # Nightly is macOS-only. Do not start Linux/Windows. Skip macOS when
            # main had no commits in the last 24h so idle days do not spend ~$0.93.
            git fetch --deepen=500 || git fetch --unshallow || true
            count="$(git rev-list --count --since='24 hours ago' HEAD || echo "")"
            if [ -z "$count" ]; then
              emit false true
              echo "Could not count recent commits; fail open to nightly macOS."
              exit 0
            fi
            if [ "$count" -gt 0 ]; then
              emit false true
              echo "Nightly macOS: ${count} commit(s) on this ref in the last 24h."
            else
              emit false false
              echo "Nightly macOS skipped: no commits in the last 24h."
            fi
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_HEAD"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            emit true false
            echo "No base SHA; fail open to running tests."
            exit 0
          fi
          if ! git fetch --depth=1 origin "$BASE" || ! git fetch --depth=1 origin "$HEAD"; then
            emit true false
            echo "Could not fetch diff endpoints; fail open to running tests."
            exit 0
          fi
          if ! files="$(git diff --name-only "$BASE" "$HEAD" --)"; then
            emit true false
            echo "Could not diff endpoints; fail open to running tests."
            exit 0
          fi
          if [ -z "$files" ]; then
            emit false false
            echo "No changed files; skip test jobs."
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$files"
          run_tests=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Swarm tests import docs/research/swarm-tools, schemas, and hashed
            # briefs. Any Python/JSON/YAML under docs/ is executable or a fixture,
            # not skippable documentation.
            if printf '%s\n' "$f" | grep -Eq \
              '^docs/research/swarm-tools/|^docs/research/swarm-schemas/|^docs/research/swarm-briefs/|\.py$|\.json$|\.ya?ml$'; then
              run_tests=true
              break
            fi
            if printf '%s\n' "$f" | grep -Eq '^docs/|\.md$|^LICENSE([.].*)?$|^\.gitignore$|^\.gitattributes$|^\.editorconfig$'; then
              continue
            fi
            run_tests=true
            break
          done <<< "$files"
          emit "$run_tests" false

  linux:
    name: linux
    permissions:
      contents: read
    needs: filter
    if: needs.filter.outputs.run-tests == 'true'
    # Optional hosted Linux diagnostic for the two CPython versions DEC-09 covers.
    # fail-fast is off so every requested cell reports. Does not replace the local
    # Ubuntu/WSL2 cells.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # The extension build below is a release PyO3 compile on top of the Python suite.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - uses: ./.github/actions/run-gates
        with:
          python-version: ${{ matrix.python-version }}
      - name: CI dispatch scope regressions
        run: python -X utf8 -B tools/test_ci_dispatch_scope.py
      # CSL-166: the required linux gate runs pytest before any wheel exists, so
      # test_book_batch.py's skipif dropped the whole file. Build the extension
      # here and run that file. This is the existing linux job, not a new
      # workflow, and it does not add Windows or macOS cells.
      - name: Install the Rust toolchain for batch parity
        if: hashFiles('rust/cockpit-py/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: "1.83.0"
      - name: Batch parity against the Rust extension
        if: hashFiles('rust/cockpit-py/Cargo.toml') != ''
        run: |
          set -euo pipefail
          python -m pip install -U maturin
          python -m maturin build --release --manifest-path rust/cockpit-py/Cargo.toml
          python -c "import glob, subprocess, sys; wheels = glob.glob('rust/target/wheels/cockpit_quant-*.whl'); assert wheels, 'no wheel built'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', *wheels])"
          cd app
          python -m pytest -q tests/quant/book/test_book_batch.py -ra | tee "$RUNNER_TEMP/batch-parity.txt"
          if grep -q 'skipped' "$RUNNER_TEMP/batch-parity.txt"; then
            echo "batch parity skipped; cockpit_quant did not load"
            exit 1
          fi

  # Stable required status-check name. Passes when the Linux matrix succeeded, or
  # when filter ran and Linux was skipped because the change is docs-only.
  # This job never skips on pull_request/push/dispatch: a skipped required check
  # is treated as success. Drafts skip filter, so the script fails closed until
  # ready_for_review. Ordinary labels never start this workflow.
  # Configure branch protection / rulesets to require exactly this name: linux-gates
  linux-gates:
    name: linux-gates
    permissions:
      contents: read
    needs: [filter, linux]
    if: always() && !cancelled() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Required Linux gate
        env:
          FILTER_RESULT: ${{ needs.filter.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          set -euo pipefail
          echo "filter=${FILTER_RESULT} linux=${LINUX_RESULT}"
          if [ "$FILTER_RESULT" != "success" ]; then
            echo "filter job did not succeed"
            exit 1
          fi
          if [ "$LINUX_RESULT" = "success" ] || [ "$LINUX_RESULT" = "skipped" ]; then
            exit 0
          fi
          echo "linux matrix result=${LINUX_RESULT}"
          exit 1

  windows:
    name: windows
    permissions:
      contents: read
    needs: filter
    if: >
      needs.filter.outputs.run-tests == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.scope != 'linux') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full'))
      )
    # Hosted Windows supplements, but does not replace, the DEC-09 native-Windows cells.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - uses: ./.github/actions/run-gates
        with:
          python-version: ${{ matrix.python-version }}

  macos:
    name: macos
    permissions:
      contents: read
    needs: filter
    if: >
      (github.event_name == 'workflow_dispatch' && inputs.scope != 'linux') ||
      (github.event_name == 'schedule' && needs.filter.outputs.run-macos == 'true') ||
      (
        github.event_name == 'pull_request' &&
        contains(github.event.pull_request.labels.*.name, 'ci:full') &&
        needs.filter.outputs.run-tests == 'true'
      )
    # Best-effort portability only. Single 3.12 cell on GitHub-hosted macos-latest
    # (no Blacksmith macOS). Not on ordinary main pushes: ~$0.93/run would dominate
    # the ~$50/month budget. Nightly 07:17 UTC skips when main was idle 24h.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - uses: ./.github/actions/run-gates
        with:
          python-version: "3.12"

  # Informational only. Not a dependency of linux-gates, so a regression
  # warning cannot block merge. A harness crash still fails this job.
  benchmarks:
    name: benchmarks
    permissions:
      contents: read
      issues: write
      pull-requests: write
    needs: filter
    if: github.event_name == 'pull_request' && needs.filter.outputs.run-tests == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _bench_base
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/benchmarks/requirements.txt
      - name: Install benchmark dependencies
        run: python -m pip install -r app/benchmarks/requirements.txt
      - name: Compare hot paths with the base tree
        working-directory: app
        run: |
          python -m benchmarks.compare \
            --baseline-root ../_bench_base \
            --candidate-root .. \
            --threshold 0.10 \
            --rounds 5 \
            --orderings 2 \
            --report ../bench-report.json \
            --summary ../bench-summary.md \
            --comment ../bench-comment.md \
            --clear-comment ../bench-clear.md \
            --leave ../bench-leave.md
      - name: Flag regressions on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- csl-perf-bench -->'
          mapfile -t ids < <(gh api --paginate "repos/${REPO}/issues/${PR}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id")
          existing="${ids[0]:-}"
          existing_file=""
          if [ -n "$existing" ]; then
            gh api "repos/${REPO}/issues/comments/${existing}" --jq .body > bench-existing.md
            existing_file=bench-existing.md
          fi
          body_file="$(EXISTING_FILE="$existing_file" PYTHONPATH=app python -c 'import os, sys; from pathlib import Path; from benchmarks.compare import select_comment_update; existing_path = os.environ.get("EXISTING_FILE") or ""; existing = Path(existing_path).read_text(encoding="utf-8") if existing_path else None; chosen = select_comment_update(existing, Path("bench-comment.md"), Path("bench-leave.md"), Path("bench-clear.md")); sys.stdout.write("" if chosen is None else str(chosen))')"
          if [ -z "$body_file" ]; then
            echo "Leaving the existing performance comment unchanged."
            exit 0
          fi
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" --raw-field body="$(cat "$body_file")"
          else
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" --raw-field body="$(cat "$body_file")"
          fi

  # CSL-221 provider-free evidence. Not a DEC-09 cell, not linux-gates, and not
  # a release decision. Checkout is the PR head, because pull_request GITHUB_SHA
  # is the merge commit. The six-cell matrix runs only when Linux, Windows, and
  # macOS are all authorized: a pull request with ci:full, or a full dispatch.
  # Ordinary PRs, scope=linux, the nightly schedule, and an ordinary push to
  # main do not start it. A partial matrix is not a pass. Artifact names
  # include the run attempt so a rerun does not collide, and a partial rerun
  # cannot mix attempts.
  qualification:
    name: qualification (${{ matrix.platform }}, ${{ matrix.python-version }})
    permissions:
      contents: read
      actions: write
    needs: filter
    if: >
      needs.filter.outputs.run-tests == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.scope != 'linux') ||
        (
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci:full')
        )
      )
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, macos]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.platform == 'linux' && 'blacksmith-2vcpu-ubuntu-2404' || matrix.platform == 'windows' && 'blacksmith-2vcpu-windows-2025' || 'blacksmith-6vcpu-macos-15' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      QUAL_REF: ${{ github.event.pull_request.head.sha || inputs.pr_head_sha || github.sha }}
      QUAL_JOB_NAME: qualification (${{ matrix.platform }}, ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.pr_head_sha || github.sha }}
          fetch-depth: 1
      - name: Bind the candidate commit and tree
        id: identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$QUAL_REF" ]; then
            echo "checked out $actual, requested $QUAL_REF"
            exit 1
          fi
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "commit=$actual" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pin a short TMP (Windows MAX_PATH)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\t | Out-Null
          "TMP=C:\t" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=C:\t" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Resolve the numeric job id
        id: job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          token = os.environ["GH_TOKEN"]
          runner = os.environ["RUNNER_NAME"]
          expected = os.environ["QUAL_JOB_NAME"]
          url = (
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
              f"/attempts/{attempt}/jobs?per_page=100"
          )
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          job_id = ""
          payload = {}
          for _ in range(15):
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              jobs = payload.get("jobs", [])
              named = [job for job in jobs if job.get("name") == expected]
              hosted = [
                  job for job in jobs
                  if job.get("runner_name") and job.get("runner_name") == runner
              ]
              chosen = named[0] if named else (hosted[0] if hosted else None)
              if chosen is not None and str(chosen.get("id", "")).isdigit():
                  job_id = str(chosen["id"])
                  break
              time.sleep(2)
          if not job_id.isdigit():
              names = [
                  f"{job.get('name')} runner={job.get('runner_name')}"
                  for job in payload.get("jobs", [])
              ]
              raise SystemExit("numeric job id is not visible: " + " | ".join(names))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"id={job_id}\n")
          PY
      - name: Provider-free qualification suite
        run: |
          set -euo pipefail
          python -m pip install pytest
          mkdir -p qualification-output
          python -m pip freeze --all > qualification-output/pip-freeze.txt
          python -X utf8 -B tools/qualification_evidence.py negative-controls \
            --matrix docs/evidence/csl221/qualification-matrix.json
          python -m pytest -q tools/test_qualification_evidence.py \
            --junitxml=qualification-output/junit.xml -p no:cacheprovider
          python -X utf8 -B tools/qualification_evidence.py emit-cell \
            --matrix docs/evidence/csl221/qualification-matrix.json \
            --platform "${{ matrix.platform }}" \
            --python "${{ matrix.python-version }}" \
            --commit "${{ steps.identity.outputs.commit }}" \
            --tree "${{ steps.identity.outputs.tree }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --job-id "${{ steps.job.outputs.id }}" \
            --junit qualification-output/junit.xml \
            --dependencies-raw qualification-output/pip-freeze.txt \
            --output qualification-cell
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-provider-free-${{ matrix.platform }}-${{ matrix.python-version }}-attempt-${{ github.run_attempt }}
          path: qualification-cell
          if-no-files-found: error
          retention-days: 90

  qualification-negative-controls:
    name: qualification-negative-controls
    permissions:
      contents: read
    needs: filter
    if: needs.filter.outputs.run-tests == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.pr_head_sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject wrong SHA, wrong tree, skipped cell, missing JUnit, and missing cell
        run: |
          set -euo pipefail
          python -X utf8 -B tools/qualification_evidence.py negative-controls \
            --matrix docs/evidence/csl221/qualification-matrix.json

  qualification-validate:
    name: qualification-validate
    permissions:
      contents: read
      actions: write
    needs: qualification
    if: needs.qualification.result == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      QUAL_REF: ${{ github.event.pull_request.head.sha || inputs.pr_head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.pr_head_sha || github.sha }}
          fetch-depth: 1
      - name: Bind the candidate commit and tree
        id: identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$QUAL_REF" ]; then
            echo "checked out $actual, requested $QUAL_REF"
            exit 1
          fi
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "commit=$actual" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: qualification-provider-free-*-attempt-${{ github.run_attempt }}
          path: qualification-artifacts
      - name: Assemble, validate, and prove the negative controls on this bundle
        env:
          COMMIT: ${{ steps.identity.outputs.commit }}
          TREE: ${{ steps.identity.outputs.tree }}
        run: |
          set -euo pipefail
          mkdir -p qualification-evidence-bundle
          python -X utf8 -B tools/qualification_evidence.py assemble \
            --artifact-root qualification-artifacts \
            --expected-commit "$COMMIT" \
