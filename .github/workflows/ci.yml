        )
      )
    # Best-effort portability only. Single 3.12 cell on GitHub-hosted macos-latest
    # (no Blacksmith macOS). Not on ordinary main pushes: ~$0.93/run would dominate
    # the ~$50/month budget. Nightly 07:17 UTC skips when main was idle 24h.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # Trusted policy commit first (github.sha on the default-branch dispatch),
      # validator staged outside the workspace, then the exact candidate merge.
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_id != '' || inputs.pr_base_sha != '' || inputs.merge_tree_sha != '' || inputs.dispatch_nonce != '')
        with:
