name: ci

# DEC-09 still owns package acceptance: the local native-Windows + Ubuntu/WSL2 ×
# Python 3.11/3.12 matrix on the operator workstation. Hosted jobs here are merge
# diagnostics, not a substitute for that matrix, and they do not satisfy online,
# broker, witness, paper-day, or pre-live gates. macOS remains best-effort; Hetzner
# is outside the current package.
#
# Hosted split (cost: keep ordinary PR spend on Blacksmith Linux 2 vCPU):
#   linux-gates  — required PR check; Linux 3.11+3.12, ruff + pytest
#                  (PR, merge_group, dispatch, and retained main push fallback)
#   windows      — merge_group, workflow_dispatch, or PR label `ci:full`
#                  (main push fallback retained until queue canary is approved)
#   macos        — nightly 07:17 UTC on main (skipped if idle 24h), ci:full, or
#                  workflow_dispatch. GitHub-hosted macos-latest (no Blacksmith macOS).
#                  Not on ordinary main pushes: ~$0.93/run would dominate a ~$50 budget.
#   benchmarks   — pull_request only, and only when filter runs the code gates.
#                  Same-runner median comparison against the PR base SHA. Warns
#                  above 10% after sample spread; does not fail linux-gates.
#                  One 2 vCPU job, aimed at well under a minute. Blacksmith
#                  Ubuntu x64 2 vCPU is $0.004/min, so a billed minute is a
#                  rounding error next to the $50 budget.
#
# Ordinary labeled/unlabeled events do not start this workflow, so they cannot
# post a skipped or successful linux-gates over a real result. `ci:full` and
# `enhancement` re-trigger via ci-label-retrigger.yml (workflow_dispatch); that
# companion has no job named linux-gates. Draft PRs skip the test matrix; the
# linux-gates aggregator still runs and fails closed until ready_for_review.
# Non-test jobs (filter, linux-gates) use ubuntu-latest; the public repo does
# not pay for those minutes. The Python linux/windows matrix stays on Blacksmith.
#
# This workflow supersedes the Blacksmith Migration Wizard PR that only swapped
# runner labels (open PR #100, branch blacksmith-migration-33156c9).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    # 07:17 UTC: US night / EU morning, off the hour to miss the cron stampede.
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Hosted platform scope (label retriggers may request Linux only)
        type: choice
        options: [full, linux]
        default: full
        required: false
      pr_number:
        description: PR identity for label retriggers (omit for manual branch runs)
        type: string
        default: ""
      pr_head_sha:
        description: Expected PR head for a label retrigger
        type: string
        default: ""
      merge_sha:
        description: Immutable PR merge candidate for a label retrigger
        type: string
        default: ""

# Manual/API dispatch defaults to full; enhancement-only label reruns request
# scope=linux without changing Linux gates or ordinary PR platform selection.
permissions:
  contents: read

# Newer runs of the same PR cancel superseded heads (cancel-in-progress). The
# group is the PR number (or ref for branch runs), not the head SHA: a SHA
# suffix made every push a new group, so old runs kept billing. Suffixes are
# nightly | label-<expected-head>-<scope> | manual-<scope> | queue | draft | default.
# Label workflow_dispatch keeps its expected head and scope because
# `gh workflow run --ref` resolves to the current head; a stale label rerun
# must not cancel that head's PR run or newer label run. Scope isolation also
# prevents a delayed enhancement/Linux request cancelling a full request on
# the same head. Filter still
# fail-closes stale dispatch context before billed matrix work. Nightly has
# its own group so it cannot cancel a main-push Linux/Windows run (or vice
# versa). Draft synchronize uses a separate group so its fail-closed
# aggregator cannot cancel a ready_for_review matrix (or vice versa).
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && inputs.pr_number && format('label-{0}-{1}', inputs.pr_head_sha, inputs.scope || 'full') || github.event_name == 'workflow_dispatch' && format('manual-{0}', inputs.scope || 'full') || github.event_name == 'merge_group' && 'queue' || (github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft') || 'default' }}
  cancel-in-progress: true

jobs:
  filter:
    name: filter
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-tests: ${{ steps.decide.outputs.run-tests }}
      run-macos: ${{ steps.decide.outputs.run-macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 2
      - name: Validate label dispatch context
        if: github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
          MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          set -euo pipefail
          # Plain manual/API dispatch retains the selected branch and full default.
          if [ -z "$PR_NUMBER$PR_HEAD_SHA$MERGE_SHA" ]; then
            exit 0
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # A branch advance between label event and dispatch must fail closed.
          [ "$GITHUB_SHA" = "$PR_HEAD_SHA" ]
          [ "$(git rev-parse HEAD)" = "$MERGE_SHA" ]
          [ "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA" ]
      - name: Decide whether code gates must run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          emit() {
            echo "run-tests=$1" >> "$GITHUB_OUTPUT"
            echo "run-macos=$2" >> "$GITHUB_OUTPUT"
            echo "run-tests=$1 run-macos=$2"
          }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            emit true true
            echo "workflow_dispatch always runs hosted gates."
            exit 0
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            # Nightly is macOS-only. Do not start Linux/Windows. Skip macOS when
            # main had no commits in the last 24h so idle days do not spend ~$0.93.
            git fetch --deepen=500 || git fetch --unshallow || true
            count="$(git rev-list --count --since='24 hours ago' HEAD || echo "")"
            if [ -z "$count" ]; then
              emit false true
              echo "Could not count recent commits; fail open to nightly macOS."
              exit 0
            fi
            if [ "$count" -gt 0 ]; then
              emit false true
              echo "Nightly macOS: ${count} commit(s) on this ref in the last 24h."
            else
              emit false false
              echo "Nightly macOS skipped: no commits in the last 24h."
            fi
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            BASE="$MG_BASE"
            HEAD="$MG_HEAD"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_HEAD"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            emit true false
            echo "No base SHA; fail open to running tests."
            exit 0
          fi
          if ! git fetch --depth=1 origin "$BASE" || ! git fetch --depth=1 origin "$HEAD"; then
            emit true false
            echo "Could not fetch diff endpoints; fail open to running tests."
            exit 0
          fi
          if ! files="$(git diff --name-only "$BASE" "$HEAD" --)"; then
            emit true false
            echo "Could not diff endpoints; fail open to running tests."
            exit 0
          fi
          if [ -z "$files" ]; then
            emit false false
            echo "No changed files; skip test jobs."
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$files"
          run_tests=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Swarm tests import docs/research/swarm-tools, schemas, and hashed
            # briefs. Any Python/JSON/YAML under docs/ is executable or a fixture,
            # not skippable documentation.
            if printf '%s\n' "$f" | grep -Eq \
              '^docs/research/swarm-tools/|^docs/research/swarm-schemas/|^docs/research/swarm-briefs/|\.py$|\.json$|\.ya?ml$'; then
              run_tests=true
              break
            fi
            if printf '%s\n' "$f" | grep -Eq '^docs/|\.md$|^LICENSE([.].*)?$|^\.gitignore$|^\.gitattributes$|^\.editorconfig$'; then
              continue
            fi
            run_tests=true
            break
          done <<< "$files"
          emit "$run_tests" false

  # GitHub-hosted debounce (consumes runner capacity). Requires corrected CSL-255
  # cross-head PR concurrency (#157) to cancel superseded pushes during this wait.
  # Only non-draft synchronize waits; other events intentionally skip settle.
  # This reduces eligible starts, not a guarantee of lower billed spend.
  settle:
    name: settle
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.draft != true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for a follow-up push to cancel this run
        run: sleep 120

  linux:
    name: linux
    permissions:
      contents: read
    needs: [filter, settle]
    if: >
      always() && !cancelled() &&
      needs.filter.result == 'success' &&
      (
        needs.settle.result == 'success' ||
        (needs.settle.result == 'skipped' &&
          (github.event_name != 'pull_request' || github.event.action != 'synchronize' || github.event.pull_request.draft == true))
      ) &&
      needs.filter.outputs.run-tests == 'true'
    # Optional hosted Linux diagnostic for the two CPython versions DEC-09 covers.
    # fail-fast is off so every requested cell reports. Does not replace the local
    # Ubuntu/WSL2 cells.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - uses: ./.github/actions/run-gates
        with:
          python-version: ${{ matrix.python-version }}
      - name: CI dispatch scope regressions
        run: |
          python -X utf8 -B tools/test_ci_dispatch_scope.py
          python -X utf8 -B tools/test_ci_settle.py

  # Stable required status-check name. Passes when the Linux matrix succeeded, or
  # when filter ran and Linux was skipped because the change is docs-only.
  # This job never skips on pull_request/push/dispatch: a skipped required check
  # is treated as success. Drafts skip filter, so the script fails closed until
  # ready_for_review. Ordinary labels never start this workflow.
  # Configure branch protection / rulesets to require exactly this name: linux-gates
  linux-gates:
    name: linux-gates
    permissions:
      contents: read
    needs: [filter, settle, linux]
    if: always() && !cancelled() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Required Linux gate
        env:
          FILTER_RESULT: ${{ needs.filter.result }}
          SETTLE_RESULT: ${{ needs.settle.result }}
          SETTLE_EXPECTED: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.draft != true }}
          RUN_TESTS: ${{ needs.filter.outputs.run-tests }}
          LINUX_RESULT: ${{ needs.linux.result }}
          RUN_TESTS: ${{ needs.filter.outputs.run-tests }}
        run: |
          set -euo pipefail
          echo "filter=${FILTER_RESULT} linux=${LINUX_RESULT}"
          if [ "$FILTER_RESULT" != "success" ]; then
            echo "filter job did not succeed"
            exit 1
          fi
          if [ "$SETTLE_RESULT" != "success" ]; then
            if [ "$SETTLE_RESULT" != "skipped" ] || [ "$SETTLE_EXPECTED" != "false" ]; then
              echo "settle did not succeed or intentionally skip: ${SETTLE_RESULT}"
              exit 1
            fi
          fi
          if [ "$RUN_TESTS" = "true" ] && [ "$LINUX_RESULT" = "success" ]; then
            exit 0
          fi
          if [ "$RUN_TESTS" = "false" ] && [ "$LINUX_RESULT" = "skipped" ]; then
            echo "Explicit docs-only/no-change skip"
            exit 0
          fi
          echo "linux matrix result=${LINUX_RESULT}"
          exit 1

  # Stable required status on every PR and merge group. Ordinary PRs prove
  # Linux here; queue/main/full requests additionally require both Windows cells.
  queue-gates:
    name: queue-gates
    needs: [filter, linux, windows]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          persist-credentials: false
      - name: Require all mandatory platform cells
        env:
          FILTER_RESULT: ${{ needs.filter.result }}
          REQUIRED: ${{ needs.filter.outputs.run-tests }}
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          WINDOWS_REQUIRED: ${{ github.event_name == 'merge_group' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.scope != 'linux') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
        run: |
          python3 - <<'PY'
          import os
          from tools.required_ci_gate import gate
          env = os.environ
          required = env['REQUIRED']
          windows_required = 'true' if required == 'true' and env['WINDOWS_REQUIRED'] == 'true' else 'false'
          passed = (gate(env['FILTER_RESULT'], required, [env['LINUX_RESULT']])
                    and gate(env['FILTER_RESULT'], windows_required, [env['WINDOWS_RESULT']]))
          raise SystemExit(0 if passed else 'Mandatory platform gate failed closed')
          PY

  windows:
    name: windows
    permissions:
      contents: read
    needs: [filter, settle]
    if: >
      always() && !cancelled() &&
      needs.filter.result == 'success' &&
      (
        needs.settle.result == 'success' ||
        (needs.settle.result == 'skipped' &&
          (github.event_name != 'pull_request' || github.event.action != 'synchronize' || github.event.pull_request.draft == true))
      ) &&
      needs.filter.outputs.run-tests == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.scope != 'linux') ||
        (github.event_name == 'merge_group') ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full'))
      )
    # Hosted Windows supplements, but does not replace, the DEC-09 native-Windows cells.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: blacksmith-2vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - uses: ./.github/actions/run-gates
        with:
          python-version: ${{ matrix.python-version }}

  macos:
    name: macos
    permissions:
      contents: read
    needs: [filter, settle]
    if: >
      always() && !cancelled() &&
      needs.filter.result == 'success' &&
      (
        needs.settle.result == 'success' ||
        (needs.settle.result == 'skipped' &&
          (github.event_name != 'pull_request' || github.event.action != 'synchronize' || github.event.pull_request.draft == true))
      ) &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.scope != 'linux') ||
        (github.event_name == 'schedule' && needs.filter.outputs.run-macos == 'true') ||
        (
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci:full') &&
          needs.filter.outputs.run-tests == 'true'
        )
      )
    # Best-effort portability only. Single 3.12 cell on GitHub-hosted macos-latest
    # (no Blacksmith macOS). Not on ordinary main pushes: ~$0.93/run would dominate
    # the ~$50/month budget. Nightly 07:17 UTC skips when main was idle 24h.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - uses: ./.github/actions/run-gates
        with:
          python-version: "3.12"

  # Informational only. Not a dependency of linux-gates, so a regression
  # warning cannot block merge. A harness crash still fails this job.
  benchmarks:
    name: benchmarks
    permissions:
      contents: read
      issues: write
      pull-requests: write
    needs: [filter, settle]
    if: >
      always() && !cancelled() &&
      needs.filter.result == 'success' &&
      (
        needs.settle.result == 'success' ||
        (needs.settle.result == 'skipped' &&
          (github.event_name != 'pull_request' || github.event.action != 'synchronize' || github.event.pull_request.draft == true))
      ) &&
      github.event_name == 'pull_request' && needs.filter.outputs.run-tests == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _bench_base
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/benchmarks/requirements.txt
      - name: Install benchmark dependencies
        run: python -m pip install -r app/benchmarks/requirements.txt
      - name: Compare hot paths with the base tree
        working-directory: app
        run: |
          python -m benchmarks.compare \
            --baseline-root ../_bench_base \
            --candidate-root .. \
            --threshold 0.10 \
            --rounds 5 \
            --orderings 2 \
            --report ../bench-report.json \
            --summary ../bench-summary.md \
            --comment ../bench-comment.md \
            --clear-comment ../bench-clear.md \
            --leave ../bench-leave.md
      - name: Flag regressions on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- csl-perf-bench -->'
          mapfile -t ids < <(gh api --paginate "repos/${REPO}/issues/${PR}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id")
          existing="${ids[0]:-}"
          existing_file=""
          if [ -n "$existing" ]; then
            gh api "repos/${REPO}/issues/comments/${existing}" --jq .body > bench-existing.md
            existing_file=bench-existing.md
          fi
          body_file="$(EXISTING_FILE="$existing_file" PYTHONPATH=app python -c 'import os, sys; from pathlib import Path; from benchmarks.compare import select_comment_update; existing_path = os.environ.get("EXISTING_FILE") or ""; existing = Path(existing_path).read_text(encoding="utf-8") if existing_path else None; chosen = select_comment_update(existing, Path("bench-comment.md"), Path("bench-leave.md"), Path("bench-clear.md")); sys.stdout.write("" if chosen is None else str(chosen))')"
          if [ -z "$body_file" ]; then
            echo "Leaving the existing performance comment unchanged."
            exit 0
          fi
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" --raw-field body="$(cat "$body_file")"
          else
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" --raw-field body="$(cat "$body_file")"
          fi
