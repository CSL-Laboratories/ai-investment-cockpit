name: ci
run-name: ${{ inputs.candidate_id && format('candidate:{0}:ci:{1}', inputs.candidate_id, inputs.dispatch_nonce) || github.workflow }}

# DEC-09 still owns package acceptance: the local native-Windows + Ubuntu/WSL2 ×
# Python 3.11/3.12 matrix on the operator workstation. Hosted jobs here are merge
# diagnostics, not a substitute for that matrix, and they do not satisfy online,
# broker, witness, paper-day, or pre-live gates. macOS remains best-effort; Hetzner
# is outside the current package.
#
# Hosted split (CSL-408: every job runs on a free GitHub-hosted runner):
#   linux-gates  — required PR check; Linux 3.11+3.12, ruff + pytest
#                  (PR, merge_group, dispatch, and retained main push fallback)
#   windows      — merge_group, workflow_dispatch, or PR label `ci:full`
#                  (main push fallback retained until queue canary is approved)
#   macos        — nightly 07:17 UTC on main (skipped if idle 24h), ci:full, or
#                  workflow_dispatch. GitHub-hosted macos-latest. Not on ordinary
#                  main pushes: ~$0.93/run would dominate a ~$50 budget.
#   qualification — CSL-221 evidence only. Free GitHub-hosted runners
#                  (ubuntu-24.04, windows-2025, macos-latest) for the
#                  provider-free tier. CSL-408: no Blacksmith labels.
#                  Same-repository, non-Dependabot heads only. A fork or
#                  Dependabot pull request does not start it, even with ci:full:
#                  those tokens cannot mint the attestation OIDC credential.
#                  This does not replace DEC-09 and is not a release decision.
#   benchmarks   — pull_request only, and only when filter runs the code gates.
#                  Same-runner median comparison against the PR base SHA. Warns
#                  above 10% after sample spread; does not fail linux-gates.
#                  One ubuntu-24.04 job, aimed at well under a minute. It is a
#                  free GitHub-hosted runner on this public repository
#                  (CSL-408).
#
# Ordinary labeled/unlabeled events do not start this workflow, so they cannot
# post a skipped or successful linux-gates over a real result. `ci:full` and
# `enhancement` re-trigger via ci-label-retrigger.yml (workflow_dispatch); that
# companion has no job named linux-gates. Draft PRs skip the test matrix; the
# linux-gates aggregator still runs and fails closed until ready_for_review.
# Non-test jobs (filter, linux-gates) use ubuntu-latest; the Python linux/windows
# matrix uses ubuntu-24.04 and windows-2025 (CSL-408). None is billed here.
#
# This workflow supersedes the Blacksmith Migration Wizard PR that only swapped
# runner labels (open PR #100, branch blacksmith-migration-33156c9).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    # 07:17 UTC: US night / EU morning, off the hour to miss the cron stampede.
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Hosted platform scope (label retriggers may request Linux only)
        type: choice
        options: [full, linux]
        default: full
        required: false
      pr_number:
        description: PR identity for label retriggers (omit for manual branch runs)
        type: string
        default: ""
      pr_head_sha:
        description: Expected PR head for a label retrigger
        type: string
        default: ""
      merge_sha:
        description: Immutable PR merge candidate for a label retrigger
        type: string
        default: ""
      pr_base_sha:
        description: Exact approved candidate base (candidate dispatch only)
        type: string
        default: ""
      merge_tree_sha:
        description: Exact approved candidate merge tree (candidate dispatch only)
        type: string
        default: ""
      dispatch_nonce:
        description: Coordinator delivery nonce (32 hexadecimal characters)
        type: string
        default: ""
      candidate_id:
        description: Verified candidate identity digest (requires full scope)
        type: string
        default: ""

# Manual/API dispatch defaults to full; enhancement-only label reruns request
# scope=linux without changing Linux gates or ordinary PR platform selection.
permissions:
  contents: read

# Ordinary PR heads share one group, but arrival order cannot cancel a newer
# head: queue up to 100 pending runs and let the default-branch companion cancel
# only verified strict ancestors of the live head. Until that policy lands on
# main, old work may finish before the current run; no status is fabricated.
# Label dispatches retain expected-head/scope identity; manual scopes, nightly,
# drafts and queue runs stay isolated and keep their existing non-PR policy.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}-${{ (inputs.candidate_id != '' || inputs.pr_base_sha != '' || inputs.merge_tree_sha != '' || inputs.dispatch_nonce != '') && format('candidate-{0}', inputs.candidate_id || github.run_id) || github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && inputs.pr_number && format('label-{0}-{1}', inputs.pr_head_sha, inputs.scope || 'full') || github.event_name == 'workflow_dispatch' && format('manual-{0}', inputs.scope || 'full') || github.event_name == 'merge_group' && 'queue' || (github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft') || 'default' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' && inputs.candidate_id == '' && inputs.pr_base_sha == '' && inputs.merge_tree_sha == '' && inputs.dispatch_nonce == '' }}
  queue: ${{ (github.event_name == 'pull_request' || inputs.candidate_id != '' || inputs.pr_base_sha != '' || inputs.merge_tree_sha != '' || inputs.dispatch_nonce != '') && 'max' || 'single' }}

jobs:
  filter:
    name: filter
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-tests: ${{ steps.decide.outputs.run-tests }}
      run-macos: ${{ steps.decide.outputs.run-macos }}
    steps:
      # Candidate dispatches arrive on the default branch, so github.sha is the
      # trusted policy commit, not the candidate head. Check out that exact
      # commit first and stage its validator outside the workspace before any
      # candidate file exists on this runner. Ordinary events skip this step.
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_id != '' || inputs.pr_base_sha != '' || inputs.merge_tree_sha != '' || inputs.dispatch_nonce != '')
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      # Candidate validation needs an interpreter before any candidate-controlled
      # dependency install. Windows runner images expose `python`, not a reliable
      # `python3`, so every validating cell installs its pinned CPython first via
      # the trusted action (no pip cache, so no cache key is derived from candidate
      # files) and validation invokes `python` on all three platforms.
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_id != '' || inputs.pr_base_sha != '' || inputs.merge_tree_sha != '' || inputs.dispatch_nonce != '')
        with:
          python-version: "3.12"
      - name: Stage trusted candidate validator
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_id != '' || inputs.pr_base_sha != '' || inputs.merge_tree_sha != '' || inputs.dispatch_nonce != '')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          # Policy witness: checked-out commit, github.sha and workflow_sha agree.
          head="$(git rev-parse HEAD)"
          [ "$head" = "$GITHUB_SHA" ]
          [ "$head" = "$GITHUB_WORKFLOW_SHA" ]
          [ -n "$DEFAULT_BRANCH" ]
          [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]
          [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]
          helper=scripts/ci/merge_candidate.py
          if [ -L "$helper" ] || [ ! -f "$helper" ]; then
            echo "::error::Trusted candidate validator is absent from policy commit ${head}; the candidate copy is never substituted."
            exit 1
          fi
          stage="${RUNNER_TEMP}/codex-policy"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp "$helper" "$stage/merge_candidate.py"
          # Stage every control file this trusted YAML executes after the
          # candidate checkout (local action, installer, pins, aggregate helper,
          # workflows). Validation refuses candidate copies that differ.
          python -I -X utf8 -B "$stage/merge_candidate.py" stage-policy "$stage"
          [ -f "$stage/manifest.json" ]
          {
            echo "CODEX_POLICY_SHA=$head"
            echo "CODEX_POLICY_BRANCH=$DEFAULT_BRANCH"
            echo "CODEX_POLICY_VALIDATOR=$stage/merge_candidate.py"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 2
      - name: Validate exact full candidate
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_id != '' || inputs.pr_base_sha != '' || inputs.merge_tree_sha != '' || inputs.dispatch_nonce != '')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
          PR_BASE_SHA: ${{ inputs.pr_base_sha }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          MERGE_TREE_SHA: ${{ inputs.merge_tree_sha }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          CANDIDATE_SCOPE: ${{ inputs.scope }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$CANDIDATE_SCOPE" = "full" ]
          # The staged policy validator, never scripts/ci/merge_candidate.py from
          # the candidate workspace; -I keeps candidate paths off sys.path.
          [ -n "${CODEX_POLICY_SHA:-}" ]
          [ -n "${CODEX_POLICY_VALIDATOR:-}" ]
          [ "$GITHUB_SHA" = "$CODEX_POLICY_SHA" ]
          [ "$GITHUB_WORKFLOW_SHA" = "$CODEX_POLICY_SHA" ]
          [ ! -L "$CODEX_POLICY_VALIDATOR" ]
          [ -f "$CODEX_POLICY_VALIDATOR" ]
          [ -f "${CODEX_POLICY_VALIDATOR%/*}/manifest.json" ]
          python -I -X utf8 -B "$CODEX_POLICY_VALIDATOR" validate-dispatch
      # Skipped only for a complete candidate tuple, whose independent validator
      # above fails closed on partial or invalid inputs. Partial tuples run both.
      - name: Validate label dispatch context
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_id == '' || inputs.pr_base_sha == '' || inputs.merge_tree_sha == '' || inputs.dispatch_nonce == '')
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
          MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          set -euo pipefail
          # Plain manual/API dispatch retains the selected branch and full default.
          if [ -z "$PR_NUMBER$PR_HEAD_SHA$MERGE_SHA" ]; then
            exit 0
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # A branch advance between label event and dispatch must fail closed.
          [ "$GITHUB_SHA" = "$PR_HEAD_SHA" ]
          [ "$(git rev-parse HEAD)" = "$MERGE_SHA" ]
          [ "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA" ]
      - name: Decide whether code gates must run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          emit() {
            echo "run-tests=$1" >> "$GITHUB_OUTPUT"
            echo "run-macos=$2" >> "$GITHUB_OUTPUT"
            echo "run-tests=$1 run-macos=$2"
          }
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            emit true true
            echo "workflow_dispatch always runs hosted gates."
            exit 0
          fi
          if [ "$EVENT_NAME" = "schedule" ]; then
            # Nightly is macOS-only. Do not start Linux/Windows. Skip macOS when
            # main had no commits in the last 24h so idle days do not spend ~$0.93.
            git fetch --deepen=500 || git fetch --unshallow || true
            count="$(git rev-list --count --since='24 hours ago' HEAD || echo "")"
            if [ -z "$count" ]; then
              emit false true
              echo "Could not count recent commits; fail open to nightly macOS."
              exit 0
            fi
            if [ "$count" -gt 0 ]; then
              emit false true
              echo "Nightly macOS: ${count} commit(s) on this ref in the last 24h."
            else
              emit false false
              echo "Nightly macOS skipped: no commits in the last 24h."
            fi
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            BASE="$MG_BASE"
            HEAD="$MG_HEAD"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_HEAD"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            emit true false
            echo "No base SHA; fail open to running tests."
            exit 0
          fi
          if ! git fetch --depth=1 origin "$BASE" || ! git fetch --depth=1 origin "$HEAD"; then
            emit true false
            echo "Could not fetch diff endpoints; fail open to running tests."
            exit 0
          fi
          # --no-renames lists both sides of a rename, so renaming a test-read file
          # out of a run-tests path still runs tests (CSL-397).
          if ! files="$(git diff --no-renames --name-only "$BASE" "$HEAD" --)"; then
            emit true false
            echo "Could not diff endpoints; fail open to running tests."
            exit 0
          fi
          if [ -z "$files" ]; then
            emit false false
            echo "No changed files; skip test jobs."
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$files"
          run_tests=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Swarm tests import docs/research/swarm-tools, schemas, and hashed
            # briefs. Any Python/JSON/YAML under docs/ is executable or a fixture,
            # not skippable documentation. CSL-397: everything under app/ (the
            # LLM prompts are app/workflows/prompts/*.md), the docs that tests
            # read, and .gitignore always run tests (audit CSL-392);
            # tools/test_ci_docs_filter.py keeps this list in step with the tests.
            if printf '%s\n' "$f" | grep -Eq \
              '^docs/research/swarm-tools/|^docs/research/swarm-schemas/|^docs/research/swarm-briefs/|\.py$|\.json$|\.ya?ml$'; then
              run_tests=true
              break
            fi
            if printf '%s\n' "$f" | grep -Eq \
              '^app/|^docs/replacement/|^docs/evidence/|^docs/setup/|^docs/PLAN\.md$|^CLAUDE\.md$|^AGENTS\.md$|^\.claude/skills/proceed-or-escalate/SKILL\.md$|^docs/research/gate-feasibility-|^\.gitignore$'; then
              run_tests=true
              break
            fi
            if printf '%s\n' "$f" | grep -Eq '^docs/|\.md$|^LICENSE([.].*)?$|^\.gitattributes$|^\.editorconfig$'; then
              continue
            fi
            run_tests=true
            break
          done <<< "$files"
          emit "$run_tests" false

  # GitHub-hosted debounce (consumes runner capacity). Requires corrected CSL-255
  # cross-head PR concurrency (#157) to cancel superseded pushes during this wait.
  # Only non-draft synchronize waits; other events intentionally skip settle.
  # This reduces eligible starts, not a guarantee of lower billed spend.
  settle:
    name: settle
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.draft != true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for a follow-up push to cancel this run
        run: sleep 120

  linux:
    name: linux
    permissions:
      contents: read
    needs: [filter, settle]
    if: >
      always() && !cancelled() &&
      needs.filter.result == 'success' &&
      (
        needs.settle.result == 'success' ||
        (needs.settle.result == 'skipped' &&
          (github.event_name != 'pull_request' || github.event.action != 'synchronize' || github.event.pull_request.draft == true))
      ) &&
      needs.filter.outputs.run-tests == 'true'
    # Optional hosted Linux diagnostic for the two CPython versions DEC-09 covers.
    # fail-fast is off so every requested cell reports. Does not replace the local
    # Ubuntu/WSL2 cells.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-24.04
    # Main requires the release extension build and batch parity in this cell.
    timeout-minutes: 30
    steps:
      # Trusted policy commit first (github.sha on the default-branch dispatch),
      # validator staged outside the workspace, then the exact candidate merge.
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_id != '' || inputs.pr_base_sha != '' || inputs.merge_tree_sha != '' || inputs.dispatch_nonce != '')
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      # Same cell interpreter as run-gates, installed before candidate validation.
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_id != '' || inputs.pr_base_sha != '' || inputs.merge_tree_sha != '' || inputs.dispatch_nonce != '')
        with:
          python-version: ${{ matrix.python-version }}
      - name: Stage trusted candidate validator
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_id != '' || inputs.pr_base_sha != '' || inputs.merge_tree_sha != '' || inputs.dispatch_nonce != '')
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          # Policy witness: checked-out commit, github.sha and workflow_sha agree.
          head="$(git rev-parse HEAD)"
          [ "$head" = "$GITHUB_SHA" ]
          [ "$head" = "$GITHUB_WORKFLOW_SHA" ]
          [ -n "$DEFAULT_BRANCH" ]
          [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]
          [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]
          helper=scripts/ci/merge_candidate.py
          if [ -L "$helper" ] || [ ! -f "$helper" ]; then
            echo "::error::Trusted candidate validator is absent from policy commit ${head}; the candidate copy is never substituted."
            exit 1
          fi
          stage="${RUNNER_TEMP}/codex-policy"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp "$helper" "$stage/merge_candidate.py"
          # Stage every control file this trusted YAML executes after the
          # candidate checkout (local action, installer, pins, aggregate helper,
          # workflows). Validation refuses candidate copies that differ.
          python -I -X utf8 -B "$stage/merge_candidate.py" stage-policy "$stage"
          [ -f "$stage/manifest.json" ]
          {
            echo "CODEX_POLICY_SHA=$head"
            echo "CODEX_POLICY_BRANCH=$DEFAULT_BRANCH"
            echo "CODEX_POLICY_VALIDATOR=$stage/merge_candidate.py"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate exact full candidate
        if: github.event_name == 'workflow_dispatch' && (inputs.candidate_id != '' || inputs.pr_base_sha != '' || inputs.merge_tree_sha != '' || inputs.dispatch_nonce != '')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
          PR_BASE_SHA: ${{ inputs.pr_base_sha }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          MERGE_TREE_SHA: ${{ inputs.merge_tree_sha }}
          CANDIDATE_ID: ${{ inputs.candidate_id }}
          DISPATCH_NONCE: ${{ inputs.dispatch_nonce }}
          CANDIDATE_SCOPE: ${{ inputs.scope }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$CANDIDATE_SCOPE" = "full" ]
          # The staged policy validator, never scripts/ci/merge_candidate.py from
          # the candidate workspace; -I keeps candidate paths off sys.path.
          [ -n "${CODEX_POLICY_SHA:-}" ]
          [ -n "${CODEX_POLICY_VALIDATOR:-}" ]
          [ "$GITHUB_SHA" = "$CODEX_POLICY_SHA" ]
          [ "$GITHUB_WORKFLOW_SHA" = "$CODEX_POLICY_SHA" ]
          [ ! -L "$CODEX_POLICY_VALIDATOR" ]
          [ -f "$CODEX_POLICY_VALIDATOR" ]
          [ -f "${CODEX_POLICY_VALIDATOR%/*}/manifest.json" ]
          python -I -X utf8 -B "$CODEX_POLICY_VALIDATOR" validate-dispatch
      - uses: ./.github/actions/run-gates
        with:
          python-version: ${{ matrix.python-version }}
      - name: CI dispatch scope regressions
        run: |
          python -X utf8 -B tools/test_ci_dispatch_scope.py
          python -X utf8 -B tools/test_ci_settle.py
          python -X utf8 -B -m unittest tools.test_review_gate tools.test_queue_gates
          python -X utf8 -B tools/test_ci_cancel_controller.py
          python -X utf8 -B tools/test_candidate_workflows.py
          python -X utf8 -B tools/test_ci_docs_filter.py
      # CSL-166: the required linux gate runs pytest before any wheel exists, so
      # test_book_batch.py's skipif dropped the whole file. Build the extension
      # here and run that file. This is the existing linux job, not a new
      # workflow, and it does not add Windows or macOS cells.
      - name: Install the Rust toolchain for batch parity
        if: hashFiles('rust/cockpit-py/Cargo.toml') != ''
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: "1.83.0"
      - name: Install maturin for batch parity
        if: hashFiles('rust/cockpit-py/Cargo.toml') != ''
        working-directory: ${{ runner.temp }}
        run: python -P -m pip install -U maturin
      - name: Batch parity against the Rust extension
        if: hashFiles('rust/cockpit-py/Cargo.toml') != ''
        run: |
          set -euo pipefail
          python -P -m maturin build --release --manifest-path rust/cockpit-py/Cargo.toml
          python -P -c "import glob, os, subprocess, sys; root = os.environ['GITHUB_WORKSPACE']; wheels = glob.glob(os.path.join(root, 'rust', 'target', 'wheels', 'cockpit_quant-*.whl')); assert wheels, 'no wheel built'; subprocess.check_call([sys.executable, '-P', '-m', 'pip', 'install', '--force-reinstall', *wheels], cwd=os.environ['RUNNER_TEMP'])"
          cd app
          python -P -m pytest -q tests/quant/book/test_book_batch.py -ra | tee "$RUNNER_TEMP/batch-parity.txt"
          if grep -q 'skipped' "$RUNNER_TEMP/batch-parity.txt"; then
            echo "batch parity skipped; cockpit_quant did not load"
            exit 1
          fi

  # Stable required status-check name. Passes when the Linux matrix succeeded, or
  # when filter ran and Linux was skipped because the change is docs-only.
  # This job never skips on pull_request/push/dispatch: a skipped required check
  # is treated as success. Drafts skip filter, so the script fails closed until
  # ready_for_review. Ordinary labels never start this workflow.
  # Configure branch protection / rulesets to require exactly this name: linux-gates
  linux-gates:
    name: linux-gates
    permissions:
      contents: read
    needs: [filter, settle, linux]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Required Linux gate
        env:
          FILTER_RESULT: ${{ needs.filter.result }}
          SETTLE_RESULT: ${{ needs.settle.result }}
          SETTLE_EXPECTED: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.draft != true }}
          RUN_TESTS: ${{ needs.filter.outputs.run-tests }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          set -euo pipefail
          echo "filter=${FILTER_RESULT} linux=${LINUX_RESULT}"
          if [ "$FILTER_RESULT" != "success" ]; then
            echo "filter job did not succeed"
            exit 1
          fi
          if [ "$SETTLE_RESULT" != "success" ]; then
            if [ "$SETTLE_RESULT" != "skipped" ] || [ "$SETTLE_EXPECTED" != "false" ]; then
              echo "settle did not succeed or intentionally skip: ${SETTLE_RESULT}"
              exit 1
            fi
          fi
          if [ "$RUN_TESTS" = "true" ] && [ "$LINUX_RESULT" = "success" ]; then
            exit 0
          fi
          if [ "$RUN_TESTS" = "false" ] && [ "$LINUX_RESULT" = "skipped" ]; then
            echo "Explicit docs-only/no-change skip"
            exit 0
          fi
          echo "linux matrix result=${LINUX_RESULT}"
          exit 1
      - name: Reject workflow cancellation
        if: cancelled()
        run: exit 1

  # Stable required status on every PR and merge group. Ordinary PRs prove
  # Linux here; queue/main/full requests additionally require both Windows cells.
  queue-gates:
    name: queue-gates
    needs: [filter, settle, linux, windows]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          persist-credentials: false
      - name: Require all mandatory platform cells
        env:
          FILTER_RESULT: ${{ needs.filter.result }}
          REQUIRED: ${{ needs.filter.outputs.run-tests }}
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          SETTLE_RESULT: ${{ needs.settle.result }}
          SETTLE_EXPECTED: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.draft != true }}
          WINDOWS_REQUIRED: ${{ github.event_name == 'merge_group' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.scope != 'linux') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
        run: |
          python3 - <<'PY'
          import os
          from tools.required_ci_gate import gate, settled
          env = os.environ
          required = env['REQUIRED']
          windows_required = 'true' if required == 'true' and env['WINDOWS_REQUIRED'] == 'true' else 'false'
          passed = (settled(env['SETTLE_RESULT'], env['SETTLE_EXPECTED'])
                    and gate(env['FILTER_RESULT'], required, [env['LINUX_RESULT']])
                    and gate(env['FILTER_RESULT'], windows_required, [env['WINDOWS_RESULT']]))
          raise SystemExit(0 if passed else 'Mandatory platform gate failed closed')
          PY
      - name: Reject workflow cancellation
        if: cancelled()
        run: exit 1

  # Candidate qualification additionally requires macOS and forbids docs noops.
  # This staged check does not change the repository's protection settings.
  candidate-ci-gates:
    name: candidate-ci-gates
    needs: [filter, settle, linux, windows, macos]
    if: always() && github.event_name == 'workflow_dispatch' && (inputs.candidate_id != '' || inputs.pr_base_sha != '' || inputs.merge_tree_sha != '' || inputs.dispatch_nonce != '')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require complete candidate platform execution
        env:
          FILTER_RESULT: ${{ needs.filter.result }}
          SETTLE_RESULT: ${{ needs.settle.result }}
          RUN_TESTS: ${{ needs.filter.outputs.run-tests }}
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          CANDIDATE_SCOPE: ${{ inputs.scope }}
        run: |
          set -euo pipefail
          [ "$CANDIDATE_SCOPE" = "full" ]
          [ "$FILTER_RESULT" = "success" ]
          [ "$SETTLE_RESULT" = "skipped" ]
          [ "$RUN_TESTS" = "true" ]
          [ "$LINUX_RESULT" = "success" ]
          [ "$WINDOWS_RESULT" = "success" ]
          [ "$MACOS_RESULT" = "success" ]
      - name: Reject workflow cancellation
        if: cancelled()
        run: exit 1

  windows:
    name: windows
    permissions:
      contents: read
    needs: [filter, settle]
    if: >
      always() && !cancelled() &&
      needs.filter.result == 'success' &&
      (
        needs.settle.result == 'success' ||
        (needs.settle.result == 'skipped' &&
          (github.event_name != 'pull_request' || github.event.action != 'synchronize' || github.event.pull_request.draft == true))
