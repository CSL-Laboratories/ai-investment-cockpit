          [ -n "${CODEX_POLICY_SHA:-}" ]
          [ -n "${CODEX_POLICY_VALIDATOR:-}" ]
          [ "$GITHUB_SHA" = "$CODEX_POLICY_SHA" ]
          [ "$GITHUB_WORKFLOW_SHA" = "$CODEX_POLICY_SHA" ]
          [ ! -L "$CODEX_POLICY_VALIDATOR" ]
          [ -f "$CODEX_POLICY_VALIDATOR" ]
          [ -f "${CODEX_POLICY_VALIDATOR%/*}/manifest.json" ]
          python -I -X utf8 -B "$CODEX_POLICY_VALIDATOR" validate-dispatch
      - uses: ./.github/actions/run-gates
        with:
          python-version: "3.12"

  # Informational only. Not a dependency of linux-gates, so a regression
  # warning cannot block merge. A harness crash still fails this job.
  benchmarks:
    name: benchmarks
    permissions:
      contents: read
      issues: write
      pull-requests: write
    needs: [filter, settle]
    if: >
      always() && !cancelled() &&
      needs.filter.result == 'success' &&
      (
        needs.settle.result == 'success' ||
        (needs.settle.result == 'skipped' &&
          (github.event_name != 'pull_request' || github.event.action != 'synchronize' || github.event.pull_request.draft == true))
      ) &&
      github.event_name == 'pull_request' && needs.filter.outputs.run-tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _bench_base
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install benchmark dependencies
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          req="${RUNNER_TEMP}/bench-requirements.txt"
          # CSL-471 / REVIEW-D7 I5: the PR checkout must not choose packages.
          cp "${GITHUB_WORKSPACE}/_bench_base/app/benchmarks/requirements.txt" "$req"
          python -P -m pip install -r "$req"
      - name: Compare hot paths with the base tree
        working-directory: app
        run: |
          python -m benchmarks.compare \
            --baseline-root ../_bench_base \
            --candidate-root .. \
            --threshold 0.10 \
            --rounds 5 \
            --orderings 2 \
            --report ../bench-report.json \
            --summary ../bench-summary.md \
            --comment ../bench-comment.md \
            --clear-comment ../bench-clear.md \
            --leave ../bench-leave.md
      - name: Flag regressions on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          marker='<!-- csl-perf-bench -->'
          mapfile -t ids < <(gh api --paginate "repos/${REPO}/issues/${PR}/comments" --jq ".[] | select(.body | contains(\"${marker}\")) | .id")
          existing="${ids[0]:-}"
          existing_file=""
          if [ -n "$existing" ]; then
            gh api "repos/${REPO}/issues/comments/${existing}" --jq .body > bench-existing.md
            existing_file=bench-existing.md
          fi
          body_file="$(EXISTING_FILE="$existing_file" PYTHONPATH=app python -c 'import os, sys; from pathlib import Path; from benchmarks.compare import select_comment_update; existing_path = os.environ.get("EXISTING_FILE") or ""; existing = Path(existing_path).read_text(encoding="utf-8") if existing_path else None; chosen = select_comment_update(existing, Path("bench-comment.md"), Path("bench-leave.md"), Path("bench-clear.md")); sys.stdout.write("" if chosen is None else str(chosen))')"
          if [ -z "$body_file" ]; then
            echo "Leaving the existing performance comment unchanged."
            exit 0
          fi
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${existing}" --raw-field body="$(cat "$body_file")"
          else
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" --raw-field body="$(cat "$body_file")"
          fi

  # CSL-221 provider-free evidence. Not a DEC-09 cell, not linux-gates, and not
  # a release decision. Checkout is the PR head, because pull_request GITHUB_SHA
  # is the merge commit. The six-cell matrix runs only when Linux, Windows, and
  # macOS are all authorized and the head can be attested: a same-repository
  # pull request with ci:full whose author and actor are not Dependabot, or a
  # full dispatch of a ref in this repository. Fork pull requests and Dependabot
  # pull requests do not start it, including when they carry ci:full. A ci:full
  # label dispatch is workflow_dispatch and has no pull_request payload, so
  # admission reads the current PR before any paid cell. Fork and Dependabot
  # workflows do not receive id-token: write, so attestation cannot succeed and
  # the bundle upload would never run. Ordinary PRs, scope=linux, the nightly
  # schedule, and an ordinary push to main do not start it. A partial matrix
  # is not a pass. Artifact names include the run attempt so a rerun does not
  # collide, and a partial rerun cannot mix attempts.
  # Admission is free on this public repository and has no checkout. It rejects
  # unsupported attestation contexts before any of the six cells are allocated.
  # It stays off filter so a lookup failure cannot suppress ordinary CI.
  qualification-admission:
    name: qualification-admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    needs: filter
    if: >
      needs.filter.outputs.run-tests == 'true' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.scope != 'linux') ||
        (
          github.event_name == 'pull_request' &&
          contains(github.event.pull_request.labels.*.name, 'ci:full') &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        )
      )
    outputs:
      eligible: ${{ steps.admit.outputs.eligible }}
    steps:
      - name: Verify attested qualification source
        id: admit
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
          MERGE_SHA: ${{ inputs.merge_sha }}
          # Job permissions do not export a token. Label dispatch is
          # workflow_dispatch and looks the PR up with gh; without this,
          # gh exits 4 and admission fail-closes before the paid cells.
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys

          def emit(eligible):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                  handle.write("eligible=true\n" if eligible else "eligible=false\n")

          def fail(reason):
              emit(False)
              print(
                  f"Qualification not admitted: {reason}. No qualification PASS.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          actor = os.environ.get("ACTOR", "")
          repository = os.environ.get("REPOSITORY", "")
          event = os.environ.get("EVENT_NAME", "")
          sha = os.environ.get("GITHUB_SHA", "")
          if actor == "dependabot[bot]":
              fail("Dependabot actor cannot publish attested qualification")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository):
              fail("invalid repository identity")

          def same_repo_author(head_repo, base_repo, login):
              if (
                  not head_repo
                  or head_repo != repository
                  or base_repo != repository
                  or not login
                  or login == "dependabot[bot]"
              ):
                  fail("same-repository, non-Dependabot PR required")

          if event == "workflow_dispatch":
              number = os.environ.get("PR_NUMBER", "")
              head = os.environ.get("PR_HEAD_SHA", "")
              merge = os.environ.get("MERGE_SHA", "")
              if number == "" and head == "" and merge == "":
                  emit(True)
                  raise SystemExit(0)
              if (
                  not re.fullmatch(r"[1-9][0-9]*", number)
                  or not re.fullmatch(r"[0-9a-f]{40}", head)
                  or not re.fullmatch(r"[0-9a-f]{40}", merge)
                  or sha != head
              ):
                  fail("invalid or stale dispatch identity")
              proc = subprocess.run(
                  ["gh", "api", f"repos/{repository}/pulls/{number}"],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              if proc.returncode != 0 or not proc.stdout.strip():
                  fail("PR lookup failed")
              try:
                  pr = json.loads(proc.stdout)
              except json.JSONDecodeError:
                  fail("PR lookup failed")
              head_body = pr.get("head") or {}
              base_body = pr.get("base") or {}
              if (
                  pr.get("number") != int(number)
                  or head_body.get("sha") != head
                  or pr.get("state") != "open"
                  or pr.get("draft") is not False
              ):
                  fail("PR dispatch no longer identifies an open ready head")
              same_repo_author(
                  (head_body.get("repo") or {}).get("full_name") or "",
                  (base_body.get("repo") or {}).get("full_name") or "",
                  (pr.get("user") or {}).get("login") or "",
              )
              emit(True)
              raise SystemExit(0)

          if event != "pull_request":
              fail("unsupported qualification event")
          same_repo_author(
              os.environ.get("HEAD_REPO", ""),
              os.environ.get("BASE_REPO", ""),
              os.environ.get("PR_AUTHOR", ""),
          )
          emit(True)
          PY
  qualification:
    name: qualification (${{ matrix.platform }}, ${{ matrix.python-version }})
    # actions: read lists this attempt's jobs. actions: write is the
    # cancel-a-run scope and is not granted. upload-artifact@v4 uses the
    # job ACTIONS_RUNTIME_TOKEN, not that write scope.
    permissions:
      contents: read
      actions: read
    needs: qualification-admission
    # The pull-request arm repeats the head-repo and Dependabot gate so a
    # fork or Dependabot pull_request cannot run the matrix even if admission
    # reported eligible. workflow_dispatch has no pull_request payload;
    # admission's PR lookup is what blocks a ci:full label on Dependabot.
    if: >
      needs.qualification-admission.outputs.eligible == 'true' &&
      (
        github.event_name != 'pull_request' ||
        (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        )
      )
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, macos]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.platform == 'linux' && 'ubuntu-24.04' || matrix.platform == 'windows' && 'windows-2025' || 'macos-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      QUAL_REF: ${{ github.event.pull_request.head.sha || inputs.pr_head_sha || github.sha }}
      QUAL_JOB_NAME: qualification (${{ matrix.platform }}, ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.pr_head_sha || github.sha }}
          fetch-depth: 1
      - name: Bind the candidate commit and tree
        id: identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$QUAL_REF" ]; then
            echo "checked out $actual, requested $QUAL_REF"
            exit 1
          fi
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "commit=$actual" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Pin a short TMP (Windows MAX_PATH)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\t | Out-Null
          "TMP=C:\t" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TEMP=C:\t" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Resolve the numeric job id
        id: job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          token = os.environ["GH_TOKEN"]
          runner = os.environ["RUNNER_NAME"]
          expected = os.environ["QUAL_JOB_NAME"]
          url = (
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
              f"/attempts/{attempt}/jobs?per_page=100"
          )
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          job_id = ""
          payload = {}
          for _ in range(15):
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              jobs = payload.get("jobs", [])
              named = [job for job in jobs if job.get("name") == expected]
              hosted = [
                  job for job in jobs
                  if job.get("runner_name") and job.get("runner_name") == runner
              ]
              chosen = named[0] if named else (hosted[0] if hosted else None)
              if chosen is not None and str(chosen.get("id", "")).isdigit():
                  job_id = str(chosen["id"])
                  break
              time.sleep(2)
          if not job_id.isdigit():
              names = [
                  f"{job.get('name')} runner={job.get('runner_name')}"
                  for job in payload.get("jobs", [])
              ]
              raise SystemExit("numeric job id is not visible: " + " | ".join(names))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"id={job_id}\n")
          PY
      - name: Provider-free qualification suite
        run: |
          set -euo pipefail
          python -m pip install pytest
          mkdir -p qualification-output
          python - <<'PY'
          import os, platform, sys
          for name in ("ImageOS", "ImageVersion", "RUNNER_OS", "RUNNER_ARCH", "RUNNER_NAME"):
              print(f"observed {name}={os.environ.get(name, '')}")
          print("observed platform=" + platform.platform())
          print("observed python=" + sys.version.replace("\n", " "))
          PY
          python -m pip freeze --all > qualification-output/pip-freeze.txt
          python -X utf8 -B tools/qualification_evidence.py negative-controls \
            --matrix docs/evidence/csl221/qualification-matrix.json
          python -m pytest -q tools/test_qualification_evidence.py \
            --junitxml=qualification-output/junit.xml -p no:cacheprovider
          python -X utf8 -B tools/qualification_evidence.py emit-cell \
            --matrix docs/evidence/csl221/qualification-matrix.json \
            --platform "${{ matrix.platform }}" \
            --python "${{ matrix.python-version }}" \
            --commit "${{ steps.identity.outputs.commit }}" \
            --tree "${{ steps.identity.outputs.tree }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --job-id "${{ steps.job.outputs.id }}" \
            --junit qualification-output/junit.xml \
            --dependencies-raw qualification-output/pip-freeze.txt \
            --output qualification-cell
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-provider-free-${{ matrix.platform }}-${{ matrix.python-version }}-attempt-${{ github.run_attempt }}
          path: qualification-cell
          if-no-files-found: error
          retention-days: 90

  qualification-negative-controls:
    name: qualification-negative-controls
    permissions:
      contents: read
    needs: filter
    if: needs.filter.outputs.run-tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.pr_head_sha || github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject wrong SHA, wrong tree, skipped cell, missing JUnit, and missing cell
        run: |
          set -euo pipefail
          python -X utf8 -B tools/qualification_evidence.py negative-controls \
            --matrix docs/evidence/csl221/qualification-matrix.json

  qualification-validate:
    name: qualification-validate
    # Least privilege for this job: read the repo, list this attempt's
    # jobs, and mint the attestation. actions: write (cancel a run) is
    # not granted. Download uses ACTIONS_RUNTIME_TOKEN. Attestation
    # permissions are the documented set for
    # actions/attest-build-provenance@v3.
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    needs: qualification
    # A full run whose matrix is missing, failed, cancelled, or skipped
    # must reach this job and fail. always() is required because a
    # non-success needed job is skipped under the default success()
    # check, and cancelled() is true for a cancelled run, which would
    # skip this job again. Ordinary runs leave qualification skipped,
    # and this job stays skipped with it.
    if: ${{ always() && needs.qualification.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      QUAL_REF: ${{ github.event.pull_request.head.sha || inputs.pr_head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.pr_head_sha || github.sha }}
          fetch-depth: 1
      - name: Bind the candidate commit and tree
        id: identity
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$QUAL_REF" ]; then
            echo "checked out $actual, requested $QUAL_REF"
            exit 1
          fi
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "commit=$actual" >> "$GITHUB_OUTPUT"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail unless every provider-free cell concluded success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          token = os.environ["GH_TOKEN"]
          url = (
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"
              f"/attempts/{attempt}/jobs?per_page=100"
          )
          request = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          jobs = payload.get("jobs", [])
          if payload.get("total_count", len(jobs)) > len(jobs):
              raise SystemExit("job list was truncated")
          with open("qualification-jobs.json", "w", encoding="utf-8") as handle:
              json.dump({"jobs": jobs}, handle)
          PY
          python -X utf8 -B tools/qualification_evidence.py require-matrix \
            --matrix docs/evidence/csl221/qualification-matrix.json \
            --jobs qualification-jobs.json
      - uses: actions/download-artifact@v4
        with:
          pattern: qualification-provider-free-*-attempt-${{ github.run_attempt }}
          path: qualification-artifacts
      - name: Assemble, validate, and prove the negative controls on this bundle
        env:
          COMMIT: ${{ steps.identity.outputs.commit }}
          TREE: ${{ steps.identity.outputs.tree }}
        run: |
          set -euo pipefail
          mkdir -p qualification-evidence-bundle
          python -X utf8 -B tools/qualification_evidence.py assemble \
            --artifact-root qualification-artifacts \
            --expected-commit "$COMMIT" \
            --expected-tree "$TREE" \
            --output qualification-evidence-bundle/bundle.json
          python -X utf8 -B tools/qualification_evidence.py validate \
            --matrix docs/evidence/csl221/qualification-matrix.json \
            --bundle qualification-evidence-bundle/bundle.json \
            --artifact-root qualification-artifacts \
            --expected-commit "$COMMIT" \
            --expected-tree "$TREE"
          python -X utf8 -B tools/qualification_evidence.py negative-controls \
            --matrix docs/evidence/csl221/qualification-matrix.json \
            --bundle qualification-evidence-bundle/bundle.json \
            --artifact-root qualification-artifacts \
            --expected-commit "$COMMIT" \
            --expected-tree "$TREE"
          python -X utf8 -B tools/qualification_evidence.py manifest \
            --bundle qualification-evidence-bundle/bundle.json \
            --output qualification-evidence-bundle/manifest.json
      - name: Attest the qualification evidence bundle
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: "qualification-evidence-bundle/*.json"
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-evidence-bundle-attempt-${{ github.run_attempt }}
          path: qualification-evidence-bundle
          if-no-files-found: error
          retention-days: 90
