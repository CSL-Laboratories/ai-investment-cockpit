name: ci

# DEC-09 still owns package acceptance: the local native-Windows + Ubuntu/WSL2 ×
# Python 3.11/3.12 matrix on the operator workstation. Hosted jobs here are merge
# diagnostics, not a substitute for that matrix, and they do not satisfy online,
# broker, witness, paper-day, or pre-live gates. macOS remains best-effort; Hetzner
# is outside the current package.
#
# Hosted split (cost: keep ordinary PR spend on Blacksmith Linux 2 vCPU):
#   linux-gates  — required PR check; Linux 3.11+3.12, ruff + pytest
#   windows      — push to main, workflow_dispatch, or PR label `ci:full`
#   macos        — same events as windows; GitHub-hosted macos-latest (no Blacksmith macOS)
#
# This workflow supersedes the Blacksmith Migration Wizard PR that only swapped
# runner labels (open PR #100, branch blacksmith-migration-33156c9).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same ref supersedes the run it interrupted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    name: filter
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      run-tests: ${{ steps.decide.outputs.run-tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Decide whether code gates must run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch always runs hosted gates."
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE"
            HEAD="$PR_HEAD"
          else
            BASE="$PUSH_BEFORE"
            HEAD="$PUSH_HEAD"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            echo "No base SHA; fail open to running tests."
            exit 0
          fi
          if ! git fetch --depth=1 origin "$BASE" || ! git fetch --depth=1 origin "$HEAD"; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            echo "Could not fetch diff endpoints; fail open to running tests."
            exit 0
          fi
          files="$(git diff --name-only "$BASE" "$HEAD" -- || true)"
          if [ -z "$files" ]; then
            echo "run-tests=false" >> "$GITHUB_OUTPUT"
            echo "No changed files; skip test jobs."
            exit 0
          fi
          echo "Changed files:"
          printf '%s\n' "$files"
          run_tests=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if printf '%s\n' "$f" | grep -Eq '^docs/|\.md$|^LICENSE([.].*)?$|^\.gitignore$|^\.gitattributes$|^\.editorconfig$'; then
              continue
            fi
            run_tests=true
            break
          done <<< "$files"
          echo "run-tests=${run_tests}" >> "$GITHUB_OUTPUT"
          echo "run-tests=${run_tests}"

  linux:
    name: linux
    needs: filter
    if: needs.filter.outputs.run-tests == 'true'
    # Optional hosted Linux diagnostic for the two CPython versions DEC-09 covers.
    # fail-fast is off so every requested cell reports. Does not replace the local
    # Ubuntu/WSL2 cells.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-gates
        with:
          python-version: ${{ matrix.python-version }}

  # Stable required status-check name. Passes when the Linux matrix succeeded, or
  # when Linux was skipped because the change is docs-only. Configure branch
  # protection / rulesets to require exactly this name: linux-gates
  linux-gates:
    name: linux-gates
    needs: [filter, linux]
    if: always() && !cancelled()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Required Linux gate
        run: |
          set -euo pipefail
          filter="${{ needs.filter.result }}"
          linux="${{ needs.linux.result }}"
          echo "filter=${filter} linux=${linux}"
          if [ "$filter" != "success" ]; then
            echo "filter job did not succeed"
            exit 1
          fi
          if [ "$linux" = "success" ] || [ "$linux" = "skipped" ]; then
            exit 0
          fi
          echo "linux matrix result=${linux}"
          exit 1

  windows:
    name: windows
    needs: filter
    if: >
      needs.filter.outputs.run-tests == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full'))
      )
    # Hosted Windows supplements, but does not replace, the DEC-09 native-Windows cells.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-gates
        with:
          python-version: ${{ matrix.python-version }}

  macos:
    name: macos
    needs: filter
    if: >
      needs.filter.outputs.run-tests == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full'))
      )
    # Best-effort portability only. Single 3.12 cell: a 3.11/3.12 macos-latest
    # matrix would dominate the ~$40/month Actions budget. Blacksmith has no
    # macOS runners for this org, so this stays on GitHub-hosted macos-latest.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-gates
        with:
          python-version: "3.12"
