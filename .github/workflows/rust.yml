name: rust

# CSL-42: Rust book, costs, and PnL. This job builds the crate, runs its tests,
# installs the PyO3 extension, and re-runs the Python tests against that extension.
#
# Hosted cells follow the split already used by ci.yml:
#   linux   — Python 3.11 and 3.12 whenever this path filter runs
#   windows — Python 3.11 and 3.12 on push to main, workflow_dispatch, or the
#             pull_request label ci:full
#   macos   — Python 3.12 on workflow_dispatch or the pull_request label ci:full
# Nightly macOS stays in ci.yml (07:17 UTC, skipped when main was idle 24h) and
# is not duplicated here.
#
# The platform gate lives in `filter`. A job-level `if` cannot read `matrix`
# (GitHub evaluates it before the matrix exists, and the run fails with zero
# jobs). `filter` emits only the cells that should start.
# Ordinary labeled/unlabeled events do not start this workflow, so they cannot
# cancel an in-progress rust-book matrix. `ci:full` and `enhancement` re-trigger
# via ci-label-retrigger.yml (workflow_dispatch). Draft PRs skip the test cells
# until ready_for_review. `filter` is GitHub-hosted; rust-book stays on Blacksmith.
# Windows cells use Blacksmith 2 vCPU (same as ci.yml).
# Swatinem/rust-cache is redirected to Blacksmith's co-located cache.
#
# This workflow does not replace linux-gates or the DEC-09 local matrix (native
# Windows + Ubuntu/WSL2, each on Python 3.11 and 3.12). It does not touch
# brokers, live capital, or the order path. Landing any edit under
# .github/workflows/ still needs Lucas's sign-off.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Hosted platform scope (label retriggers may request Linux only)
        type: choice
        options: [full, linux]
        default: full
        required: false
      pr_number:
        description: PR identity for label retriggers (omit for manual branch runs)
        type: string
        default: ""
      pr_head_sha:
        description: Expected PR head for a label retrigger
        type: string
        default: ""
      merge_sha:
        description: Immutable PR merge candidate for a label retrigger
        type: string
        default: ""

# Manual/API dispatch defaults to full; enhancement-only label reruns request
# scope=linux without changing Linux gates or ordinary PR platform selection.
permissions:
  contents: read

concurrency:
  # Label dispatch suffixes bind expected head and scope because
  # `gh workflow run --ref` resolves to the current head; a stale label rerun
  # must not cancel that head's PR run or newer label run. Different scopes
  # cannot cancel each other on the same head. Ordinary PR groups omit SHA
  # so new pushes cancel old heads. Manual and queue runs are isolated.
  # Filter still fail-closes
  # stale dispatch context before billed rust-book work. Draft synchronize
  # stays in its own group so it cannot cancel a ready_for_review matrix.
  group: rust-${{ github.workflow }}-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.pr_number && format('label-{0}-{1}', inputs.pr_head_sha, inputs.scope || 'full') || github.event_name == 'workflow_dispatch' && format('manual-{0}', inputs.scope || 'full') || github.event_name == 'merge_group' && 'queue' || (github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft') || 'default' }}
  cancel-in-progress: true

jobs:
  filter:
    name: filter
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.gate.outputs.matrix }}
      has-cells: ${{ steps.gate.outputs.has-cells }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 2
      - name: Validate label dispatch context
        if: github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
          MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          set -euo pipefail
          # Plain manual/API dispatch retains the selected branch and full default.
          if [ -z "$PR_NUMBER$PR_HEAD_SHA$MERGE_SHA" ]; then
            exit 0
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # A branch advance between label event and dispatch must fail closed.
          [ "$GITHUB_SHA" = "$PR_HEAD_SHA" ]
          [ "$(git rev-parse HEAD)" = "$MERGE_SHA" ]
          [ "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA" ]
      - name: Choose hosted cells
        id: gate
        env:
          SKIP_CELLS: "false"
          CHECK_PATHS: ${{ github.event_name != 'workflow_dispatch' }}
          RUN_WINDOWS: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope != 'linux') || (github.event_name == 'merge_group') || (github.event_name == 'push') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
          RUN_MACOS: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope != 'linux') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
        run: |
          set -euo pipefail
          if [ "${CHECK_PATHS}" = "true" ] && [ -z "${DIFF_FILES+x}" ]; then
            base="${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}"
            head="${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha || github.sha }}"
            git fetch --depth=1 origin "$base" "$head" || true
            DIFF_FILES="$(git diff --name-only "$base" "$head" || printf 'rust/\n')"
            export DIFF_FILES
          fi
          python3 - <<'PY'
          import json, os

          RUST_PATHS = (
              "rust/",
              "app/quant/book/",
              "app/quant/costs.py",
              "app/quant/pnl.py",
              "app/tests/quant/book/",
              "app/tests/quant/test_pnl.py",
              "app/tests/quant/test_costs_rust_parity.py",
              "app/tests/quant/test_w21_cost_model.py",
              ".github/",
              "tools/required_ci_gate.py",
              "tools/test_queue_gates.py",
          )

          def relevant(files):
              for raw in files.splitlines():
                  f = raw.strip()
                  if not f:
                      continue
                  for prefix in RUST_PATHS:
                      if prefix.endswith("/"):
                          if f.startswith(prefix) or f == prefix.rstrip("/"):
                              return True
                      elif f == prefix:
                          return True
              return False

          include = []
          if os.environ.get("SKIP_CELLS") != "true" and (
                  os.environ.get("CHECK_PATHS") != "true" or relevant(os.environ.get("DIFF_FILES", "rust/"))):
              include = [
                  {"runner": "blacksmith-2vcpu-ubuntu-2404", "python-version": "3.11", "os-name": "linux"},
                  {"runner": "blacksmith-2vcpu-ubuntu-2404", "python-version": "3.12", "os-name": "linux"},
              ]
              if os.environ["RUN_WINDOWS"] == "true":
                  include.extend([
                      {"runner": "blacksmith-2vcpu-windows-2025", "python-version": "3.11", "os-name": "windows"},
                      {"runner": "blacksmith-2vcpu-windows-2025", "python-version": "3.12", "os-name": "windows"},
                  ])
              if os.environ["RUN_MACOS"] == "true":
                  include.append(
                      {"runner": "macos-latest", "python-version": "3.12", "os-name": "macos"}
                  )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("matrix<<EOF\n")
              fh.write(json.dumps({"include": include}))
              fh.write("\nEOF\n")
              fh.write(f"has-cells={'true' if include else 'false'}\n")
          PY

  # GitHub-hosted debounce; requires corrected #157 cross-head PR concurrency.
  # Only non-draft synchronize waits. Other events intentionally skip settle.
  # Waiting consumes hosted capacity and does not guarantee billing savings.
  settle:
    name: settle
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for a follow-up push to cancel this run
        run: sleep 120

  rust-book:
    name: rust-book (${{ matrix.os-name }} / py${{ matrix.python-version }})
    needs: [filter, settle]
    if: >
      always() && !cancelled() &&
      needs.filter.result == 'success' &&
      (
        needs.settle.result == 'success' ||
        (needs.settle.result == 'skipped' &&
          (github.event_name != 'pull_request' || github.event.action != 'synchronize' || github.event.pull_request.draft == true))
      ) && needs.filter.outputs.has-cells == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.filter.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          # Same channel as rust/rust-toolchain.toml. Passing `stable` as well
          # makes rustup download a second toolchain and then test 1.83.0.
          toolchain: "1.83.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Rust tests
        working-directory: rust
        run: cargo test --workspace
      - name: Build the Python extension
        run: |
          python -m pip install -U pip maturin
          python -m maturin build --release --manifest-path rust/cockpit-py/Cargo.toml
          python -c "import glob, subprocess, sys; wheels = glob.glob('rust/target/wheels/cockpit_quant-*.whl'); assert wheels, 'no wheel built'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', *wheels])"
      - name: Python book tests against the extension
        working-directory: app
        run: |
          python -m pip install pytest keyring
          python -m pytest -q tests/quant/book tests/quant/feed/test_feeds.py tests/quant/test_runner.py tests/quant/test_execution.py tests/quant/test_pnl.py tests/quant/test_w21_cost_model.py tests/quant/test_costs_rust_parity.py tests/quant/test_verify.py tests/test_invariants.py
      - name: Benchmark Rust against the Python reference
        run: |
          python rust/bench_compare.py
          python rust/bench_costs.py

  rust-gates:
    name: rust-gates
    needs: [filter, settle, rust-book]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          persist-credentials: false
      - name: Require all selected Rust cells or an explicit path noop
        env:
          FILTER_RESULT: ${{ needs.filter.result }}
          REQUIRED: ${{ needs.filter.outputs.has-cells }}
          RESULTS: ${{ toJSON(needs.rust-book.result) }}
          SETTLE_RESULT: ${{ needs.settle.result }}
          SETTLE_EXPECTED: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.draft != true }}
        run: |
          python3 - <<'PY'
          import json, os
          from tools.required_ci_gate import gate, settled
          passed = (settled(os.environ['SETTLE_RESULT'], os.environ['SETTLE_EXPECTED'])
                    and gate(os.environ['FILTER_RESULT'], os.environ['REQUIRED'],
                             [json.loads(os.environ['RESULTS'])]))
          raise SystemExit(0 if passed else 'Required Rust gate failed closed')
          PY
