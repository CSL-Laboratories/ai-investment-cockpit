name: rust

# CSL-42: the Rust FIFO book. This job builds the crate, runs its tests, installs
# the PyO3 extension, and re-runs the Python book tests against that extension.
#
# Hosted cells follow the split already used by ci.yml:
#   linux   — Python 3.11 and 3.12 whenever this path filter runs
#   windows — Python 3.11 and 3.12 on push to main, workflow_dispatch, or the
#             pull_request label ci:full
#   macos   — Python 3.12 on workflow_dispatch or the pull_request label ci:full
# Nightly macOS stays in ci.yml (07:17 UTC, skipped when main was idle 24h) and
# is not duplicated here.
#
# This workflow does not replace linux-gates or the DEC-09 local matrix (native
# Windows + Ubuntu/WSL2, each on Python 3.11 and 3.12). It does not touch
# brokers, live capital, or the order path. Landing any edit under
# .github/workflows/ still needs Lucas's sign-off.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "rust/**"
      - "app/quant/book/**"
      - "app/tests/quant/book/**"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "app/quant/book/**"
      - "app/tests/quant/book/**"
      - ".github/workflows/rust.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-book:
    name: rust-book (${{ matrix.os-name }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-2vcpu-ubuntu-2404
            python-version: "3.11"
            os-name: linux
          - runner: blacksmith-2vcpu-ubuntu-2404
            python-version: "3.12"
            os-name: linux
          - runner: blacksmith-4vcpu-windows-2025
            python-version: "3.11"
            os-name: windows
          - runner: blacksmith-4vcpu-windows-2025
            python-version: "3.12"
            os-name: windows
          - runner: macos-latest
            python-version: "3.12"
            os-name: macos
    if: >-
      matrix.os-name == 'linux'
      || github.event_name == 'workflow_dispatch'
      || (matrix.os-name == 'windows' && github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (matrix.os-name == 'windows' && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full'))
      || (matrix.os-name == 'macos' && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full'))
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Rust tests
        working-directory: rust
        run: cargo test --workspace
      - name: Build the Python extension
        run: |
          python -m pip install -U pip maturin
          python -m maturin build --release --manifest-path rust/cockpit-py/Cargo.toml
          python -c "import glob, subprocess, sys; wheels = glob.glob('rust/target/wheels/cockpit_quant-*.whl'); assert wheels, 'no wheel built'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', *wheels])"
      - name: Python book tests against the extension
        working-directory: app
        run: |
          python -m pip install pytest keyring
          python -m pytest -q tests/quant/book tests/quant/feed/test_feeds.py tests/quant/test_runner.py tests/quant/test_execution.py
      - name: Benchmark Rust against the Python reference
        run: python rust/bench_compare.py
