name: rust

# CSL-42: Rust book, costs, and PnL. This job builds the crate, runs its tests,
# installs the PyO3 extension, and re-runs the Python tests against that extension.
#
# Hosted cells follow the split already used by ci.yml:
#   linux   — Python 3.11 and 3.12 whenever this path filter runs
#   windows — Python 3.11 and 3.12 on push to main, workflow_dispatch, or the
#             pull_request label ci:full
#   macos   — Python 3.12 on workflow_dispatch or the pull_request label ci:full
# Nightly macOS stays in ci.yml (07:17 UTC, skipped when main was idle 24h) and
# is not duplicated here.
#
# The platform gate lives in `filter`. A job-level `if` cannot read `matrix`
# (GitHub evaluates it before the matrix exists, and the run fails with zero
# jobs). `filter` emits only the cells that should start.
# Ordinary labeled/unlabeled events do not start this workflow, so they cannot
# cancel an in-progress rust-book matrix. `ci:full` and `enhancement` re-trigger
# via ci-label-retrigger.yml (workflow_dispatch). Draft PRs skip the test cells
# until ready_for_review. `filter` is GitHub-hosted; rust-book stays on Blacksmith.
# Windows cells use Blacksmith 2 vCPU (same as ci.yml).
# Swatinem/rust-cache is redirected to Blacksmith's co-located cache.
#
# This workflow does not replace linux-gates or the DEC-09 local matrix (native
# Windows + Ubuntu/WSL2, each on Python 3.11 and 3.12). It does not touch
# brokers, live capital, or the order path. Landing any edit under
# .github/workflows/ still needs Lucas's sign-off.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "rust/**"
      - "app/quant/book/**"
      - "app/quant/costs.py"
      - "app/quant/pnl.py"
      - "app/tests/quant/book/**"
      - "app/tests/quant/test_pnl.py"
      - "app/tests/quant/test_costs_rust_parity.py"
      - "app/tests/quant/test_w21_cost_model.py"
      - ".github/workflows/rust.yml"
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "app/quant/book/**"
      - "app/quant/costs.py"
      - "app/quant/pnl.py"
      - "app/tests/quant/book/**"
      - "app/tests/quant/test_pnl.py"
      - "app/tests/quant/test_costs_rust_parity.py"
      - "app/tests/quant/test_w21_cost_model.py"
      - ".github/workflows/rust.yml"
  workflow_dispatch:
    inputs:
      scope:
        description: Hosted platform scope (label retriggers may request Linux only)
        type: choice
        options: [full, linux]
        default: full
        required: false
      pr_number:
        description: PR identity for label retriggers (omit for manual branch runs)
        type: string
        default: ""
      pr_head_sha:
        description: Expected PR head for a label retrigger
        type: string
        default: ""
      merge_sha:
        description: Immutable PR merge candidate for a label retrigger
        type: string
        default: ""

# Manual/API dispatch defaults to full; enhancement-only label reruns request
# scope=linux without changing Linux gates or ordinary PR platform selection.
permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'draft' || 'default' }}
  cancel-in-progress: true

jobs:
  filter:
    name: filter
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.gate.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 2
      - name: Validate label dispatch context
        if: github.event_name == 'workflow_dispatch'
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
          MERGE_SHA: ${{ inputs.merge_sha }}
        run: |
          set -euo pipefail
          # Plain manual/API dispatch retains the selected branch and full default.
          if [ -z "$PR_NUMBER$PR_HEAD_SHA$MERGE_SHA" ]; then
            exit 0
          fi
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]]
          # A branch advance between label event and dispatch must fail closed.
          [ "$GITHUB_SHA" = "$PR_HEAD_SHA" ]
          [ "$(git rev-parse HEAD)" = "$MERGE_SHA" ]
          [ "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA" ]
      - name: Choose hosted cells
        id: gate
        env:
          RUN_WINDOWS: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope != 'linux') || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
          RUN_MACOS: ${{ (github.event_name == 'workflow_dispatch' && inputs.scope != 'linux') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full')) }}
        run: |
          python3 - <<'PY'
          import json, os
          include = [
              {"runner": "blacksmith-2vcpu-ubuntu-2404", "python-version": "3.11", "os-name": "linux"},
              {"runner": "blacksmith-2vcpu-ubuntu-2404", "python-version": "3.12", "os-name": "linux"},
          ]
          if os.environ["RUN_WINDOWS"] == "true":
              include.extend([
                  {"runner": "blacksmith-2vcpu-windows-2025", "python-version": "3.11", "os-name": "windows"},
                  {"runner": "blacksmith-2vcpu-windows-2025", "python-version": "3.12", "os-name": "windows"},
              ])
          if os.environ["RUN_MACOS"] == "true":
              include.append(
                  {"runner": "macos-latest", "python-version": "3.12", "os-name": "macos"}
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("matrix<<EOF\n")
              fh.write(json.dumps({"include": include}))
              fh.write("\nEOF\n")
          PY

  rust-book:
    name: rust-book (${{ matrix.os-name }} / py${{ matrix.python-version }})
    needs: filter
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.filter.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          # Same channel as rust/rust-toolchain.toml. Passing `stable` as well
          # makes rustup download a second toolchain and then test 1.83.0.
          toolchain: "1.83.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Rust tests
        working-directory: rust
        run: cargo test --workspace
      - name: Build the Python extension
        run: |
          python -m pip install -U pip maturin
          python -m maturin build --release --manifest-path rust/cockpit-py/Cargo.toml
          python -c "import glob, subprocess, sys; wheels = glob.glob('rust/target/wheels/cockpit_quant-*.whl'); assert wheels, 'no wheel built'; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', *wheels])"
      - name: Python book tests against the extension
        working-directory: app
        run: |
          python -m pip install pytest keyring
          python -m pytest -q tests/quant/book tests/quant/feed/test_feeds.py tests/quant/test_runner.py tests/quant/test_execution.py tests/quant/test_pnl.py tests/quant/test_w21_cost_model.py tests/quant/test_costs_rust_parity.py tests/quant/test_verify.py tests/test_invariants.py
      - name: Benchmark Rust against the Python reference
        run: |
          python rust/bench_compare.py
          python rust/bench_costs.py
