name: review-gate

# Required on PRs and queue groups; never path-skipped. Read-only permissions.
# Manual recovery: rerun after Devin finishes, or dispatch on the live PR branch.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number; select its exact live head branch before dispatch
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number || inputs.pr_number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: review-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Load the base's script. The workflow YAML itself is still PR-controlled;
          # this does not replace direct Devin protection (see staged rollout).
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.repository.default_branch }}
          persist-credentials: false
      - name: Require current authenticated Devin Review on every PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -X utf8 -B scripts/ci/review_gate.py
