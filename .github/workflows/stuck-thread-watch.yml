# In-repo stuck-thread watch, started by a person (CSL-238).
# It lists Devin/Claude review threads that look stuck in the job log and step
# summary. It posts nothing on the PR and holds no write token. The Codex
# mediator it used to call, and its schedule and comment triggers, were removed
# with the Codex CI/fixer gate.
# Linear: one roll-up issue per PR (`Stuck PR threads: <repo>#<PR>`), updated in
# place, only when FILE_LINEAR is "true". Shared key: `<!-- stuck-pr-threads:owner/repo#N -->`.
# Skip already-approved PRs. Never one Linear issue per thread.
name: Stuck thread watch

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Only scan this PR number (optional)"
        required: false
        default: ""

# Tune without editing the script. FILE_LINEAR is off (CSL-862): no Linear issue is
# created or updated. Set it back to "true" to file the roll-ups again.
env:
  STUCK_HOURS: "6"
  QUOTE_LIMIT: "2000"
  DEVIN_LOGIN: "devin-ai-integration[bot]"
  CLAUDE_LOGINS: "claude[bot],claude"
  FILE_LINEAR: "false"
  NEEDS_DECISION_LABEL: "needs-decision"
  LINEAR_TEAM_KEY: "CSL"
  LINEAR_LABELS: "needs-decision,auto-filed"
  LINEAR_PROJECT: "ai-investment-cockpit"
  LINEAR_REPO_LABEL: "ai-investment-cockpit"

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: stuck-thread-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout watcher
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Scan stuck threads
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 .github/scripts/stuck_thread_watch.py
