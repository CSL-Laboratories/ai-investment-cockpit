# Codex auto-resolve for review threads (CSL-179).
# GitHub-hosted ubuntu-latest on purpose: do not spend Blacksmith minutes.
# Parses the shared per-thread marker contract (recursion CSL-178 uses the same):
#   <!-- codex-thread-verdict:<thread_id>:<sha>:RESOLVE|KEEP -->
#   CODEX-THREAD: RESOLVE|KEEP thread=<thread_id> sha=<sha>
# RESOLVE + current head SHA + green required checks → GraphQL resolveReviewThread
# and a short reply citing the ruling. KEEP / missing fix / ambiguous / stale SHA
# leave the Linear needs-decision path in place.
#
# Does not post @codex review (that is #124 / #131). Never pushes or merges.
# Missing CODEX_TRIGGER_PAT is a ::notice:: skip, not a failure.
#
# Token: writes (thread reply + resolveReviewThread) use repo secret
# CODEX_TRIGGER_PAT — the same PAT that posts @codex review for the gate and
# stuck-thread watcher. GITHUB_TOKEN is read-only. The PAT identity is what
# GitHub records as resolving the thread.
name: Codex auto-resolve

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  schedule:
    # Catch Codex reviews that land a few minutes after @codex review.
    # Offset from the gate (7/17/27/...) and stuck-thread watch (23 */2).
    - cron: "11,31,51 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Only scan this PR number (optional)"
        required: false
        default: ""

env:
  MAX_RESOLVES_PER_PR_PER_DAY: "20"
  MAX_RESOLVES_PER_RUN: "10"
  QUOTE_LIMIT: "240"

# Writes go through CODEX_TRIGGER_PAT. GITHUB_TOKEN only reads.
permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: codex-auto-resolve
  cancel-in-progress: false

jobs:
  resolve:
    # Same-repo only. Comment/review events only if Codex posted them.
    # Forks never get the PAT or a checkout of untrusted code.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request_review' &&
        github.event.review.user.login == 'chatgpt-codex-connector[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Check trigger PAT
        id: pat
        env:
          CODEX_TRIGGER_PAT: ${{ secrets.CODEX_TRIGGER_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${CODEX_TRIGGER_PAT}" ]; then
            echo "::notice::CODEX_TRIGGER_PAT is not configured; skipping Codex auto-resolve."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.pat.outputs.skip != 'true'
        with:
          # Trusted default-branch copy. Never run the PR head with the PAT.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Auto-resolve Codex-ruled threads
        if: steps.pat.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_TRIGGER_PAT: ${{ secrets.CODEX_TRIGGER_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.issue.number || github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          # First-merge bootstrap: this workflow ships in the PR, but the
          # PAT job checks out the default branch so it never runs PR-head
          # code. Until the script lands on main, skip with a notice.
          if [ ! -f .github/scripts/codex_auto_resolve.py ]; then
            echo "::notice::codex_auto_resolve.py is not on the default branch yet; skipping until first merge."
            exit 0
          fi
          python3 -X utf8 -B .github/scripts/codex_auto_resolve.py
