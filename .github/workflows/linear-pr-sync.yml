# Keep one Linear comment current per PR so Grok Bots can see shared-file risk.
# Not a required check. Missing LINEAR_API_KEY is a skip, not a failure.
# pull_request_target + default-branch checkout: LINEAR_API_KEY never runs a PR-head script.
name: Linear PR sync

on:
  # CSL-862: Linear writes are off. The automatic triggers are commented out;
  # revert this commit to restore them. A manual run has no PR number, so the
  # script prints "no PR_NUMBER" and exits without calling Linear.
  workflow_dispatch:
  # pull_request_target:
  #   types: [opened, synchronize, reopened, ready_for_review, closed]
  # push:
  #   branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: linear-pr-sync-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout default-branch script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Upsert Linear PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
        run: python3 .github/scripts/linear_pr_sync.py
