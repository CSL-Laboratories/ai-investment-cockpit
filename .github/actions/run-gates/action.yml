name: run-gates
description: Install the CI dependency set, run Ruff, then pytest. Pins a short Windows TMP.

inputs:
  python-version:
    description: CPython version for this cell
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: .github/actions/run-gates/requirements.txt
    - name: Restore CI virtualenv
      id: venv-cache
      uses: actions/cache@v4
      with:
        path: .venv
        key: run-gates-${{ runner.os }}-${{ runner.arch }}-CPython${{ inputs.python-version }}-${{ hashFiles('.github/actions/run-gates/requirements.txt') }}
    - name: Create venv and install pinned dependencies
      if: steps.venv-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
      run: |
        set -euo pipefail
        python -m venv .venv
        if [ -x .venv/bin/python ]; then
          venv_py=.venv/bin/python
        else
          venv_py=.venv/Scripts/python.exe
        fi
        "$venv_py" -m pip install -r .github/actions/run-gates/requirements.txt
    - name: Put the CI virtualenv on PATH
      shell: bash
      run: |
        set -euo pipefail
        if [ -d .venv/bin ]; then
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        else
          echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
        fi
    - name: Lint
      working-directory: app
      shell: bash
      run: ruff check .
    # Pinned SHORT because pytest nests its generated tmp dirs under the runner temp path,
    # and combined with this repo's deep fixture paths that crosses MAX_PATH — surfacing as
    # ~80 bogus WinError 3 / WinError 206 failures in the parquet and tempfile paths that
    # have nothing to do with the code under test. Set via GITHUB_ENV rather than a step
    # `env:` block so the other two platforms are not handed an empty TMP.
    - name: Pin a short TMP (Windows MAX_PATH)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force C:\t | Out-Null
        "TMP=C:\t"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "TEMP=C:\t" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: Gates + tests (merge blockers)
      # Includes the Invariant-1 call-site, no-LLM-in-risk, and secrets-grep gates (test_invariants.py).
      working-directory: app
      shell: bash
      run: python -m pytest -q
