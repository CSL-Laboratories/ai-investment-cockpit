name: run-gates
description: Install the CI dependency set, run Ruff, then pytest. Pins a short Windows TMP.

inputs:
  python-version:
    description: CPython version for this cell
    required: true

runs:
  using: composite
  steps:
    # CSL-471 REVIEW-D8 J3: do not enable setup-python's pip cache. The post-step
    # would save ~/.cache/pip into the default-branch cache scope under a
    # PR-influenced key; later jobs restore it by prefix. Fresh venv each run
    # (environments embed absolute paths and must not be restored across runners).
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Create fresh venv and install pinned direct dependencies
      shell: bash
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
      run: python -P .github/actions/run-gates/install.py
    - name: Put the CI virtualenv on PATH
      shell: bash
      run: |
        set -euo pipefail
        if [ -d .venv/bin ]; then
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
        else
          echo "$GITHUB_WORKSPACE/.venv/Scripts" >> "$GITHUB_PATH"
        fi
    - name: Verify dependency installer regressions
      shell: bash
      run: python -X utf8 -B tools/test_run_gates_action.py
    - name: Lint
      working-directory: app
      shell: bash
      run: ruff check .
    # Pinned SHORT because pytest nests its generated tmp dirs under the runner temp path,
    # and combined with this repo's deep fixture paths that crosses MAX_PATH — surfacing as
    # ~80 bogus WinError 3 / WinError 206 failures in the parquet and tempfile paths that
    # have nothing to do with the code under test. Set via GITHUB_ENV rather than a step
    # `env:` block so the other two platforms are not handed an empty TMP.
    - name: Pin a short TMP (Windows MAX_PATH)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force C:\t | Out-Null
        "TMP=C:\t"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "TEMP=C:\t" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: Gates + tests (merge blockers)
      # Includes the Invariant-1 call-site, no-LLM-in-risk, and secrets-grep gates (test_invariants.py).
      working-directory: app
      shell: bash
      run: python -m pytest -q
