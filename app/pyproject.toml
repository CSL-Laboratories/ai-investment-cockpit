[project]
name = "ai-investment-cockpit"
version = "0.0.0"
description = "Local AI Investment Cockpit — solo-dev, subscription-powered, human-gated AI investing copilot."
requires-python = ">=3.11"
# Full runtime deps documented here; CI installs this set plus pytest/ruff explicitly
# (.github/workflows/ci.yml). Every validation cell includes discord.py; fallback is isolated.
# Pin + hash-lock before install — supply-chain hardening (docs/security-architecture §7).
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "discord.py",
  "apscheduler",
  "sqlalchemy",
  "duckdb",
  "pyarrow",
  "jsonschema",
  "keyring",
  "pydantic",
  "pydantic-settings",
  "pyyaml",
  "httpx",
  "websockets",
  "boto3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# discord.py 2.7.1 imports stdlib audioop at discord/player.py (module discord.player).
# On 3.11/3.12 that import emits one DeprecationWarning. Ignore that message from
# that module only; every other warning stays in the pytest summary. Python >=3.13
# is covered by discord.py's audioop-lts marker (see CLAUDE.md), not by this filter.
filterwarnings = [
  "ignore:'audioop' is deprecated and slated for removal in Python 3\\.13:DeprecationWarning:discord\\.player",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
