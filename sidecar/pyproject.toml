[project]
name = "cockpit-sidecar"
version = "0.1.0"
description = "Standalone quant sidecars for the AI Investment Cockpit. Not on the order path."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["sidecar", "tests"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
