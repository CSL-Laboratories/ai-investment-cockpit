[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cockpit-sidecar"
version = "0.1.0"
description = "Standalone quant sidecars. The experimental paper runner is a separate Alpaca paper path, not the cockpit order path."
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
kronos = [
    "torch>=2.2",
    "pandas>=2.2",
    "einops>=0.8",
    "huggingface_hub==0.33.1",
    "safetensors>=0.4",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["sidecar*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["sidecar", "tests"]
extend-exclude = ["sidecar/kronos_signal/vendor"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
